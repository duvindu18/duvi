# Ceylon Buildex: tests on Linux, then builds the Windows Setup program on a Windows runner, installs it silently,
# starts the installed program, checks it works and that closing it stops everything, and uninstalls it.
# The Setup program is kept as a downloadable artifact (Actions run page -> Artifacts -> CeylonBuildex-Setup).
name: Ceylon Buildex installer

on:
  workflow_dispatch:
  push:
    branches: ["**"]               # with only `tags` listed, GitHub would skip every branch push
    paths:
      - "ceylon-buildex/**"
      - ".github/workflows/ceylon-buildex-installer.yml"
    tags: ["cb-v*"]

defaults:
  run:
    working-directory: ceylon-buildex

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ceylon-buildex/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Browser test (desktop title bar, themes, layouts)
        run: |
          python -m playwright install --with-deps chromium
          python tests/ui_smoke.py "" shots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ceylon-buildex/shots/
          if-no-files-found: ignore

  installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ceylon-buildex/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ceylon-buildex/desktop/package-lock.json
      - run: pip install -r requirements.txt pyinstaller playwright
      - name: Install the OCR tools that get bundled into the program
        run: choco install tesseract poppler -y --no-progress
      - name: Build the back end and the Setup program
        run: python scripts/build_installer.py --clean
      - name: Smoke test the back end
        run: python scripts/smoke_exe.py
      - name: Install silently, start the installed program, close it
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/installer/CeylonBuildex-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "CeylonBuildexApp"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait
          if (-not (Test-Path (Join-Path $dir "CeylonBuildex.exe"))) { throw "the installer did not install CeylonBuildex.exe" }
          python scripts/smoke_exe.py --installed $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $un = Get-ChildItem $dir -Filter "Uninstall*.exe" | Select-Object -First 1
          Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait
          $end = (Get-Date).AddSeconds(90)
          while ((Test-Path (Join-Path $dir "CeylonBuildex.exe")) -and (Get-Date) -lt $end) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir "CeylonBuildex.exe")) { throw "the uninstaller left the program behind" }
          "installed, ran, closed and uninstalled cleanly"
      - uses: actions/upload-artifact@v4
        with:
          name: CeylonBuildex-Setup
          path: ceylon-buildex/dist/installer/CeylonBuildex-Setup-*.exe
          if-no-files-found: error
