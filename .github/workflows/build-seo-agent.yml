name: Build ArchViz SEO exe

on:
  push:
    paths:
      - "seo_agent/**"
      - ".github/workflows/build-seo-agent.yml"
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r seo_agent/requirements-build.txt pillow
      - name: Unit tests
        run: python -m pytest -q seo_agent/tests
      - name: Build ArchVizSEO.exe
        run: python seo_agent/packaging/build_exe.py
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ArchVizSEO.exe -ArgumentList "--no-browser" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/status
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "exe did not start its web server" }
          Write-Host "exe served /api/status OK"
      - uses: actions/upload-artifact@v4
        with:
          name: ArchVizSEO-windows
          path: |
            dist/ArchVizSEO.exe
            dist/ArchVizSEO.exe.sha256
