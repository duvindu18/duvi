; PHP settings for this site (read by PHP on Namecheap / CloudLinux hosting).
; Allows photo uploads from the admin panel. Changes can take up to 5 minutes.
upload_max_filesize = 16M
post_max_size = 64M
max_file_uploads = 30
memory_limit = 256M
max_execution_time = 120
display_errors = Off
log_errors = On
