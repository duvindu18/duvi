<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArchRailing Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 13px/18px var(--sans);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;overflow:hidden}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .hide{display:none!important}
  .eyebrow{font-size:11px;line-height:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .cap{font-size:12px;line-height:16px;color:var(--muted)}

  /* wells: a field-filled track with a raised selected item */
  .well{display:flex;gap:2px;padding:3px;background:var(--field);border-radius:10px}
  .well button{flex:1;height:28px;min-width:30px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:12px;white-space:nowrap;display:grid;place-items:center}
  .well button:hover{color:var(--ink)}
  .well button[aria-pressed=true],.well button[aria-selected=true]{background:var(--raised);color:var(--ink);box-shadow:var(--sel-shadow)}
  .frame{display:flex;align-items:center;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
  .frame .ib{width:32px;height:32px;border-radius:7px}

  /* header */
  .hd{flex:none;display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mark{width:24px;height:24px;border-radius:7px;background:var(--ink);color:var(--inv);display:grid;place-items:center;flex:none}
  .mark svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square}
  .hd h1{margin:0;font-size:15px;line-height:20px;font-weight:600;white-space:nowrap}
  .crumb{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;background:var(--field);font-size:12px;white-space:nowrap}
  .badge .dot{width:6px;height:6px;border-radius:3px;background:var(--accent)}
  .sp{flex:1}
  .ib{width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:var(--r-sm);display:grid;place-items:center}
  .ib:hover{background:var(--field);color:var(--ink)}

  /* body: rail | main | side */
  .bd{flex:1;min-height:0;display:flex;gap:12px;padding:12px;overflow:hidden}
  .rail{flex:none;align-self:flex-start;display:flex;flex-direction:column;gap:2px;padding:4px;background:var(--field);border-radius:var(--r-md)}
  .rail button{width:40px;height:40px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--muted);display:grid;place-items:center}
  .rail button:hover{color:var(--ink)}
  .rail button[aria-pressed=true]{background:var(--raised);color:var(--ink);box-shadow:var(--sel-shadow)}
  .rail svg.i{width:20px;height:20px}
  .main{flex:1 1 560px;min-width:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:2px}
  .side{flex:0 0 360px;min-width:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}

  /* viewport */
  .vp{position:relative;background:var(--viewport);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;flex:none}
  .vp svg.scene{display:block;width:100%;height:auto;aspect-ratio:16/10;touch-action:none;cursor:grab;user-select:none}
  .vp svg.scene:active{cursor:grabbing}
  .ov{position:absolute;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;pointer-events:none}
  .ov.t{top:12px}.ov.b{bottom:12px;align-items:flex-end}
  .ov>*{pointer-events:auto}
  .vp .well button{height:30px;flex:none}
  .vp .well button.t{width:30px;min-width:30px;padding:0}
  .vp .well svg.i,.frame .ib svg.i{width:16px;height:16px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--ink);white-space:nowrap}
  .chip svg.i{width:12px;height:12px;color:var(--muted)}

  /* presets */
  .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ph .eyebrow{flex:1;min-width:120px}
  .fld{height:var(--row);padding:0 12px;background:var(--field);border:0;border-radius:var(--r-sm);min-width:0}
  .fld::placeholder{color:var(--muted)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .tile{display:flex;flex-direction:column;gap:8px;padding:4px 4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);color:var(--muted);font-size:12px;text-align:left;min-width:0}
  .tile:hover{color:var(--ink);border-color:var(--strong)}
  .tile[aria-pressed=true]{border-color:var(--ink);color:var(--ink)}
  .tile svg{display:block;width:100%;height:auto;aspect-ratio:16/10;background:var(--viewport);border-radius:var(--r-sm)}
  .tile span{padding:0 8px;line-height:16px}

  /* side panel */
  .sh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 12px}
  .sh h2{margin:0;font-size:15px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sh .well button{flex:none;min-width:40px}
  .tabs{flex:none;margin:0 16px 8px}
  .pane{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 8px}
  .grp{margin:16px 0 8px}
  .grp:first-child{margin-top:4px}
  .rows{display:flex;flex-direction:column;gap:8px}

  /* row slider: one 40px filled row, label left, value right, the fill is the slider */
  .rs{position:relative;height:var(--row);border-radius:var(--r-sm);background:var(--field);overflow:hidden;cursor:ew-resize}
  .rs:focus-within{box-shadow:0 0 0 2px var(--accent)}
  .rs .fi{position:absolute;left:0;top:0;bottom:0;background:var(--field-strong)}
  .rs .dots{position:absolute;right:96px;top:18px;height:4px;background-image:radial-gradient(circle,var(--strong) 1.1px,transparent 1.5px);background-size:22px 4px;background-repeat:repeat-x}
  .rs .hb{position:absolute;top:13px;bottom:13px;width:2px;margin-left:-10px;border-radius:1px;background:var(--muted)}
  .rs label{position:absolute;left:12px;top:11px;color:var(--muted);pointer-events:none;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
  .rs input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
  .rs .val{position:absolute;right:6px;top:4px;height:32px;display:flex;align-items:center;gap:2px;z-index:1}
  .rs .val input{width:64px;height:28px;padding:0 4px;text-align:right;background:transparent;border:0;border-radius:7px;font-variant-numeric:tabular-nums}
  .rs .val input:hover{background:var(--surface)}
  .rs .val input:focus{background:var(--surface);outline:0}
  .rs .val i{font-style:normal;color:var(--muted);padding-right:6px}

  /* switch rows, choice wells, swatch and select rows */
  .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .sw{display:flex;align-items:center;justify-content:space-between;gap:8px;height:var(--row);padding:0 10px 0 12px;border:0;border-radius:var(--r-sm);background:var(--field);color:var(--muted);text-align:left;min-width:0}
  .sw:hover{color:var(--ink)}
  .sw .k{position:relative;flex:none;width:36px;height:20px;border-radius:10px;background:var(--sunken)}
  .sw .k::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:var(--strong);transition:left .12s}
  .sw[aria-checked=true] .k{background:var(--accent)}
  .sw[aria-checked=true] .k::after{left:18px;background:var(--accent-ink)}
  .field{display:flex;flex-direction:column;gap:6px}
  .field>.cap{padding-left:2px}
  .rowf{display:flex;align-items:center;justify-content:space-between;gap:8px;height:var(--row);padding:0 5px 0 12px;border-radius:var(--r-sm);background:var(--field);color:var(--muted)}
  .rowf select{max-width:62%;height:30px;padding:0 6px;border:0;border-radius:7px;background:transparent;color:var(--ink);text-align:right}
  .rowf select:hover{background:var(--surface)}
  .swr{position:relative;width:30px;height:30px;padding:3px;border-radius:15px;border:2px solid var(--line);cursor:pointer;flex:none}
  .swr:hover{border-color:var(--ink)}
  .swr span{display:block;width:100%;height:100%;border-radius:50%}
  .swr input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

  /* readout cards */
  .stats{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 16px 0;border-top:1px solid var(--line)}
  .card{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:76px;padding:12px;background:var(--field);border-radius:var(--r-md);min-width:0}
  .card .h{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
  .card .n{font-size:20px;line-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .n i{font-style:normal;color:var(--faint)}
  .card svg{width:14px;height:14px;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .card .ok{stroke:var(--ok)}.card .wn{stroke:var(--warn)}

  /* actions */
  .act{flex:none;display:flex;flex-direction:column;gap:8px;padding:12px 16px 16px}
  .act .r{display:flex;gap:8px;align-items:center}
  .act .sw{flex:1;white-space:nowrap}
  .btn{height:var(--row);padding:0 14px;border:0;border-radius:var(--r-sm);background:var(--field);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .btn:hover{background:var(--field-strong)}
  .btn:disabled{opacity:.4;pointer-events:none}
  .btn.pri{flex:1;background:var(--ink);color:var(--inv);font-size:14px}
  .btn.pri:hover{opacity:.86;background:var(--ink)}
  .btn.sq{width:var(--row);padding:0;flex:none}
  .toast{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 4px 4px 12px;background:var(--field);border-radius:var(--r-md);font-size:12px;line-height:16px}
  .toast svg{width:16px;height:16px;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .toast .msg{flex:1;min-width:0}
  .toast .u{height:32px;padding:0 12px;border:0;border-radius:var(--r-sm);background:var(--surface);font-size:12px}

  @media (max-width:760px){
    body{overflow:auto;height:auto}
    .bd{flex-direction:column;overflow:visible}
    .rail{flex-direction:row;flex-wrap:wrap;align-self:stretch;justify-content:center}
    .main{overflow:visible}
    .side{flex:none;overflow:visible}
    .pane{overflow:visible}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="hd">
  <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6h18M4 6v13M20 6v13M12 6v13M8 9v10M16 9v10" /></svg></span>
  <h1>ArchRailing Pro</h1>
  <span class="crumb" id="crumb">/ Custom</span>
  <span class="badge hide" id="live-badge"><span class="dot" aria-hidden="true"></span>Live</span>
  <span class="sp"></span>
  <span class="badge" id="mode">No selection</span>
  <button class="ib" id="theme" type="button" aria-label="Dark mode" title="Dark mode"></button>
  <button class="ib" id="close" type="button" aria-label="Close" title="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</header>

<div class="bd">
  <nav class="rail" id="rail" aria-label="Railing categories"></nav>

  <main class="main">
    <section class="vp" aria-label="Live preview">
      <svg class="scene" id="scene" viewBox="0 0 640 400" role="img" aria-label="3D preview of the railing, drag to orbit"></svg>
      <div class="ov t">
        <div class="frame"><div class="well" role="group" aria-label="Standard views" id="views"></div></div>
        <div class="frame"><div class="well" role="group" aria-label="Display">
          <button class="t" type="button" id="tg-edges" aria-pressed="true" aria-label="Edges" title="Edges"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></button>
          <button class="t" type="button" id="tg-xray" aria-pressed="false" aria-label="X-ray" title="X-ray"><svg class="i" viewBox="0 0 24 24" stroke-dasharray="2.5 2.5"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></button>
          <button class="t" type="button" id="tg-spin" aria-pressed="false" aria-label="Auto-rotate" title="Auto-rotate"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg></button>
        </div>
          <button class="ib" type="button" id="z-out" aria-label="Zoom out" title="Zoom out"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M16.5 16.5L21 21"/></svg></button>
          <button class="ib" type="button" id="z-in" aria-label="Zoom in" title="Zoom in"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M16.5 16.5L21 21"/></svg></button>
          <button class="ib" type="button" id="z-fit" aria-label="Zoom to fit" title="Zoom to fit"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
      </div>
      <div class="ov b">
        <span class="chip"><svg class="i" viewBox="0 0 24 24"><path d="M3 21L21 3M3 21v-6M3 21h6M21 3v6M21 3h-6"/></svg><span id="dims"></span></span>
        <span class="chip"><svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4"/><path d="M12 3v18"/></svg><span id="orbit"></span></span>
      </div>
    </section>

    <div class="ph">
      <span class="eyebrow" id="ptitle">Ready-made railings</span>
      <input class="fld" id="pname" placeholder="Name this setup" maxlength="60" aria-label="Preset name">
      <button class="btn" type="button" id="psave">Save preset</button>
      <button class="btn hide" type="button" id="pdel">Delete</button>
    </div>
    <div class="tiles" id="tiles" role="group" aria-label="Ready-made railings"></div>
  </main>

  <aside class="side" aria-label="Parameters">
    <div class="sh">
      <h2 id="ptitle2">Railing</h2>
      <div class="well" role="group" aria-label="Units">
        <button type="button" id="u-mm" aria-pressed="true">mm</button>
        <button type="button" id="u-in" aria-pressed="false">in</button>
      </div>
    </div>
    <div class="well tabs" role="tablist" id="tabs"></div>
    <div class="pane" id="pane"></div>
    <div class="stats" id="stats"></div>
    <div class="act">
      <div class="r">
        <button type="button" class="sw" role="switch" id="live" aria-checked="true">Live update<span class="k" aria-hidden="true"></span></button>
        <button class="btn" type="button" id="b-path" title="Select one railing and its new edges">Change path</button>
      </div>
      <div class="r">
        <button class="btn sq" type="button" id="b-update" aria-label="Update selected railings" title="Update selected railings"><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg></button>
        <button class="btn pri" type="button" id="b-create"><svg class="i" viewBox="0 0 24 24"><path d="M3 20h18M5 7v13M19 7v13M12 7v13M3 7h18"/></svg>Create railing</button>
      </div>
      <div class="toast" id="toast" role="status"><svg viewBox="0 0 24 24" id="toast-ic"></svg><span class="msg" id="status">Select edges, a curve or an arc, then create a railing.</span><button class="u hide" type="button" id="undo">Undo</button></div>
    </div>
  </aside>
</div>

<script src="dialog.js"></script>
</body>
</html>
