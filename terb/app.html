<title>TERB Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one monochrome column; record-book tables scroll inside their own frames. */
:root{
  --bg:#f2f2f2; --surface:#ffffff; --ink:#0b0b0b; --mute:#7c7c7c; --line:#d6d6d6; --soft:#e7e7e7;
  --on-ink:#ffffff; --hatch:rgba(11,11,11,.16);
  --f-display:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-pill:999px; --r-card:22px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0d0d; --surface:#161616; --ink:#f1f1f1; --mute:#8b8b8b; --line:#2b2b2b; --soft:#1f1f1f;
  --on-ink:#0d0d0d; --hatch:rgba(241,241,241,.2); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#161616; --ink:#f1f1f1; --mute:#8b8b8b; --line:#2b2b2b; --soft:#1f1f1f;
  --on-ink:#0d0d0d; --hatch:rgba(241,241,241,.2); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:clamp(26px,4vw,38px);font-weight:700;line-height:1.05}
h3{font-size:18px;font-weight:650;letter-spacing:-.01em}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.03em;text-decoration:none}
.mark{width:34px;height:34px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:9px;font-size:12px;font-weight:800;letter-spacing:0;position:relative}
.mark::after{content:"";position:absolute;right:-5px;bottom:-5px;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--soft)}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
.sync.on i{background:var(--ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;padding:8px 14px;border-radius:var(--r-pill);font-weight:550;font-size:14px;color:var(--mute)}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--on-ink)}

/* hero */
.hero{padding-block:36px 28px;display:grid;gap:22px}
.hero h1{font-size:clamp(40px,7.4vw,84px);line-height:.98;font-weight:700;letter-spacing:-.045em;max-width:16ch}
.hero h1 .g{color:var(--mute)}
.hero p{font-size:clamp(16px,2vw,19px);color:var(--mute);max-width:60ch;margin:0}
.cta{display:inline-flex;align-items:center;gap:18px;background:var(--ink);color:var(--on-ink);border:0;border-radius:var(--r-pill);padding:8px 8px 8px 28px;font-weight:600;font-size:17px;text-decoration:none;cursor:pointer}
.cta span.arrow{width:46px;height:46px;border-radius:50%;background:var(--on-ink);color:var(--ink);display:grid;place-items:center}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.ulink{color:var(--mute);text-underline-offset:4px;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;font-size:15px}

/* generic */
.section{padding-block:28px;display:grid;gap:18px;border-top:1px solid var(--line)}
.section:first-of-type{border-top:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.card{background:var(--surface);border-radius:var(--r-card);padding:20px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:transparent;border-radius:var(--r-pill);padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.solid{background:var(--ink);color:var(--on-ink)}
.btn.ghost{border-color:var(--line)}
.btn:hover{opacity:.85}
.btn.sm{padding:5px 12px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* state chips — form carries state, no color */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-radius:var(--r-pill);padding:3px 9px;border:1.5px solid var(--ink);white-space:nowrap;line-height:1.4}
.chip.met{background:var(--ink);color:var(--on-ink)}
.chip.short{background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 7px)}
.chip.crit{background:var(--ink);color:var(--on-ink);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.chip.unk{border-style:dashed;color:var(--mute);border-color:var(--mute)}
.chip.na{border-color:var(--line);color:var(--mute)}

/* stat tiles */
.stat{display:grid;gap:6px;align-content:start}
.stat .big{font-family:var(--f-display);font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1}
.stat .big small{font-size:20px;color:var(--mute);font-weight:600;letter-spacing:-.02em}
.meter{height:10px;border-radius:var(--r-pill);background:var(--soft);position:relative;overflow:hidden}
.meter b{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:var(--r-pill)}
.meter.split b.post2{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px);border:1.5px solid var(--ink)}

/* phase bars */
.phases{display:grid;gap:14px}
.ph{display:grid;grid-template-columns:minmax(96px,150px) 1fr auto;gap:6px 16px;align-items:center}
.ph-name{display:grid;line-height:1.2;min-width:0}
.ph-name b{font-family:var(--f-display);font-size:17px;letter-spacing:-.01em}
.ph-name span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:26px;background:var(--soft);border-radius:8px;position:relative;overflow:visible}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:8px}
.bar .gap{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 7px);border:1.5px dashed var(--ink);border-left:0;border-radius:0 8px 8px 0}
.bar .tick{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.bar .tick::after{content:attr(data-t);position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:600 10px var(--f-mono);color:var(--mute);white-space:nowrap}
.ph-val{display:grid;justify-items:end;line-height:1.15;min-width:84px}
.ph-val b{font-family:var(--f-mono);font-size:16px}
.ph-val span{font-size:12px;color:var(--mute);font-family:var(--f-mono)}
@media (max-width:560px){.ph{grid-template-columns:1fr auto}.ph .bar{grid-column:1/-1;grid-row:2}}

/* alerts */
.alerts{display:grid;gap:10px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;background:var(--surface);border-radius:16px;padding:14px 16px;align-items:start}
.alert .chip{grid-row:1/3;margin-top:2px}
.alert b{font-weight:650}
.alert p{margin:0;color:var(--mute);font-size:14px}
.alert .ref{font-family:var(--f-mono);font-size:11px;color:var(--mute);margin-left:6px}
.alert a{font-weight:600}

/* tables */
.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:var(--r-card);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:650;white-space:nowrap;background:var(--surface);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.ph-row td{background:var(--soft);font-weight:700;font-family:var(--f-display);font-size:13px;letter-spacing:.01em}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.sub td{font-weight:650;background:var(--soft)}
td.z{color:var(--mute)}
td .below{font-weight:700;text-decoration:underline;text-decoration-style:wavy;text-underline-offset:3px}
.cell-in{width:64px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right;font-family:var(--f-mono);font-size:13px}
.cell-in:focus{border-color:var(--ink);outline:none}
.tick-box{width:20px;height:20px;accent-color:var(--ink);cursor:pointer}

/* forms */
.fields{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--mute)}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea,.inp{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--bg);min-width:0}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--ink);outline:none}
.field textarea{min-height:84px;resize:vertical}
.check{display:flex;gap:10px;align-items:center;font-weight:550;cursor:pointer}
.help{font-size:12.5px;color:var(--mute);margin:0}

/* log-sheet cards */
.slot{background:var(--surface);border-radius:18px;padding:14px 16px;display:grid;gap:8px;text-decoration:none;min-height:132px;align-content:start;border:1.5px solid transparent}
.slot:hover{border-color:var(--ink)}
.slot.empty{background:transparent;border:1.5px dashed var(--line)}
.slot.due{border:1.5px dashed var(--ink)}
.slot-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slot-no{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.03em;line-height:1}
.slot .hrs{font-family:var(--f-mono);font-size:14px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{font-size:10.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;display:inline-flex;align-items:center;gap:4px;color:var(--mute)}
.dot i{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;display:inline-block}
.dot.on{color:var(--ink)}
.dot.on i{background:var(--ink);border-color:var(--ink)}

/* rule list */
.rule{display:grid;grid-template-columns:72px 1fr auto;gap:4px 16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.rule:last-child{border-bottom:0}
.rule .sec{font-family:var(--f-mono);font-size:12px;color:var(--mute);padding-top:3px}
.rule b{font-weight:650}
.rule p{margin:2px 0 0;color:var(--mute);font-size:14px}
@media (max-width:560px){.rule{grid-template-columns:1fr auto}.rule .sec{grid-column:1/-1}}

.notice{border:1.5px dashed var(--ink);border-radius:16px;padding:14px 16px;font-size:14px;display:grid;gap:8px}
.week{background:var(--bg);border-radius:16px;padding:14px;display:grid;gap:10px}
.week-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.wrow{display:grid;grid-template-columns:120px minmax(140px,1.3fr) minmax(140px,1.3fr) 84px 72px 34px;gap:6px;align-items:center}
.wrow .inp{padding:7px 9px;font-size:13px}
@media (max-width:760px){.wrow{grid-template-columns:1fr 1fr}.wrow .inp.wide{grid-column:1/-1}}
.xbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:var(--r-pill);font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.drop{border:1.5px dashed var(--ink);border-radius:var(--r-card);padding:28px;text-align:center;display:grid;gap:10px;justify-items:center;cursor:pointer}
.drop.over{background:var(--soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;font-family:var(--f-mono)}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.foot{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.view{animation:rise .28s ease both}@keyframes rise{from{opacity:.6;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<header class="top">
  <div class="wrap" style="padding-block:0">
    <div class="top-in">
      <a class="brand" href="#overview"><span class="mark">TE</span>TERB Tracker</a>
      <div class="row" style="gap:6px">
        <span class="sync" id="sync"><i></i><span>This device</span></span>
        <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#overview">Overview</a><a href="#logs">Log sheets</a><a href="#summary">Cumulative summary</a><a href="#records">Overall records</a><a href="#rules">TERB rules</a><a href="#setup">Profile</a><a href="#data">Import / export</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"><section class="hero"><h1>Loading your <span class="g">record book.</span></h1></section></main>

<script>
"use strict";
/* ───────────── TERB reference data (BAE107, 3rd edition, ratified 06.02.2024) ───────────── */
const ACTS=[
 ["1.1","PP","Consultancy tenders"],["1.2","PP","Site investigations"],["1.3","PP","Precedent studies / Data collection"],["1.4","PP","Brief preparation"],["1.5","PP","Office programming"],["1.6","PP","Outline Planning Permission"],["1.7","PP","Meetings"],["1.8","PP",""],
 ["2.1","SDP","Concept formulation"],["2.2","SDP","Meetings / Presentations / PPC"],["2.3","SDP","Drawings / reports / models / 3Ds / Visuals"],["2.4","SDP","Estimates"],["2.5","SDP",""],
 ["3.1","DDP","Design development"],["3.2","DDP","Planning, Building & other legislation"],["3.3","DDP","Permit drawings"],["3.4","DDP","Meetings"],["3.5","DDP",""],
 ["4.1","CDP","Working drawings / Coordination"],["4.2","CDP","Specifications"],["4.3","CDP","Co-ordinate engineering drawings"],["4.4","CDP","Bills of Quantities / Coordination with QS"],["4.5","CDP","Bid documents"],["4.6","CDP","Meetings"],["4.7","CDP",""],
 ["5.1","BNP","Pre bid meetings"],["5.2","BNP","Bid evaluations"],["5.3","BNP","Meetings / Negotiations / Award of contract"],["5.4","BNP","Emails / Correspondence"],
 ["6.1","CAP","Progress meetings / Technical meetings"],["6.2","CAP","Variation orders"],["6.3","CAP","Inspection / Quality control / Sample approval"],["6.4","CAP","Certification of payments"],["6.5","CAP","Taking over procedures"],["6.6","CAP","Emails / Correspondence"],
 ["7.1","PCP","As built drawings"],["7.2","PCP","Maintenance manual"],["7.3","PCP","Final bill certification"],["7.4","PCP","Guarantees / warranties"],["7.5","PCP","Completion certificate"],["7.6","PCP","Releasing retention"],["7.7","PCP","Inspection at the end of Defects Liability"],
 ["8.1","OTHER",""],["8.2","OTHER",""]
].map(([code,phase,label])=>({code,phase,label}));
const ACT=Object.fromEntries(ACTS.map(a=>[a.code,a]));
const PH=["PP","SDP","DDP","CDP","BNP","CAP","PCP","OTHER"];
const PHN={PP:"Preliminary",SDP:"Schematic Design",DDP:"Design Development",CDP:"Contract Documentation",BNP:"Bidding & Negotiation",CAP:"Contract Administration",PCP:"Post Construction",OTHER:"Other"};
/* Log-sheet "Project Phases (Hrs.)" columns, as in the four-weekly record and TERB_ACTIVITY workbook */
const LOGCOL={PP:"pre",SDP:"design",DDP:"design",CDP:"cd",BNP:"cd",CAP:"ca",PCP:"ca",OTHER:"other"};
const LOGCOLN={pre:"Pre design",design:"Design",cd:"Contract documents",ca:"Contract administration",other:"Other",np:"Non project"};
/* Table 2 — minimum % of total gained training hours */
const TARGETS={
  during1:{PP:10,SDP:25,DDP:25,CDP:10,BNP:0,CAP:5,PCP:0},
  post1:{PP:10,SDP:20,DDP:15,CDP:15,BNP:2.5,CAP:10,PCP:2.5},
  post2:{PP:7.5,SDP:10,DDP:10,CDP:20,BNP:5,CAP:20,PCP:2.5}
};
const STAGEN={during1:"Part I (during Part I)",post1:"Part II (post Part I)",post2:"Part III (post Part II)"};
const STAGESHORT={during1:"During Part I",post1:"Post Part I",post2:"Post Part II"};
const CAT_OK={during1:["A","B","C"],post1:["A","B"],post2:["A"]};
const CAT_YEARS={A:5,B:3,C:2};
const COLLAB=[["client","Client organisation"],["eng","Consultant engineers"],["qs","Consultant QS"],["oth","Others"]];
const SHEETS_PER_BOOK=14, MAX_SHEETS=28;
const CHECKPOINTS=[{w:12,book:1,r:1},{w:24,book:1,r:2},{w:36,book:1,r:3},{w:68,book:2,r:1},{w:80,book:2,r:2},{w:92,book:2,r:3}];

/* ───────────── helpers ───────────── */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());
const pd=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const addD=(s,n)=>{const d=pd(s);if(!d)return "";d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const diffD=(a,b)=>{const x=pd(a),y=pd(b);return x&&y?Math.round((y-x)/864e5):null};/* b - a */
const fd=s=>{const d=pd(s);return d?pad(d.getUTCDate())+"."+pad(d.getUTCMonth()+1)+"."+d.getUTCFullYear():"—"};
const now=new Date();const TODAY=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
const r1=x=>Math.round(x*10)/10;
const fh=x=>{x=r1(+x||0);return (Number.isInteger(x)?x.toLocaleString("en-US"):x.toFixed(1))};
const pct=(a,b)=>b>0?a/b*100:0;
const fp=x=>(Math.round(x*10)/10).toFixed(1)+"%";
const sid=no=>"s"+pad(no);
const zero=()=>Object.fromEntries(PH.map(k=>[k,0]));
const clone=o=>JSON.parse(JSON.stringify(o));
const getP=(o,path)=>path.split("|").reduce((a,k)=>a==null?a:a[k],o);
function setP(o,path,v){const ks=path.split("|");let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null||typeof a[ks[i]]!=="object")a[ks[i]]={};a=a[ks[i]]}a[ks[ks.length-1]]=v}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ───────────── state + persistence ───────────── */
const BLANK_PROFILE=()=>({
  name:"",sliaNo:"",membership:"",baeRegistered:false,partTime:false,partTimeApproved:false,
  partI:{status:"",date:""},partII:{status:"",date:""},
  mentor:{name:"",arbNo:"",stampValid:""},dot:{name:"",arbNo:"",stampValid:""},
  practices:[],counselling:[],checkpoints:{},

let S={profile:BLANK_PROFILE(),sheets:{}};
let mode="local", db=null, dl=null;
const LKEY="terb-tracker.v1";
const pending=new Map(); let saveTimer=null; const inflight=new Set();
function loadLocal(){try{const raw=localStorage.getItem(LKEY);if(raw){const d=JSON.parse(raw);S={profile:Object.assign(BLANK_PROFILE(),d.profile||{}),sheets:d.sheets||{}}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}}
function markDirty(key){pending.set(key,true);clearTimeout(saveTimer);saveTimer=setTimeout(flush,650)}
async function flush(){
  saveLocal();
  if(mode!=="db"){pending.clear();return}
  const keys=[...pending.keys()];pending.clear();
  for(const key of keys){
    if(inflight.has(key)){pending.set(key,true);continue}
    inflight.add(key);
    try{
      if(key==="profile") await db.doc("terb/profile").set(clone(S.profile));
      else if(S.sheets[key]) await db.doc("sheets/"+key).set(clone(S.sheets[key]));
      else await db.doc("sheets/"+key).delete();
    }catch(e){
      if(e&&e.code==="quota_exceeded")toast("Storage is full: export a backup and remove unused sheets.");
      else if(e&&e.code==="unavailable"){pending.set(key,true)}

    }finally{inflight.delete(key)}

}
function editing(){const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
let deferred=false,migrated=false;
function softRender(){if(editing()){deferred=true;return}render()}
document.addEventListener("focusout",()=>setTimeout(()=>{if(deferred&&!editing()){deferred=false;render()}},120));

async function connect(){
  const c=window.claude; if(!c||typeof c.use!=="function")return;
  try{dl=await c.use("downloads")}catch(e){dl=null}
  let d=null;try{d=await c.use("db")}catch(e){d=null}
  if(!d)return;
  db=d;mode="db";setSync("connecting");
  let gotP=false,gotS=false;const timer=setTimeout(()=>{if(!gotP||!gotS)setSync("offline")},10000);
  const done=()=>{if(gotP&&gotS){clearTimeout(timer);setSync("on")}};
  db.doc("terb/profile").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){gotP=true;done();if(!snap.exists&&S.profile.name){markDirty("profile");return}}
    if(pending.has("profile")||inflight.has("profile"))return;
    if(snap.exists){S.profile=Object.assign(BLANK_PROFILE(),snap.data());saveLocal();softRender()}
  },e=>{setSync("offline")});
  db.collection("sheets").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){gotS=true;done();if(snap.empty&&Object.keys(S.sheets).length&&!migrated){migrated=true;for(const k of Object.keys(S.sheets))markDirty(k);return}}
    const next={};
    for(const doc of snap.docs){next[doc.id]=(pending.has(doc.id)||inflight.has(doc.id))?S.sheets[doc.id]:clone(doc.data())}
    for(const k of [...pending.keys(),...inflight])if(k!=="profile"&&S.sheets[k]&&!next[k])next[k]=S.sheets[k];
    S.sheets=next;saveLocal();softRender();
  },e=>{setSync("offline")});
}
function setSync(s){const el=$("#sync");if(!el)return;el.className="sync"+(s==="on"?" on":"");el.querySelector("span").textContent=s==="on"?"Synced":s==="connecting"?"Connecting…":s==="offline"?"Offline · saved here":"This device"}

/* ───────────── analysis ───────────── */
function actPhases(s){const p=zero();for(const[code,a]of Object.entries(s.acts||{})){const ph=ACT[code]&&ACT[code].phase;if(ph)p[ph]+=(+a.h||0)+(+a.np||0)}return p}
function hasOverride(s){return s.phaseOverride&&PH.some(k=>+s.phaseOverride[k])}
function sheetPhases(s){if(hasOverride(s)){const p=zero();for(const k of PH)p[k]=+s.phaseOverride[k]||0;return p}return actPhases(s)}
const sum=o=>Object.values(o).reduce((a,b)=>a+(+b||0),0);
function logCols(s){const c={pre:0,design:0,cd:0,ca:0,other:0,np:0};for(const[code,a]of Object.entries(s.acts||{})){const ph=ACT[code]&&ACT[code].phase;if(!ph)continue;c[LOGCOL[ph]]+=+a.h||0;c.np+=+a.np||0}return c}
const weekHrs=w=>(w&&w.rows||[]).reduce((t,r)=>t+(+r.hours||0),0);
function credit(s,total){
  const ws=(s.weeks||[]).filter(Boolean);
  if(ws.length===4&&ws.every(w=>weekHrs(w)>0))return{weeks:ws.filter(w=>weekHrs(w)>=30).length,basis:"weekly"};
  if(total>=120)return{weeks:4,basis:"sheet"};
  return{weeks:Math.min(4,Math.floor(total/30)),basis:"estimate"};
}
function passed(x){return x&&(x.status==="passed"||x.status==="exempted")}
function autoStage(s,from){
  const P=S.profile;
  if(passed(P.partII)&&(!P.partII.date||(from&&from>=P.partII.date)))return "post2";
  if(passed(P.partI)&&(!P.partI.date||!from||from>=P.partI.date))return "post1";
  if(!P.partI.status)return "post1";
  return "during1";
}
function analyze(){
  const P=S.profile;
  const list=Object.values(S.sheets).filter(s=>s&&s.no).sort((a,b)=>a.no-b.no);
  /* dates: actual where entered, otherwise estimated from the nearest dated sheet (continuous training assumed) */
  const dated=list.filter(s=>pd(s.from));
  const byNo={};
  for(const s of list){
    let from=s.from,est=false;
    if(!pd(from)&&dated.length){const ref=dated.reduce((b,x)=>Math.abs(x.no-s.no)<Math.abs(b.no-s.no)?x:b);from=addD(ref.from,28*(s.no-ref.no));est=true}
    const to=pd(s.to)?s.to:(from?addD(from,25):"");
    const phases=sheetPhases(s),total=sum(phases),cr=credit(s,total);
    const stage=s.stage||autoStage(s,from);
    byNo[s.no]={s,no:s.no,id:sid(s.no),from,to,est,phases,total,credit:cr,stage,weeks:[4*s.no-3,4*s.no],
      acts:actPhases(s),override:hasOverride(s),actTotal:sum(actPhases(s))};
  }
  const rows=list.map(s=>byNo[s.no]);
  const factor=P.partTime?0.5:1;
  const stW={during1:0,post1:0,post2:0},stH={during1:zero(),post1:zero(),post2:zero()};
  let overseasW=0;
  for(const r of rows){stW[r.stage]+=r.credit.weeks*factor;for(const k of PH)stH[r.stage][k]+=r.phases[k];if(r.s.overseas)overseasW+=r.credit.weeks*factor}
  const postW=stW.post1+stW.post2;
  const totalH=rows.reduce((t,r)=>t+r.total,0);
  const postRows=rows.filter(r=>r.stage!=="during1");
  const postH=zero();for(const r of postRows)for(const k of PH)postH[k]+=r.phases[k];
  const curStage=rows.length?rows[rows.length-1].stage:(passed(P.partII)?"post2":"post1");
  /* active comparison: Record 1 (post Part I vs Part II targets) until Part II, then cumulative vs Part III targets */
  const record=curStage==="post2"?{key:"r2",title:"Overall Record 2 · cumulative",hours:postH,target:TARGETS.post2,stage:"post2",goalWeeks:104}
    :curStage==="during1"?{key:"r0",title:"During Part I",hours:stH.during1,target:TARGETS.during1,stage:"during1",goalWeeks:null}
    :{key:"r1",title:"Overall Record 1 · post Part I",hours:stH.post1,target:TARGETS.post1,stage:"post1",goalWeeks:52};
  record.total=sum(record.hours);
  const recRows=rows.filter(r=>record.stage==="post2"?r.stage!=="during1":r.stage===record.stage);
  record.weeks=recRows.reduce((t,r)=>t+r.credit.weeks*factor,0);
  const rawW=recRows.reduce((t,r)=>t+r.credit.weeks,0);
  record.avg=rawW?record.total/rawW:40;
  record.phase=PH.filter(k=>k!=="OTHER").map(k=>{const t=record.target[k]||0,h=record.hours[k],p=pct(h,record.total);return{k,t,h,p,need:Math.max(0,t/100*record.total-h),ok:p+1e-9>=t}});
  record.short=record.phase.filter(x=>x.t>0&&!x.ok);
  /* projection to the record's end */
  if(record.goalWeeks){
    const remW=Math.max(0,record.goalWeeks-(record.stage==="post2"?postW:record.weeks));
    const a=record.avg||40;
    const neededAt=w=>{const T=record.total+w*a;return record.phase.reduce((t,x)=>t+Math.max(0,x.t/100*T-x.h),0)};
    record.remW=remW;record.remH=remW*a;record.needAtEnd=neededAt(remW);

  }
  return{rows,byNo,stW,stH,postW,postH,totalH,overseasW,factor,curStage,record,P};
}

/* ───────────── compliance rules → alerts ───────────── */
function checks(A){
  const P=A.P,out=[],rules=[];
  const add=(sev,title,detail,ref,link)=>out.push({sev,title,detail,ref,link});
  const rule=(sec,title,status,detail)=>rules.push({sec,title,status,detail});
  const rows=A.rows;

  /* Setup basics */
  if(!P.name)add("action","Add your name and examination status","The tracker needs your Part I and Part II status to apply the right targets.","§3.1","#setup");
  rule("§3.1","Registered with BAE as a trainee; TERB issued to you",P.baeRegistered?"met":"unk",P.baeRegistered?"Recorded in your profile.":"Tick this in your profile once you have registered.");
  if(!P.membership)add("action","Set your SLIA membership","Trainees using the TERB must be Student or Graduate members.","§5.4.v","#setup");
  else if(P.membership==="none")add("critical","Apply for SLIA membership now","Only Student or Graduate members may use the TERB.","§5.4.v","#setup");
  rule("§5.4.v","Student or Graduate member of the SLIA",P.membership==="student"||P.membership==="graduate"?"met":P.membership==="none"?"crit":"unk",P.membership?({student:"Student member.",graduate:"Graduate member.",none:"Not a member yet."}[P.membership]):"Not set.");

  /* Table 1 duration */

  rule("Table 1 · 2","Graduate Member: 52 weeks full-time after Part I (or 104 part-time with BAE approval)",!passed(P.partI)&&P.partI.status?"na":gmOk?"met":"short",`${fh(gm)} of 52 weeks credited after Part I.`);
  if(gmOk&&P.membership==="student")add("action","Apply for Graduate membership","You have 52 credited weeks after Part I. Graduate membership is required to sit Part III.","Table 1","#setup");
  const p3Total=A.postW>=104,p3Post2=A.stW.post2>=52;
  rule("Table 1 · 6","Sit Part III: 104 weeks after Part I, of which 52 after Part II",p3Total&&p3Post2&&passed(P.partII)&&P.membership==="graduate"?"met":"short",
    `${fh(A.postW)} of 104 weeks after Part I · ${fh(A.stW.post2)} of 52 after Part II · Part II ${passed(P.partII)?P.partII.status:"not yet passed"} · ${P.membership==="graduate"?"Graduate member":"Graduate membership needed"}.`);
  if(P.partTime&&!P.partTimeApproved)add("critical","Part-time training needs BAE prior approval","Part-time weeks count at half value (104 part-time = 52 full-time) only with BAE's prior approval.","Table 1","#setup");

  /* hours minimums */
  const lowSheets=rows.filter(r=>r.total>0&&r.total<120);
  rule("Form 73","Four-weekly record: minimum 120 hours per log sheet",lowSheets.length?"short":rows.length?"met":"unk",lowSheets.length?`Below 120 h: sheet ${lowSheets.map(r=>pad(r.no)).join(", ")}.`:`All ${rows.length} log sheets reach 120 h.`);
  for(const r of lowSheets)add("action",`Log sheet ${pad(r.no)} has ${fh(r.total)} h — minimum is 120`,`Weeks ${r.weeks[0]}–${r.weeks[1]}. Only ${r.credit.weeks} of 4 weeks can be counted at 30 h each.`,"Form 73",`#sheet-${r.no}`);
  const lowWeeks=[];for(const r of rows)(r.s.weeks||[]).forEach((w,i)=>{if(w&&weekHrs(w)>0&&weekHrs(w)<30)lowWeeks.push(`${4*r.no-3+i}`)});
  rule("Form 15","Weekly record: minimum 30 hours per week",lowWeeks.length?"short":"met",lowWeeks.length?`Weeks under 30 h: ${lowWeeks.join(", ")}.`:"No weekly record under 30 h.");
  if(lowWeeks.length)add("action",`Week${lowWeeks.length>1?"s":""} ${lowWeeks.join(", ")} under 30 hours`,"Each weekly record needs at least 30 hours.","Form 15","#logs");

  /* Table 2 */
  const R=A.record;
  rule("Table 2",`Phase minimums for ${STAGEN[R.stage]}`,!R.total?"unk":R.short.length?"short":"met",!R.total?"No hours yet.":R.short.length?`Short in ${R.short.map(x=>`${x.k} (${fp(x.p)} of ${x.t}%)`).join(", ")}.`:"Every phase is at or above its minimum.");
  if(R.total&&R.short.length){
    add("action",`Below the Table 2 minimum in ${R.short.map(x=>x.k).join(", ")}`,R.short.map(x=>`${x.k} ${fp(x.p)} of ${x.t}% (−${fh(x.need)} h today)`).join(" · "),"Table 2","#summary");
    if(R.goalWeeks&&R.remW>0&&R.needAtEnd>R.remH+1e-6)add("critical",`Targets can't be reached by week ${R.goalWeeks} at your pace`,`Closing the gaps needs ${fh(R.needAtEnd)} h in short phases, but only about ${fh(R.remH)} h remain (${fh(R.remW)} weeks × ${fh(R.avg)} h). Plan about ${R.minWeeksToFix} weeks dedicated to these phases, which runs ${Math.max(0,R.minWeeksToFix-R.remW)} weeks past week ${R.goalWeeks}.`,"Table 2","#overview");

  for(const p of pr){
    const rs=(byPr[p.id]||[]).sort((a,b)=>a.no-b.no);
    let best=0,run=0,prev=null;for(const r of rs){run=(prev!==null&&r.no===prev+1)?run+r.credit.weeks:r.credit.weeks;prev=r.no;best=Math.max(best,run)}
    const ended=!!p.end;
    if(rs.length&&best<20){if(ended){r52="crit";add("critical",`${p.name||"Practice"}: ${best} consecutive weeks — under 20`,"Experience under 20 consecutive weeks in one office is not counted.","§5.2","#setup")}else{if(r52==="met")r52="short";add("note",`${p.name||"Practice"}: ${best} consecutive weeks so far`,`Stay at least ${20-best} more weeks for this office's experience to count.`,"§5.2","#setup")}}
    r52d.push(`${p.name||"Practice"}: ${best} consecutive weeks`);
    /* category */

    if(!p.category){if(rs.length)add("action",`Set the trainer category of ${p.name||"your practice"}`,"Post Part I needs a Category B (or A) practice; post Part II needs Category A.","§2","#setup")}
    else for(const st of stages){if(!CAT_OK[st].includes(p.category))add("critical",`${p.name}: Category ${p.category} can't train ${STAGESHORT[st]} trainees`,`${STAGESHORT[st]} training needs a Category ${CAT_OK[st].join(" or ")} practice.`,"§2","#setup")}
    if(p.category&&p.mentorYears!==""&&p.mentorYears!=null&&+p.mentorYears<CAT_YEARS[p.category])add("action",`Mentor at ${p.name} is below Category ${p.category}'s ${CAT_YEARS[p.category]} years post-charter`,`Recorded: ${p.mentorYears} years.`,"§2","#setup");
    if(ended&&!p.employmentSummary)add("action",`Employment summary for ${p.name||"practice"}`,"The principal architect must certify the duration you worked there. Original to BAE, copy stays in the TERB.","§6(e)","#setup");
  }
  rule("§5.2","At least 20 consecutive weeks in one registered trainer practice",pr.length?r52:"unk",pr.length?r52d.join(" · "):"Add your practice in the profile.");
  const catBad=out.some(a=>a.ref==="§2"&&a.sev==="critical");
  rule("§2","Practice category matches your stage (A: post Part II · B: post Part I · C: during Part I)",!pr.length||pr.some(p=>!p.category)?"unk":catBad?"crit":"met",pr.map(p=>`${p.name||"Practice"}: ${p.category?"Category "+p.category:"category not set"}`).join(" · ")||"No practice yet.");

  };
  const ms=stamp("Employment Mentor",P.mentor),ds=stamp("Director of Training",P.dot);

  for(const r of badCert)add("critical",`Sheet ${pad(r.no)} certified after the mentor's stamp expired`,`Certified ${fd(r.s.mentorDate)}; stamp valid to ${fd(P.mentor.stampValid)}.`,"§5.4.i",`#sheet-${r.no}`);
  rule("§5.4.i","Weekly and four-weekly records certified by the mentor with a valid ARB stamp",ms==="crit"||badCert.length?"crit":ms==="unk"?"unk":"met",P.mentor.stampValid?`Mentor stamp valid to ${fd(P.mentor.stampValid)}. DOT stamp valid to ${fd(P.dot.stampValid)}.`:"Stamp validity not recorded.");

  /* certification & submission timing */

  const noDot=rows.filter(r=>r.total>0&&!r.s.dotDate);
  if(noCert.length)add("action",`${noCert.length} log sheet${noCert.length>1?"s have":" has"} no mentor certification date`,`Sheets ${noCert.map(r=>pad(r.no)).join(", ")}. Enter the date from the stamp box, or get them certified.`,"§6(b)","#logs");
  const lateList=[],overList=[],okLate=[];

    const sub=r.s.submitted||r.s.dotDate;
    if(!sub){const over=diffD(due,TODAY);if(over>0)overList.push({r,over});continue}
    const late=diffD(due,sub);
    if(late>0){if(r.s.dotDate)okLate.push({r,late});else lateList.push({r,late})}
  }
  if(overList.length){
    const beyond=overList.filter(x=>x.over>61);
    add("action",`No DOT review recorded for sheet${overList.length>1?"s":""} ${overList.map(x=>pad(x.r.no)).join(", ")}`,
      `If the DOT already reviewed ${overList.length>1?"them":"it"}, enter the dates. Otherwise: late submissions are accepted for up to two months, only with an excuse letter certified by your mentor${beyond.length?`; ${beyond.length} ${beyond.length>1?"are":"is"} already past that window`:""}.`,"§3.6.ix","#logs");
  }
  for(const x of lateList)add(x.late>61?"critical":x.r.s.excuseLetter?"note":"action",`Sheet ${pad(x.r.no)} submitted ${x.late} days late`,x.late>61?"Beyond the two-month allowance. Talk to the DOT.":x.r.s.excuseLetter?"Excuse letter recorded.":"Attach an excuse letter certified by your mentor.","§3.6.ix",`#sheet-${x.r.no}`);
  if(okLate.length)add("note",`${okLate.length} sheet${okLate.length>1?"s were":" was"} reviewed late but accepted by the DOT`,okLate.map(x=>`Sheet ${pad(x.r.no)}: ${x.late} days after the next monthly session`).join(" · ")+". Submit at the next monthly counselling from now on.","§5.4.iv","#logs");
  rule("§3.6.ix","Log sheets submitted at the next monthly counselling; at most two months late, with an excuse letter",overList.some(x=>x.over>61)||lateList.some(x=>x.late>61)?"crit":overList.length||lateList.length?"short":rows.length?"met":"unk",
    `${rows.length-noDot.length} of ${rows.filter(r=>r.total).length} sheets have a DOT review date.`);

  /* missing sheets */
  const first=rows.find(r=>pd(r.from)&&!r.est)||rows[0];
  if(first&&first.from){
    const elapsedW=Math.floor(diffD(first.from,TODAY)/7)+(first.no-1)*4;
    const expectedSheets=Math.min(MAX_SHEETS,Math.floor(elapsedW/4));
    const miss=[];for(let n=1;n<=expectedSheets;n++){if(!A.byNo[n]||!A.byNo[n].total)miss.push(n)}
    if(miss.length){
      const ranges=[];let a=miss[0],b=a;for(const n of miss.slice(1)){if(n===b+1)b=n;else{ranges.push([a,b]);a=b=n}}ranges.push([a,b]);
      add("action",`Log sheet${miss.length>1?"s":""} ${ranges.map(([a,b])=>a===b?pad(a):pad(a)+"–"+pad(b)).join(", ")} not entered`,`Weeks ${ranges.map(([a,b])=>`${4*a-3}–${4*b}`).join(", ")} have ended if your training has been continuous since ${fd(first.from)} (week ${4*first.no-3}). Enter them, or set the actual dates if you took a break.`,"§6","#logs");
    }

  /* counselling */

    const reached=rows.some(r=>r.weeks[1]>=cp.w&&r.total>0);
    const d=(P.checkpoints||{})[cp.w]||{};
    if(reached&&!d.interim)cpMiss.push(cp);
  }
  if(cpMiss.length)add("action",`Interim report${cpMiss.length>1?"s":""} at week ${cpMiss.map(c=>c.w).join(", ")} not recorded`,"At the end of 12, 24 and 36 weeks the DOT sends the interim report and overall-record recommendation to the BAE, and your mentor lists follow-up actions.","§6(c)","#records");
  rule("§6(c)","Interim reports and DOT recommendations at 12, 24 and 36 weeks",cpMiss.length?"short":"met",cpMiss.length?`Missing at week ${cpMiss.map(c=>c.w).join(", ")}.`:"Up to date for the weeks reached.");

  /* overseas */
  if(A.overseasW>0){const sl=A.postW-A.overseasW;rule("§5.6","Overseas training: at least 52 weeks in Sri Lanka",sl>=52?"met":"short",`${fh(sl)} weeks in Sri Lanka, ${fh(A.overseasW)} overseas.`);if(sl<52)add("note","Overseas weeks need 52 weeks in Sri Lanka as well",`${fh(sl)} Sri Lankan weeks credited so far.`,"§5.6","#logs")}
  else rule("§5.6","Overseas training: at least 52 weeks in Sri Lanka","na","No overseas sheets.");

  /* override mismatches */
  const mm=rows.filter(r=>r.override&&r.actTotal>0);
  if(mm.length)add("note",`Activity detail differs from the certified totals on sheet${mm.length>1?"s":""} ${mm.map(r=>pad(r.no)).join(", ")}`,"The cumulative-summary totals are used. Correct the activity hours so the log sheet matches.","§6(b)","#logs");
  const po=rows.filter(r=>r.override&&!r.actTotal);
  if(po.length)add("note",`Activity detail not entered for sheet${po.length>1?"s":""} ${po.map(r=>pad(r.no)).join(", ")}`,"Only phase totals are known. Transcribe the activity rows from the log sheets.","§6(b)","#logs");

  rule("§3.6.xi","Submit the TERB and record sheets in person; the DOT doesn't accept them through a third party","na","Reminder.");
  rule("§6(f)","Photocopy the whole TERB before handing it to the BAE","na","Reminder for the end of training.");

  const order={critical:0,action:1,note:2};
  out.sort((a,b)=>order[a.sev]-order[b.sev]);
  return{alerts:out,rules};
}

/* ───────────── rendering ───────────── */
const chip=(st,txt)=>`<span class="chip ${st}">${txt||({met:"Met",short:"Short",crit:"Critical",unk:"Not set",na:"Info"}[st])}</span>`;
const sevChip=s=>s==="critical"?chip("crit","Critical"):s==="action"?chip("short","Action"):chip("unk","Note");
function route(){const h=(location.hash||"#overview").slice(1);return h||"overview"}
function render(){
  const r=route(),A=analyze(),C=checks(A);
  document.querySelectorAll("#tabs a").forEach(a=>{const k=a.getAttribute("href").slice(1);a.toggleAttribute("aria-current",false);if(k===r||(k==="logs"&&r.startsWith("sheet-")))a.setAttribute("aria-current","page")});
  let html="";
  if(r==="overview")html=vOverview(A,C);
  else if(r==="logs")html=vLogs(A);
  else if(r.startsWith("sheet-"))html=vSheet(A,+r.slice(6));
  else if(r==="summary")html=vSummary(A);
  else if(r==="records")html=vRecords(A);
  else if(r==="rules")html=vRules(A,C);
  else if(r==="setup")html=vSetup(A);
  else if(r==="data")html=vData(A);
  else html=vOverview(A,C);
  $("#app").innerHTML=`<div class="view">${html}</div>`+foot();
}
function foot(){return `<div class="foot"><span>Rules from the Trainees' Experience Record Book (TERB), BAE107 third edition, approved by the BAE 13.12.2023 and ratified by the SLIA Council 06.02.2024.</span><span>The SLIA/BAE may amend these conditions. Your DOT's decision is final; this tracker helps you stay on course.</span></div>`}

function phaseBars(hours,target,total){
  return `<div class="phases">${PH.filter(k=>k!=="OTHER").map(k=>{
    const t=target[k]||0,h=hours[k],p=pct(h,total),scale=Math.max(40,...PH.map(x=>pct(hours[x],total)),...Object.values(target))*1.08;
    const w=p/scale*100,tw=t/scale*100,ok=p+1e-9>=t;
    return `<div class="ph"><div class="ph-name"><b>${k}</b><span>${PHN[k]}</span></div>
    <div class="bar" role="img" aria-label="${k} ${fp(p)} of a ${t}% minimum"><div class="fill" style="width:${w}%"></div>${!ok&&t?`<div class="gap" style="left:${w}%;width:${tw-w}%"></div>`:""}${t?`<div class="tick" style="left:calc(${tw}% - 1px)" data-t="${t}%"></div>`:""}</div>
    <div class="ph-val"><b>${fp(p)}</b><span>${fh(h)} h${t?ok?" · met":` · −${fh(t/100*total-h)} h`:" · no min."}</span></div></div>`}).join("")}</div>`;
}
function vOverview(A,C){
  const P=A.P,R=A.record,rows=A.rows;

  else h1=`${fh(weeksDone)} weeks <span class="g">of ${goal} logged.</span> ${R.short.length?`<span class="g">Short in</span> ${R.short.map(x=>x.k).join(", ")}.`:`<span class="g">On</span> target.`}`;
  const next=nextSheet(A);
  const crit=C.alerts.filter(a=>a.sev==="critical").length,act=C.alerts.filter(a=>a.sev==="action").length;
  let s=`<section class="hero"><h1>${h1}</h1>
  <p>${rows.length?`${fh(A.totalH)} hours over ${rows.filter(r=>r.total).length} log sheets${P.name?` for ${esc(P.name)}`:""}. ${crit?`${crit} critical item${crit>1?"s":""}, `:""}${act} action${act!==1?"s":""} to take.`:"Add your profile, then enter each four-weekly log sheet, or import your TERB spreadsheets."}</p>
  <div class="cta-row"><a class="cta" href="#sheet-${next}">${A.byNo[next]?"Open":"Start"} log sheet ${pad(next)}<span class="arrow"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  <a class="ulink" href="#data">Import your TERB spreadsheets</a></div></section>`;
  /* duration tiles */
  const tile=(lbl,val,of,note,meter)=>`<div class="card stat"><span class="label">${lbl}</span><div class="big">${val}<small> / ${of}</small></div>${meter}<span class="help">${note}</span></div>`;
  const m=(v,of)=>`<div class="meter"><b style="width:${Math.min(100,v/of*100)}%"></b></div>`;
  s+=`<section class="section"><div class="sec-head"><h2>Training duration</h2><span class="mute">Table 1 · credited weeks${A.factor<1?" (part-time counts half)":""}</span></div><div class="grid g3">
  ${tile("Graduate membership",fh(A.postW),52,A.postW>=52?"Requirement met. Apply for Graduate membership.":`${fh(52-A.postW)} more weeks after Part I.`,m(A.postW,52))}
  ${tile("Part III · after Part I",fh(A.postW),104,`${fh(Math.max(0,104-A.postW))} weeks to go.`,m(A.postW,104))}
  ${tile("Part III · after Part II",fh(A.stW.post2),52,passed(P.partII)?`${fh(Math.max(0,52-A.stW.post2))} weeks to go.`:"Starts counting once you pass or are exempted from Part II.",m(A.stW.post2,52))}
  </div></section>`;
  /* phases */
  s+=`<section class="section"><div class="sec-head"><div><span class="label">${esc(R.title)}</span><h2>Phase balance against Table 2</h2></div><a class="btn ghost" href="#summary">Cumulative summary</a></div>
  <div class="card">${R.total?phaseBars(R.hours,R.target,R.total):`<p class="mute">No hours yet.</p>`}</div>`;
  if(R.total&&R.goalWeeks&&R.plan&&R.plan.length){
    const ok=R.needAtEnd<=R.remH+1e-6;
    s+=`<div class="grid g2"><div class="card"><span class="label">To finish week ${R.goalWeeks} on target</span>
      <p style="margin:8px 0 12px">${R.remW>0?`About <b class="num">${fh(R.remH)} h</b> remain (${fh(R.remW)} weeks at your average ${fh(R.avg)} h/week). Put at least:`:"The record period is complete. Additional weeks needed:"}</p>
      <dl class="kv">${R.plan.map(x=>`<dt>${x.k} · ${PHN[x.k]}</dt><dd>${fh(x.h)} h</dd>`).join("")}</dl>
      <p class="help" style="margin-top:12px">${ok?"That fits in the remaining hours, with the rest spread over any phase.":`That is ${fh(R.needAtEnd)} h, more than remains. Plan about ${R.minWeeksToFix} weeks of work focused on these phases (Overall Record "additional weeks").`}</p></div>
      <div class="card"><span class="label">Where the hours went</span><div style="margin-top:12px">${logColTable(A)}</div></div></div>`;
  }
  s+=`</section>`;
  /* alerts */
  s+=`<section class="section"><div class="sec-head"><h2>What needs attention</h2><a class="btn ghost" href="#rules">All TERB rules</a></div>
  <div class="alerts">${C.alerts.length?C.alerts.map(a=>`<div class="alert">${sevChip(a.sev)}<b>${esc(a.title)}<span class="ref">${esc(a.ref)}</span></b><p>${esc(a.detail)} ${a.link?`<a href="${a.link}">Open</a>`:""}</p></div>`).join(""):`<div class="alert">${chip("met","Clear")}<b>Nothing outstanding</b><p>Every rule the tracker can check is satisfied.</p></div>`}</div></section>`;
  return s;
}
function logColTable(A){
  const c={pre:0,design:0,cd:0,ca:0,other:0};let np=0;
  for(const r of A.rows){for(const k of PH)c[LOGCOL[k]]+=r.phases[k]}
  for(const r of A.rows){if(!r.override)np+=logCols(r.s).np}
  const tot=sum(c);
  return `<dl class="kv">${Object.entries(c).filter(([k,v])=>k!=="other"||v).map(([k,v])=>`<dt>${LOGCOLN[k]}</dt><dd>${fh(v)} h · ${fp(pct(v,tot))}</dd>`).join("")}<dt>of which non-project</dt><dd>${fh(np)} h</dd></dl>`;
}
function nextSheet(A){for(let n=1;n<=MAX_SHEETS;n++){if(!A.byNo[n]||!A.byNo[n].total)return n}return MAX_SHEETS}

/* log sheets list */

    h+=`<a class="slot" href="#sheet-${n}"><div class="slot-top"><span class="slot-no">${pad(n)}</span><span class="mute">wk ${r.weeks[0]}–${r.weeks[1]}</span></div>

  t+=`<tr class="tot"><td colspan="4">Total hours (minimum 120 hrs)</td><td class="n" colspan="2"><span data-live="acttotal">${fh(r.actTotal)}</span></td><td colspan="4"></td></tr></tbody></table></div>`;

function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error("The spreadsheet reader didn't load. Check your connection."));document.head.appendChild(s)})}

function parseWorkbook(wb){

    const ws=wb.Sheets[nm];if(!ws["!ref"])continue;const rg=XLSX.utils.decode_range(ws["!ref"]);

      let titled=false;for(let cc=rg.s.c;cc<=rg.e.c;cc++){const t=cell(r-1,cc);if(t&&/SUMMARY/i.test(String(t.v)))titled=true}
      if(titled)for(let cc=rg.s.c;cc<=rg.e.c;cc++){const t=cell(r-1,cc);if(t&&typeof t.v==="string"&&!/SUMMARY/i.test(t.v)&&t.v.trim())name=name||t.v.trim().replace(/^(Mr|Ms|Mrs|Miss)\.?\s+/i,"")}break}}
    if(hr<0||Object.keys(cols).length<8)continue;
    for(let r=hr+1;r<=rg.e.r;r++){const lab=cell(r,cols._label);if(!lab)continue;const ls=String(lab.v).trim();
      if(/practice/i.test(ls)){const v=cell(r+1,cols._label);if(v&&v.v)practice=String(v.v).trim()}
      const mm=/^(\d+)\s*[-–]\s*(\d+)$/.exec(ls);if(!mm||+mm[2]%4)continue;const p={};let any=0;for(const k of PH){const x=cell(r,cols[k]);const v=x&&typeof x.v==="number"?x.v:0;p[k]=v;any+=v}
      if(any)sums[+mm[2]/4]=p}
  }
  const nos=[...new Set([...Object.keys(acts),...Object.keys(sums)].map(Number))].sort((a,b)=>a-b);
  if(!nos.length)return{title:"No TERB data found",lines:["Expected sheets named like 1-4 with activity codes in row 2, or a cumulative summary with a WEEK NOS. header."],apply:null};
  for(const no of nos){const a=acts[no],sm=sums[no];const at=a?sum(a):0;
    let ap=null;if(a){ap=zero();for(const c in a)ap[ACT[c].phase]+=a[c]}
    const match=a&&sm&&PH.every(k=>Math.abs(ap[k]-sm[k])<0.01);
    lines.push(`Sheet ${pad(no)} (weeks ${4*no-3}–${4*no}): ${a?`${fh(at)} h of activities`:""}${a&&sm?" · ":""}${sm?`${fh(sum(sm))} h summary`:""}${a&&sm?(match?" · match":" · differ, summary totals kept"):""}`)}
  if(name)lines.unshift(`Trainee's name: ${name}`);if(practice)lines.unshift(`Trainer practice: ${practice}`);
  return{title:`Import ${nos.length} log sheet${nos.length>1?"s":""}`,lines,apply:()=>{
    const P=S.profile;if(name&&!P.name){P.name=name}
    if(practice&&!(P.practices||[]).some(p=>p.name===practice)){P.practices=(P.practices||[]).concat([{id:"p"+Date.now().toString(36),name:practice,category:"",principal:"",mentorYears:"",start:"",end:"",employmentSummary:false}])}
    markDirty("profile");
    for(const no of nos){const s=ensureSheet(no);if(!s.practiceId&&P.practices[0])s.practiceId=(P.practices.find(p=>p.name===practice)||P.practices[0]).id;
      if(acts[no]){const keep=s.acts||{};s.acts={};for(const[c,v]of Object.entries(acts[no])){s.acts[c]=Object.assign({p:true},keep[c]||{},{h:v,np:0})}}
      const sm=sums[no];
      if(sm){const ap=actPhases(s);const match=PH.every(k=>Math.abs(ap[k]-sm[k])<0.01);s.phaseOverride=match?null:sm}
      markDirty(sid(no))}
  }};
}
async function saveFile(filename,data,mime){
  if(dl){try{await dl.save({filename,data});toast("Saved "+filename)}catch(e){if(e&&e.code!=="declined")toast("Couldn't save the file ("+(e.code||"error")+").")}return}
  if(window.claude){toast("Downloads aren't available in this view.");return}
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)
}
async function exportXlsx(){
  let XLSX;try{XLSX=await loadXLSX()}catch(e){toast(e.message);return}
  const A=analyze(),wb=XLSX.utils.book_new();
  const cum=[["CUMULATIVE SUMMARY SHEET",S.profile.name||""],["WEEK NOS.","TOTAL (HOURS)",...PH]];
  const tot=zero();
  for(let n=1;n<=MAX_SHEETS;n++){const r=A.byNo[n];const p=r?r.phases:zero();for(const k of PH)tot[k]+=p[k];cum.push([`${4*n-3}-${4*n}`,r?r.total:0,...PH.map(k=>p[k])])}
  const T=sum(tot);cum.push(["Total (Hours)",T,...PH.map(k=>tot[k])]);cum.push(["Total %",T?1:0,...PH.map(k=>T?tot[k]/T:0)]);
  const tg=TARGETS[A.record.stage];cum.push(["TARGET %","",...PH.map(k=>k==="OTHER"?"":(tg[k]||0)/100)]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cum),"Cumulative summary");
  for(const r of A.rows){const row=ACTS.map(a=>{const v=(r.s.acts||{})[a.code];return v?(+v.h||0)+(+v.np||0)||null:null});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["TERB ACTIVITY"],ACTS.map(a=>+a.code),row]),`${r.weeks[0]}-${r.weeks[1]}`)}
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  await saveFile(`TERB-record-${TODAY}.xlsx`,new Blob([out]),"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}

/* ───────────── events ───────────── */
function rootObj(root){if(root==="profile")return{obj:S.profile,key:"profile"};const id=root.split(":")[1];return{obj:S.sheets[id],key:id}}
function onField(e,commit){
  const el=e.target;if(!el.dataset||!el.dataset.k)return;
  const{obj,key}=rootObj(el.dataset.root);if(!obj)return;
  let v=el.type==="checkbox"?el.checked:el.type==="radio"?el.value:el.value;
  if(el.dataset.num)v=el.value===""?"":Math.max(0,+el.value);
  setP(obj,el.dataset.k,v);markDirty(key);
  if(el.dataset.rerender&&commit){render();return}
  liveUpdate();
}
function liveUpdate(){
  const r=route();if(!r.startsWith("sheet-"))return;const A=analyze(),row=A.byNo[+r.slice(6)];if(!row)return;
  const set=(k,v)=>document.querySelectorAll(`[data-live="${k}"]`).forEach(el=>el.innerHTML=v);
  set("total",fh(row.total));set("acttotal",fh(row.actTotal));set("acttotal2",fh(row.actTotal));
  for(const k of PH)set("ph-"+k,fh(row.acts[k]));
  const lc=logCols(row.s);for(const k in lc)set("lc-"+k,fh(lc[k]));
  set("status",row.total>=120?chip("met","≥120 h"):chip("short","Below 120 h"));
  (row.s.weeks||[]).forEach((w,i)=>{if(w){const wh=weekHrs(w);set("wk-"+i,wh>=30?chip("met",fh(wh)+" h"):chip("short",fh(wh)+" h · min 30"))}});
}
document.addEventListener("input",e=>{if(e.target.matches("input[type=text],input[type=number],textarea"))onField(e,false)});
document.addEventListener("change",e=>{if(e.target.id==="file"){const f=e.target.files[0];if(f)readFile(f);return}if(e.target.matches("input[type=text],input[type=number],textarea"))return;onField(e,true)});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;const r=route();
  const no=r.startsWith("sheet-")?+r.slice(6):null;const s=no?S.sheets[sid(no)]:null;
  if(act==="newsheet"){ensureSheet(+b.dataset.no);markDirty(sid(+b.dataset.no));render()}
  else if(act==="addweek"&&s){s.weeks=s.weeks||[null,null,null,null];const i=+b.dataset.i;const A=analyze();const from=A.byNo[no].from;s.weeks[i]={start:from?addD(from,7*i):"",rows:Array.from({length:5},(_,d)=>({date:from?addD(from,7*i+d):"",project:"",work:"",ref:"",hours:""})),mentorDate:"",dotDate:""};markDirty(sid(no));render()}
  else if(act==="addrow"&&s){const w=s.weeks[+b.dataset.i];w.rows.push({date:"",project:"",work:"",ref:"",hours:""});markDirty(sid(no));render()}
  else if(act==="delrow"&&s){s.weeks[+b.dataset.i].rows.splice(+b.dataset.j,1);markDirty(sid(no));render()}
  else if(act==="ask"){const t=document.getElementById(b.dataset.target);const kind=b.dataset.kind||"override";
    const msg={override:"Remove the summary totals?",transfer:"Replace activity hours with the weekly totals?",delete:"Delete this sheet for good?",delpr:"Remove this practice?"}[kind];
    t.innerHTML=`<span class="help">${msg}</span><button class="btn sm solid" data-act="do-${kind}" data-i="${b.dataset.i||""}">Yes</button><button class="btn sm ghost" data-act="cancel-ask">No</button>`}
  else if(act==="cancel-ask")render();
  else if(act==="do-override"&&s){s.phaseOverride=null;markDirty(sid(no));render();toast("Using activity hours")}
  else if(act==="do-transfer"&&s){const ws=(s.weeks||[]).filter(Boolean);if(!ws.length){toast("Add weekly records first.");render();return}
    const tot={};for(const w of ws)for(const row of w.rows||[]){if(row.ref&&+row.hours)tot[row.ref]=(tot[row.ref]||0)+(+row.hours)}
    const keep=s.acts||{};s.acts={};for(const[c,h]of Object.entries(tot))s.acts[c]=Object.assign({p:true},keep[c]||{},{h,np:0});
    markDirty(sid(no));render();toast(`Transferred ${ws.length} week${ws.length>1?"s":""}`)}
  else if(act==="do-delete"&&no){delete S.sheets[sid(no)];markDirty(sid(no));location.hash="#logs";render();toast("Log sheet deleted")}
  else if(act==="do-delpr"){S.profile.practices.splice(+b.dataset.i,1);markDirty("profile");render()}
  else if(act==="addpr"){S.profile.practices=(S.profile.practices||[]).concat([{id:"p"+Date.now().toString(36),name:"",category:"",principal:"",mentorYears:"",start:"",end:"",employmentSummary:false}]);markDirty("profile");render()}
  else if(act==="addcs"){S.profile.counselling=(S.profile.counselling||[]).concat([{date:TODAY,attended:true,note:""}]);markDirty("profile");render()}
  else if(act==="delcs"){S.profile.counselling.splice(+b.dataset.i,1);markDirty("profile");render()}
  else if(act==="target"){try{localStorage.setItem("terb-target",b.dataset.k)}catch(e){}render()}
  else if(act==="autoneeds"){const A=analyze();const tot=zero();for(const x of A.rows)for(const k of PH)tot[k]+=x.phases[k];const T=sum(tot);let tk=null;try{tk=localStorage.getItem("terb-target")}catch(e){}const tg=TARGETS[tk]||A.record.target;S.profile.selfNeeds={};for(const k of PH)if(tg[k]&&pct(tot[k],T)<tg[k])S.profile.selfNeeds[k]=true;markDirty("profile");render()}
  else if(act==="apply-import"){if(importPlan&&importPlan.apply){importPlan.apply();importPlan=null;flush();toast("Imported");location.hash="#overview";render()}}
  else if(act==="cancel-import"){importPlan=null;render()}
  else if(act==="exp-json")saveFile(`TERB-backup-${TODAY}.json`,JSON.stringify({version:1,exported:TODAY,profile:S.profile,sheets:S.sheets},null,1),"application/json");
  else if(act==="exp-xlsx")exportXlsx();
});
