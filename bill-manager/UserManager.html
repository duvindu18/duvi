<div id="um-root">
  <p class="muted small" style="margin-top:0">
    Only the Google accounts listed here can sign in and record bills.
    <b>Employees</b> can only record bills. <b>Admins</b> can also manage categories and this list.
  </p>

  <form id="um-form" class="um-form" autocomplete="off">
    <label class="field full">Google account e-mail<input id="um-email" type="email" inputmode="email" maxlength="120" placeholder="name@gmail.com" required></label>
    <label class="field">Name<input id="um-name" maxlength="80" placeholder="Shown on every bill they record" required></label>
    <label class="field">Role
      <select id="um-role"><option value="Employee">Employee: record bills only</option><option value="Admin">Admin: full control</option></select>
    </label>
    <label class="um-check"><input type="checkbox" id="um-active" checked> Allowed to sign in</label>
    <div class="um-btns">
      <button type="button" class="ghost hidden" id="um-cancel">Cancel</button>
      <button type="submit" class="primary" id="um-submit">Add account</button>
    </div>
  </form>

  <div id="um-msg" class="alert hidden"></div>
  <div class="um-filter">
    <input id="um-search" placeholder="Search name or e-mail" aria-label="Search">
  </div>
  <div id="um-list" class="cm-list"><p class="muted">Loading…</p></div>
</div>

<script>
  const UM = (function () {
    let users = [], me = '', editing = null, pendingDelete = null;

    function msg(text, kind) {
      const m = $('um-msg');
      if (!text) { m.className = 'alert hidden'; return; }
      m.textContent = text; m.className = 'alert ' + (kind || 'ok');
    }

    function load() {
      return run('listUsers').then(function (r) { users = r.users; me = r.me; render(); })
        .catch(function (e) { msg(e.message, 'error'); $('um-list').innerHTML = ''; });
    }

    function resetForm() {
      editing = null;
      $('um-form').reset();
      $('um-active').checked = true;
      $('um-email').disabled = false;
      $('um-role').disabled = false;
      $('um-active').disabled = false;
      $('um-submit').textContent = 'Add account';
      $('um-cancel').classList.add('hidden');
    }

    function startEdit(u) {
      editing = u.email;
      $('um-email').value = u.email;
      $('um-name').value = u.name;
      $('um-role').value = u.role;
      $('um-active').checked = u.active;
      const locked = u.isOwner || u.email === me;
      $('um-email').disabled = u.isOwner;
      $('um-role').disabled = locked;
      $('um-active').disabled = locked;
      $('um-submit').textContent = 'Save changes';
      $('um-cancel').classList.remove('hidden');
      msg('Editing ' + u.email + (locked ? ' (your own / owner access cannot be reduced)' : ''), 'ok');
      $('um-name').focus();
      $('um-root').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function render() {
      const q = $('um-search').value.trim().toLowerCase();
      const list = $('um-list');
      list.innerHTML = '';
      const shown = users.filter(function (u) { return !q || (u.name + ' ' + u.email).toLowerCase().indexOf(q) >= 0; });
      if (!shown.length) { list.appendChild(el('p', { class: 'muted', text: q ? 'No match.' : 'No accounts yet.' })); return; }
      list.appendChild(el('div', { class: 'cm-group', text: users.filter(function (u) { return u.active; }).length + ' active · ' + users.length + ' total' }));
      shown.forEach(function (u) { list.appendChild(item(u)); });
    }

    function item(u) {
      const box = el('div', { class: 'cm-item' + (u.active ? '' : ' archived') });
      const initials = (u.name || u.email).replace(/@.*/, '').split(/[\s._-]+/).filter(Boolean).slice(0, 2).map(function (p) { return p[0]; }).join('').toUpperCase();
      box.appendChild(el('div', { class: 'um-person' }, [
        el('div', { class: 'um-av', text: initials || '?' }),
        el('div', {}, [
          el('div', {}, [el('span', { class: 'nm', text: u.name || u.email }),
            el('span', { class: 'badge', text: u.isOwner ? 'Owner' : u.role }),
            u.active ? null : el('span', { class: 'badge grey', text: 'off' })]),
          el('div', { class: 'meta', text: u.email }),
          el('div', { class: 'meta', text: u.bills + ' bill(s)' + (u.lastSeen ? ' · last seen ' + u.lastSeen : ' · never signed in') }),
        ]),
      ]));
      const acts = el('div', { class: 'acts' });
      if (pendingDelete === u.email) {
        acts.appendChild(el('span', { class: 'small', text: 'Delete this account?' }));
        acts.appendChild(el('button', { type: 'button', class: 'danger', text: 'Yes, delete', onclick: function () {
          run('deleteUser', u.email).then(function (r) { pendingDelete = null; msg(r.message, 'ok'); return load(); })
            .catch(function (e) { msg(e.message, 'error'); });
        } }));
        acts.appendChild(el('button', { type: 'button', class: 'ghost', text: 'No', onclick: function () { pendingDelete = null; render(); } }));
      } else {
        const self = u.isOwner || u.email === me;
        if (!self) {
          acts.appendChild(el('button', { type: 'button', class: 'ghost', text: u.active ? 'Switch off' : 'Switch on', onclick: function () {
            run('saveUser', { originalEmail: u.email, email: u.email, name: u.name, role: u.role, active: !u.active })
              .then(function (r) { msg(r.message, 'ok'); return load(); }).catch(function (e) { msg(e.message, 'error'); });
          } }));
        }
        acts.appendChild(el('button', { type: 'button', class: 'ghost', text: 'Edit', onclick: function () { startEdit(u); } }));
        if (!self) acts.appendChild(el('button', { type: 'button', class: 'danger', text: 'Delete', onclick: function () { pendingDelete = u.email; render(); } }));
      }
      box.appendChild(acts);
      return box;
    }

    function init() {
      $('um-search').addEventListener('input', render);
      $('um-cancel').addEventListener('click', function () { resetForm(); msg(''); });
      $('um-form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        const data = { email: $('um-email').value, name: $('um-name').value, role: $('um-role').value,
                       active: $('um-active').checked, originalEmail: editing || '' };
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email.trim())) { msg('Enter a valid Google account e-mail.', 'error'); return; }
        if (!data.name.trim()) { msg('Enter the person\'s name.', 'error'); return; }
        $('um-submit').disabled = true;
        run('saveUser', data).then(function (r) { resetForm(); msg(r.message, 'ok'); return load(); })
          .catch(function (e) { msg(e.message, 'error'); })
          .then(function () { $('um-submit').disabled = false; });
      });
      return load();
    }

    return { init: init, reload: load };
  })();
</script>
