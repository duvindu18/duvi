<style>
  /* ------------------------------------------------------------------ tokens */
  :root {
    --bg: #f2f2f2;
    --surface: #ffffff;
    --field: #e9e9e9;
    --field-focus: #ffffff;
    --ink: #0b0b0b;
    --dim: #8a8a8a;
    --muted: #7a7a7a;
    --line: #dddddd;
    --btn: #0b0b0b;
    --btn-ink: #ffffff;
    --accent: #f5c400;
    --ok: #1e8e3e;
    --warn: #b26a00;
    --warn-bg: #fff4d6;
    --err: #d93025;
    --err-bg: #fde8e6;
    --overlay: rgba(10, 10, 10, .45);
    --radius: 18px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0c0c; --surface: #171717; --field: #1d1d1d; --field-focus: #242424;
      --ink: #f3f3f3; --dim: #7d7d7d; --muted: #8f8f8f; --line: #2a2a2a;
      --btn: #f3f3f3; --btn-ink: #0b0b0b;
      --warn: #f2b84b; --warn-bg: #2b2110; --err: #ff7a6e; --err-bg: #2d1412; --ok: #5bd17d;
      --overlay: rgba(0, 0, 0, .65);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0c0c; --surface: #171717; --field: #1d1d1d; --field-focus: #242424;
    --ink: #f3f3f3; --dim: #7d7d7d; --muted: #8f8f8f; --line: #2a2a2a;
    --btn: #f3f3f3; --btn-ink: #0b0b0b;
    --warn: #f2b84b; --warn-bg: #2b2110; --err: #ff7a6e; --err-bg: #2d1412; --ok: #5bd17d;
    --overlay: rgba(0, 0, 0, .65);
    color-scheme: dark;
  }

  /* ------------------------------------------------------------------ base */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 16px/1.5 Roboto, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased; transition: background .2s, color .2s;
  }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .dim { color: var(--dim); }
  .small { font-size: 13px; }
  .center { text-align: center; }
  .pad { padding: 60px 0; }
  code { font: 12.5px ui-monospace, "Roboto Mono", Consolas, monospace; color: var(--ink); word-break: break-all; }
  a { color: inherit; }

  /* ------------------------------------------------------------------ header */
  .topbar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark { width: 30px; height: 30px; color: var(--ink); }
  .mark .dot { fill: var(--accent); }
  .brand .title { font-weight: 700; font-size: 20px; letter-spacing: -.3px; }
  .top-actions { display: flex; gap: 4px; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--ink);
    display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .icon-btn:hover { background: var(--field); }
  .icon-btn svg { width: 24px; height: 24px; }
  #btnTheme .sun { display: none; }
  :root[data-theme="dark"] #btnTheme .sun { display: block; }
  :root[data-theme="dark"] #btnTheme .moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #btnTheme .sun { display: block; }
    :root:not([data-theme="light"]) #btnTheme .moon { display: none; }
  }

  .avatar {
    width: 38px; height: 38px; border-radius: 50%; border: 0; margin-right: 4px; cursor: pointer;
    background: var(--btn); color: var(--btn-ink); font-weight: 700; font-size: 14px; align-self: center;
  }
  .kv-card { background: var(--field); border-radius: var(--radius); padding: 16px 18px; margin-top: 8px; }
  .kv-card .who { font-size: 20px; font-weight: 700; word-break: break-all; }
  a.pill-btn { text-decoration: none; }

  /* ------------------------------------------------------------------ layout */
  main { max-width: 760px; margin: 0 auto; padding: 0 20px 40px; }
  .hero { padding: 28px 0 8px; }
  h1 {
    font-size: clamp(40px, 11vw, 64px); line-height: 1.02; letter-spacing: -2px; font-weight: 700; margin: 0 0 16px;
  }
  .lead { font-size: 17px; color: var(--muted); margin: 0; max-width: 520px; }
  section { padding: 30px 0 6px; border-top: 1px solid var(--line); margin-top: 26px; }
  .hero + section { border-top: 0; margin-top: 8px; }
  .sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  .sec-head .num { font: 600 13px ui-monospace, "Roboto Mono", monospace; color: var(--dim); }
  h2 { font-size: 21px; font-weight: 700; letter-spacing: -.3px; margin: 0; }
  h2.big { font-size: 30px; letter-spacing: -1px; }
  .hint { font-size: 13.5px; color: var(--muted); margin: 10px 0 0; }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
  .grid .full { grid-column: 1 / -1; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

  /* ------------------------------------------------------------------ fields */
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
  .req::after { content: " •"; color: var(--accent); }
  input, select, textarea {
    font: inherit; font-size: 16px; color: var(--ink); background: var(--field);
    border: 1.5px solid transparent; border-radius: 14px; padding: 13px 14px; width: 100%; min-width: 0;
    transition: background .15s, border-color .15s; appearance: none; -webkit-appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 55%, calc(100% - 15px) 55%; background-size: 5px 5px; background-repeat: no-repeat;
    padding-right: 36px;
  }
  input[type="date"] { min-height: 50px; }
  input::placeholder, textarea::placeholder { color: var(--dim); }
  input:focus, select:focus, textarea:focus { outline: none; background: var(--field-focus); border-color: var(--ink); }
  input[type="checkbox"] { width: 18px; height: 18px; padding: 0; appearance: auto; -webkit-appearance: checkbox; accent-color: var(--ink); }
  textarea { resize: vertical; }
  .invalid { border-color: var(--err) !important; }
  .money { text-align: right; font-variant-numeric: tabular-nums; }

  .total-box {
    display: flex; align-items: baseline; justify-content: space-between; padding: 6px 2px 2px;
    border-bottom: 1px solid var(--line); font-weight: 600; color: var(--muted);
  }
  .total-box .val { font-size: 34px; font-weight: 700; letter-spacing: -1px; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ------------------------------------------------------------------ buttons */
  button, .btn, .pill-btn, .soft-btn, .text-btn { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 18px; border: 0; border-radius: 999px;
    background: var(--btn); color: var(--btn-ink); font-size: 18px; font-weight: 600;
    padding: 6px 6px 6px 26px; min-height: 60px; transition: transform .12s, opacity .15s;
  }
  .pill-btn:active { transform: scale(.97); }
  .pill-btn:disabled { opacity: .5; cursor: not-allowed; }
  .pill-btn .pill-ico {
    width: 48px; height: 48px; border-radius: 50%; background: var(--btn-ink); color: var(--btn);
    display: grid; place-items: center;
  }
  .pill-btn .pill-ico svg { width: 22px; height: 22px; }
  .pill-btn.danger { background: var(--err); color: #fff; padding: 6px 26px; }
  .soft-btn {
    display: inline-flex; align-items: center; min-height: 60px; padding: 0 24px; border-radius: 999px;
    background: var(--field); color: var(--ink); font-weight: 600; font-size: 16px; border: 0;
  }
  .text-btn {
    background: none; border: 0; padding: 8px 4px; color: var(--muted); font-size: 16px;
    text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px;
  }
  .text-btn:hover { color: var(--ink); }
  .actions { display: flex; justify-content: flex-end; align-items: center; gap: 18px; margin-top: 28px; flex-wrap: wrap; }
  .sticky-actions {
    position: sticky; bottom: 0; padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }

  /* Legacy button classes (category manager) */
  .primary, .secondary, .ghost, .danger {
    border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 14px; border: 0;
  }
  .primary { background: var(--btn); color: var(--btn-ink); }
  .secondary, .ghost { background: var(--field); color: var(--ink); }
  .danger { background: var(--err-bg); color: var(--err); }

  /* ------------------------------------------------------------------ upload */
  .drop { border-radius: var(--radius); padding: 4px 0 0; transition: .15s; }
  .drop.over { background: var(--field); outline: 2px dashed var(--ink); outline-offset: 8px; }
  .drop.invalid { outline: 2px solid var(--err); outline-offset: 8px; border-color: transparent !important; }
  .row-btns { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; margin-top: 18px; }
  .thumbs:empty { display: none; }
  .thumb { position: relative; }
  .thumb img, .thumb .pdf { width: 100%; aspect-ratio: 1; border-radius: 16px; object-fit: cover; display: block; background: var(--field); }
  .thumb .pdf { display: grid; place-items: center; font: 700 15px ui-monospace, monospace; color: var(--muted); }
  .thumb .cap { font-size: 12px; padding-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .thumb .cap.warn { color: var(--warn); font-weight: 700; white-space: normal; }
  .thumb .rm {
    position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.65); color: #fff; font-size: 13px;
  }

  /* ------------------------------------------------------------------ alerts */
  .alert { padding: 13px 16px; border-radius: 14px; margin-top: 20px; white-space: pre-line; font-size: 14.5px; }
  .alert.error { background: var(--err-bg); color: var(--err); }
  .alert.warn { background: var(--warn-bg); color: var(--warn); }
  .alert.ok { background: var(--field); color: var(--ink); }

  /* ------------------------------------------------------------------ success */
  .tick {
    width: 64px; height: 64px; border-radius: 50%; background: var(--btn); color: var(--btn-ink);
    display: grid; place-items: center; margin-bottom: 20px;
  }
  .tick svg { width: 30px; height: 30px; }
  .ref { font: 700 24px ui-monospace, "Roboto Mono", Consolas, monospace; letter-spacing: .5px; }
  .verified { color: var(--ok); font-size: 14px; font-weight: 600; margin-top: 8px; }
  .verified:empty { display: none; }
  table.kv { width: 100%; border-collapse: collapse; margin-top: 22px; }
  table.kv th, table.kv td { text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.kv th { width: 38%; color: var(--muted); font-weight: 500; font-size: 14px; padding-right: 12px; }
  table.kv .tot { font-size: 22px; letter-spacing: -.5px; }
  ul.files { margin: 0; padding: 0; list-style: none; }
  ul.files li + li { margin-top: 6px; }
  ul.files a { font-size: 13.5px; word-break: break-all; text-underline-offset: 3px; }

  /* ------------------------------------------------------------------ recent */
  #sessionCard { margin-top: 44px; }
  .list-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .list-head .muted { font-size: 14px; }
  ul.session { list-style: none; margin: 0; padding: 0; }
  ul.session li { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  ul.session .tile {
    width: 52px; height: 52px; border-radius: 14px; flex: none; display: grid; place-items: center;
    background: var(--btn); color: var(--btn-ink); font-weight: 700; font-size: 15px;
  }
  ul.session .grow { flex: 1; min-width: 0; }
  ul.session .ttl { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  ul.session .meta { font-size: 13.5px; color: var(--muted); }
  ul.session .meta b { color: var(--ink); font-family: ui-monospace, "Roboto Mono", monospace; font-weight: 600; }
  ul.session .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .foot { margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .foot span:first-child { font-weight: 700; font-size: 18px; }

  /* ------------------------------------------------------------------ overlays */
  .overlay { position: fixed; inset: 0; z-index: 20; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; }
  .modal {
    background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto;
    padding: 26px 22px calc(22px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0;
    animation: up .22s ease-out;
  }
  @media (min-width: 700px) { .overlay { align-items: center; } .modal { border-radius: 26px; } }
  .modal.wide { max-width: 760px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .dup-list { padding-left: 18px; }
  .dup-list li { margin-bottom: 10px; }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .busy { flex-direction: column; align-items: center; justify-content: center; color: #fff; gap: 16px; font-weight: 600; }
  .spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  .spinner.small { width: 30px; height: 30px; border-color: var(--line); border-top-color: var(--ink); margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ------------------------------------------------------------------ category manager */
  .cm-add { display: grid; grid-template-columns: 2fr 1.5fr 1fr auto; gap: 10px; align-items: end; }
  .cm-add .primary { min-height: 50px; padding: 0 22px; }
  @media (max-width: 640px) { .cm-add { grid-template-columns: 1fr; } }
  .cm-list { margin-top: 10px; }
  .cm-group { font: 600 12px ui-monospace, "Roboto Mono", monospace; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 22px 0 4px; }
  .cm-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .cm-item.archived { opacity: .55; }
  .cm-item .nm { font-weight: 600; }
  .cm-item .meta { font-size: 13px; color: var(--muted); }
  .cm-item .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .cm-item .acts button { padding: 7px 14px; font-size: 13px; }
  .cm-edit { display: grid; grid-template-columns: 2fr 1.5fr 1fr; gap: 8px; width: 100%; }
  @media (max-width: 640px) { .cm-edit { grid-template-columns: 1fr; } }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--field); color: var(--muted); margin-left: 6px; }
  /* ------------------------------------------------------------------ tabs / my bills / edit */
  .tabs { display: inline-flex; gap: 4px; padding: 4px; margin-top: 18px; border-radius: 999px; background: var(--field); }
  .tab { border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 15px; padding: 10px 18px; border-radius: 999px; }
  .tab.on { background: var(--btn); color: var(--btn-ink); }
  .edit-banner { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--field); border-radius: 14px; padding: 12px 16px; margin-top: 14px; font-size: 14.5px; }
  .existing { margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: var(--field); }
  .existing .files { margin-top: 6px; }
  #mineSearch { margin: 4px 0 8px; }
  ul.session .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  ul.session li.void { opacity: .5; }
  ul.session li.void .ttl { text-decoration: line-through; }
  .mini-btn { border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 13px; background: var(--btn); color: var(--btn-ink); cursor: pointer; }
  .lock { font-size: 12px; color: var(--muted); }

  /* ------------------------------------------------------------------ user manager */
  .um-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; background: var(--surface); padding: 16px; border-radius: var(--radius); }
  .um-form .full { grid-column: 1 / -1; }
  .um-check { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .um-btns { display: flex; justify-content: flex-end; gap: 8px; }
  .um-btns .primary { min-height: 48px; padding: 0 22px; }
  @media (max-width: 640px) { .um-form { grid-template-columns: 1fr; } }
  .um-filter { margin-top: 18px; }
  .um-person { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .um-person .meta { word-break: break-all; }
  .um-av { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--btn); color: var(--btn-ink); font-weight: 700; font-size: 14px; }
  .sidebar main { padding: 16px 14px; }
  .sidebar .um-form { grid-template-columns: 1fr; }
  .sidebar .cm-add, .sidebar .cm-edit { grid-template-columns: 1fr; }
</style>
