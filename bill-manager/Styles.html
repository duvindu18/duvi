<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --ink: #1b2430; --muted: #5f6b7a; --line: #dde3ec;
    --brand: #1f3864; --brand-2: #2f5597; --accent: #e8f0fe; --ok: #137333; --ok-bg: #e6f4ea;
    --warn: #b06000; --warn-bg: #fef7e0; --err: #c5221f; --err-bg: #fce8e6; --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font: 15px/1.45 "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 12px 16px; background: var(--brand); color: #fff; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { font-size: 26px; }
  .brand .title { font-weight: 700; font-size: 17px; }
  .brand .sub { font-size: 12px; opacity: .8; }
  .topbar .ghost { color: #fff; border-color: rgba(255,255,255,.45); }

  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(16,24,40,.08); padding: 18px; margin-bottom: 16px; }
  .center { text-align: center; }
  section + section { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h3 { font-size: 15px; margin: 0 0 10px; }
  .step { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
  .grid .full { grid-column: 1 / -1; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .req::after { content: " *"; color: var(--err); }
  input, select, textarea { font: inherit; color: var(--ink); padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; width: 100%; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-2); outline-offset: -1px; border-color: transparent; }
  textarea { resize: vertical; min-height: 64px; }
  .invalid { border-color: var(--err) !important; background: var(--err-bg); }
  .money { text-align: right; font-variant-numeric: tabular-nums; }
  .total-box { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; background: var(--accent); font-weight: 700; }
  .total-box .val { font-size: 19px; color: var(--brand); font-variant-numeric: tabular-nums; }

  button, .btn { font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px; padding: 9px 16px; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  .primary { background: var(--brand); color: #fff; }
  .primary:hover { background: var(--brand-2); }
  .primary:disabled { opacity: .55; cursor: not-allowed; }
  .secondary { background: var(--accent); color: var(--brand); }
  .ghost { background: transparent; color: var(--brand); border-color: var(--line); }
  .danger { background: var(--err-bg); color: var(--err); }
  .link { background: none; border: 0; padding: 0; color: var(--brand-2); font-weight: 600; text-decoration: underline; cursor: pointer; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

  .drop { border: 2px dashed #b8c4d6; border-radius: var(--radius); padding: 22px 16px; text-align: center; background: #fafcff; transition: .15s; }
  .drop.over { border-color: var(--brand-2); background: var(--accent); }
  .drop p { margin: 0 0 12px; }
  .row-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 12px; }
  .thumb { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .thumb img { width: 100%; height: 110px; object-fit: cover; display: block; }
  .thumb .pdf { height: 110px; display: grid; place-items: center; font-size: 34px; background: #fff4f2; }
  .thumb .cap { font-size: 11px; padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .thumb .rm { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; padding: 0; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 14px; }

  .alert { padding: 10px 12px; border-radius: 8px; margin-top: 14px; white-space: pre-line; }
  .alert.error { background: var(--err-bg); color: var(--err); }
  .alert.warn { background: var(--warn-bg); color: var(--warn); }
  .alert.ok { background: var(--ok-bg); color: var(--ok); }

  .success-head { text-align: center; padding: 6px 0 14px; }
  .success-head .tick { width: 60px; height: 60px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-bg); color: var(--ok); font-size: 32px; }
  .ref { font: 700 22px/1.2 ui-monospace, Consolas, monospace; color: var(--brand); letter-spacing: .5px; }
  table.kv { width: 100%; border-collapse: collapse; margin-top: 8px; }
  table.kv th, table.kv td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.kv th { width: 38%; color: var(--muted); font-weight: 600; font-size: 13px; }
  table.kv td.money { text-align: left; }
  ul.files { margin: 6px 0 0; padding-left: 18px; }
  ul.session { list-style: none; margin: 0; padding: 0; }
  ul.session li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  ul.session .r { font-family: ui-monospace, Consolas, monospace; font-weight: 700; color: var(--brand); }

  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: #fff; border-radius: var(--radius); width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; padding: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .modal.wide { max-width: 760px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .busy { flex-direction: column; color: #fff; gap: 14px; font-weight: 600; }
  .spinner { width: 46px; height: 46px; border: 5px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Category manager */
  .cm-add { display: grid; grid-template-columns: 2fr 1.5fr 1fr auto; gap: 8px; align-items: end; }
  @media (max-width: 600px) { .cm-add { grid-template-columns: 1fr; } }
  .cm-list { margin-top: 14px; }
  .cm-group { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 14px 0 4px; }
  .cm-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .cm-item.archived { background: #f6f7f9; color: var(--muted); }
  .cm-item .nm { font-weight: 600; }
  .cm-item .meta { font-size: 12px; color: var(--muted); }
  .cm-item .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .cm-item .acts button { padding: 5px 10px; font-size: 13px; }
  .cm-edit { display: grid; grid-template-columns: 2fr 1.5fr 1fr; gap: 6px; width: 100%; }
  @media (max-width: 600px) { .cm-edit { grid-template-columns: 1fr; } }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 700; background: var(--accent); color: var(--brand); margin-left: 6px; }
  .badge.grey { background: #e8eaed; color: #5f6368; }
  .sidebar main { padding: 10px; }
  .sidebar .cm-add, .sidebar .cm-edit { grid-template-columns: 1fr; }
</style>
