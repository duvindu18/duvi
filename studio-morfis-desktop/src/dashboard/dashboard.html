/* ----- folders ----- */
function folderNote() {
  if (HOST) return '<div class="note">' + icon('info', 18) + '<span>These are real folders on this computer. File counts and dates are read from the disk each time you open this page. Drop files onto a folder card to add them there.</span></div>';
  return '<div class="note">' + icon('info', 18) + '<span>A web page cannot read or write your disk. Use <b>Create folders</b> to build the standard structure on your computer, then log files here so counts and dates stay current. Open links use file:// and some browsers block them; Copy path always works.</span></div>';
}
function projStats(p) {
  let count = 0, mod = p.startDate, filled = 0;
  const ids = [], syncs = {};
  FOLDER_TEMPLATES.forEach((ft) => {
    const f = p.folders[ft.id];
    if (!f) return;
    const st = folderStats(f);
    count += st.count; if (st.count) filled++;
    if (st.modified > mod) mod = st.modified;
    (f.assignees || []).forEach((a) => { if (ids.indexOf(a) === -1) ids.push(a); });
    const sy = f.sync || S.settings.sync; syncs[sy] = (syncs[sy] || 0) + 1;
  });
  const sync = Object.keys(syncs).sort((a, b) => syncs[b] - syncs[a])[0] || S.settings.sync;
  return { count: count, mod: mod, filled: filled, ids: ids, sync: sync };
}
function createdTag(p) {
  if (HOST && p.dirMissing) return '<span class="no">Folder not found</span>';
  return p.foldersCreated ? '<span class="ok">' + icon('check', 12) + 'Created ' + fd(p.foldersCreated) + '</span>' : '<span class="no">Not created yet</span>';
}
function fcard(o) {
  return '<article class="fcard t-' + o.tone + (o.cover ? ' has-cover' : '') + '" role="button" tabindex="0" data-act="' + o.act + '" ' + o.data + ' aria-label="' + esc(o.aria) + '">' +
    coverEl('fc-cover', o.cover) + '<span class="notch"></span><div class="nbtns"><button type="button" class="fbtn" data-act="menu" data-kind="' + o.kind + '" data-pid="' + o.pid + '"' + (o.fid ? ' data-fid="' + o.fid + '"' : '') + ' aria-label="Folder actions" aria-haspopup="menu">' + icon('dots', 18) + '</button>' +
    '<button type="button" class="fbtn" data-act="' + o.act + '" ' + o.data + ' aria-label="' + esc(o.aria) + '" tabindex="-1">' + icon('upright', 18) + '</button></div>' +
    '<div class="fc-top">' + (o.av ? '<span class="fc-av">' + esc(o.av) + '</span>' : '') + (o.topNote ? '<span class="small muted mono" style="min-width:0;overflow:hidden;text-overflow:ellipsis">' + esc(o.topNote) + '</span>' : '') + '</div>' +
    '<div><div class="fc-name">' + esc(o.name) + '</div><div class="fc-sub">' + o.sub + '</div></div>' +
    '<div class="fc-tags">' + o.tags + '</div>' +
    '<div class="fc-pairs">' + o.pairs.map((x) => '<div><span class="fc-k">' + x[0] + '</span><span class="fc-v">' + x[1] + '</span></div>').join('') + '</div></article>';
}
function subfolderGrid(p) {
  const stats = FOLDER_TEMPLATES.map((ft) => folderStats(p.folders[ft.id] || { files: [], created: p.startDate }));
  let hotIdx = -1, best = '';
  stats.forEach((st, i) => { if (st.count && st.modified > best) { best = st.modified; hotIdx = i; } });
  return '<div class="fgrid">' + FOLDER_TEMPLATES.map((ft, i) => {
    const f = p.folders[ft.id] || { assignees: [], files: [], sync: '', created: p.startDate }, st = stats[i], sync = f.sync || S.settings.sync;
    return fcard({ tone: ft.tone, hot: i === hotIdx, cover: f.cover, act: 'openFolder', data: 'data-pid="' + p.id + '" data-fid="' + ft.id + '"', aria: 'Open ' + ft.label, kind: 'sub', pid: p.id, fid: ft.id,

  }).join('') + '</div>';
}

function projectFolderCard(p, hot) {

let MENU = null, toastFn = null, toastTimer = null, confirmFn = null, lastFocus = null, dragTask = null;

function toast(msg, action) {
  const el = $('#toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button type="button" data-act="toastAction">' + esc(action.label) + '</button>' : '');
  toastFn = action ? action.fn : null;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; toastFn = null; }, action ? 7000 : 3800);
}
function shell(title, inner) {
  return '<div class="dlg-head"><h2>' + esc(title) + '</h2><button type="button" class="icon-btn" data-act="close" aria-label="Close">' + icon('x') + '</button></div>' + inner;
}
function openModal(html, o) {
  o = o || {};
  const ov = $('#overlay');
  if (!o.drawer) S.ui.drawer = null;
  if (ov.hidden) lastFocus = document.activeElement;
  ov.className = 'overlay' + (o.drawer ? ' drawer' : '');
  ov.innerHTML = '<div class="dialog' + (o.drawer ? ' drawer' : '') + (o.wide ? ' wide' : '') + (o.cls ? ' ' + o.cls : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.label || 'Dialog') + '" tabindex="-1">' + html + '</div>';
  ov.hidden = false;
  ddScan(ov);
  const first = ov.querySelector('input:not([type=hidden]):not([readonly]),select,textarea') || ov.querySelector('.dialog');
  if (first) first.focus();
}
/* the import wizard keeps its place on a stray click, and cannot be closed while it is moving files */
function modalLocked() { return !!(HOST && IMP && IMP.busy === 'run' && $('#overlay [data-imp-root]')); }
function closeModal() {
  const ov = $('#overlay');
  ov.hidden = true;
  ov.innerHTML = '';
  S.ui.drawer = null;
  confirmFn = null;
  if (lastFocus && document.contains(lastFocus) && lastFocus.focus) lastFocus.focus();
}
function refreshDrawer(fromSnapshot) {
  const d = S.ui.drawer, p = d && P(d.pid), dlg = $('#overlay .dialog');
  if (!d) return;
  const act = document.activeElement;
  if (fromSnapshot && dlg && act && dlg.contains(act) && (/^(INPUT|TEXTAREA|SELECT)$/.test(act.tagName || '') || act.classList.contains('dd-btn'))) return;
  if (d.kind === 'remind') { if (!dlg) { S.ui.drawer = null; return; } const k = dlg.scrollTop; dlg.innerHTML = remindersInner(); ddScan(dlg); dlg.scrollTop = k; return; }
  if (!p || !dlg) { S.ui.drawer = null; if (!p && !$('#overlay').hidden) closeModal(); return; }
  const keep = dlg.scrollTop;

  dlg.scrollTop = keep;
}
function openMenu(btn, items) {
  closeMenu();
  if (!items.length) return;
  const m = document.createElement('div');
  m.className = 'menu';
  m.setAttribute('role', 'menu');
  m.innerHTML = items.map((it) => {
    if (it.href) return '<a role="menuitem" href="' + esc(it.href) + '" target="_blank" rel="noopener">' + icon(it.icon || 'ext', 16) + esc(it.label) + '</a>';
    const data = Object.keys(it.data || {}).map((k) => 'data-' + k + '="' + esc(it.data[k]) + '"').join(' ');
    return '<button type="button" role="menuitem" class="' + (it.danger ? 'danger' : '') + '" data-act="' + it.act + '" ' + data + '>' + icon(it.icon || 'dots', 16) + esc(it.label) + '</button>';
  }).join('');
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  let top = r.bottom + 6;
  if (top + mh > window.innerHeight - 8) { top = Math.max(8, r.top - mh - 6); m.classList.add('up'); }
  m.style.left = Math.min(Math.max(8, r.right - mw), window.innerWidth - mw - 8) + 'px';
  m.style.top = top + 'px';
  m._owner = btn;
  MENU = m;
  const f = m.querySelector('button,a');
  if (f) f.focus();
}

async function copyText(txt, ok) {
  try { await navigator.clipboard.writeText(txt); toast(ok || 'Copied'); return; } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();

  } catch (e) { toast('Copy is blocked here. Select the text and copy it manually.'); }
}

  setting(el) {
    const k = el.dataset.key, kind = el.dataset.kind || 'text', def = getPath(DEFAULT_SETTINGS, k);
    let v = el.value;
    if (kind === 'num') {
      v = +v; if (!isFinite(v) || v < 0) v = def;
      const mx = typeof el.getAttribute === 'function' ? +el.getAttribute('max') : 0;
      if (mx && v > mx) v = mx;
      el.value = v;
    } else if (kind === 'upper') { v = String(v).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8); el.value = v; }
    else if (kind === 'root') { v = String(v).trim().replace(/^"(.*)"$/, '$1') || def; el.value = v; }
    else if (kind === 'raw') { if (k === 'codeFormat.digits') v = +v; }
    else { v = String(v).trim(); if (k === 'studio' && !v) v = def; }

  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || '')) && $('#overlay').hidden) { e.preventDefault(); $('#q').focus(); return; }

const REDUCED = (() => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

/* count a number up from 0; keeps the element's own formatting by re-using a template */
function countUp(el) {
  if (REDUCED || el.dataset.counted) return;
  const raw = el.textContent;
  const m = raw.match(/-?[\d,]+(\.\d+)?/);
  if (!m) return;
  const num = parseFloat(m[0].replace(/,/g, ''));
  if (!isFinite(num) || Math.abs(num) < 2) return;
  el.dataset.counted = '1';
  const dec = (m[1] || '').length - (m[1] ? 1 : 0);
  const pre = raw.slice(0, m.index), post = raw.slice(m.index + m[0].length);
  const t0 = performance.now(), dur = 700;
  const fmt = (v) => v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  const tick = (t) => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = pre + fmt(num * e) + post;
    if (k < 1 && document.contains(el)) requestAnimationFrame(tick); else el.textContent = raw;
  };
  el.textContent = pre + fmt(0) + post;
  requestAnimationFrame(tick);
}
/* called after a navigation-level render: stagger the cards, grow the bars, count the figures */
function playEnter(el) {
  if (!el) return;
  el.classList.remove('enter');
  if (REDUCED) return;
  void el.offsetWidth;
  el.classList.add('enter');
  let n = 0;
  el.querySelectorAll('.kpi,.pcard,.fcard,.card,.gcard,.col,.stat,.new-card,.inv-row,.team-row,.code-row,.wk,.g-row').forEach((c) => { c.style.setProperty('--i', Math.min(n++, 18)); });
  n = 0;
  el.querySelectorAll('.task').forEach((c) => { c.style.setProperty('--j', Math.min(n++, 30)); });
  el.querySelectorAll('.kpi .val,.stat > b,.tw-num').forEach(countUp);
}

/* ===== File manager inside a folder drawer (Windows desktop build) ===== */
/* Browse, rename, delete (to the Recycle Bin) and drag files between a project's folders. All paths are relative to the project folder. */
const FM = { loaded: '', entries: [], capped: false, err: '', sel: new Set(), renaming: '', renameVal: '', creating: false, confirm: null, sort: 'name', drag: null, moveNames: [], anchor: null };
const fmTpl = (fid) => FOLDER_TEMPLATES.find((f) => f.id === fid);
const fmSubFor = (p, fid) => { const d = S.ui.drawer; return d && d.pid === p.id && d.fid === fid && d.sub ? d.sub : ''; };
const fmRel = (fid, sub, name) => fmTpl(fid).name + (sub ? '/' + sub : '') + (name ? '/' + name : '');
const fmKey = (pid, fid, sub) => pid + '|' + fid + '|' + (sub || '');
const fmAbs = (p, fid, sub, name) => joinNative(projDir(p), fmRel(fid, sub, name));
const fmPlural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
function fmReset() { FM.sel.clear(); FM.renaming = ''; FM.renameVal = ''; FM.creating = false; FM.confirm = null; FM.drag = null; }

async function fmLoad() {
  const d = S.ui.drawer;
  if (!HOST || !d || !d.fid) return;
  const p = P(d.pid);
  if (!p) return;
  const want = fmKey(d.pid, d.fid, d.sub);
  let r = null, err = '';
  try { r = await HOST.listDir(projDir(p), fmRel(d.fid, d.sub || '')); }
  catch (e) { if (!(e && e.code === 'ENOENT')) err = (e && e.message) || 'Could not read the folder.'; }
  const now = S.ui.drawer;
  if (!now || fmKey(now.pid, now.fid, now.sub) !== want) return;
  FM.loaded = want; FM.err = err; FM.entries = r ? r.entries : []; FM.capped = !!(r && r.capped);
  const names = new Set(FM.entries.map((x) => x.name));
  FM.sel.forEach((n) => { if (!names.has(n)) FM.sel.delete(n); });
  if (FM.renaming && !names.has(FM.renaming)) { FM.renaming = ''; }
  refreshDrawer();
  fmFocusInput();
}
function fmGo(fid, sub) {
  const d = S.ui.drawer, ft = fmTpl(fid);
  if (!d || !ft) return;
  if (d.fid !== fid) { const dlg = $('#overlay .dialog'); if (dlg) dlg.setAttribute('aria-label', ft.label); }
  d.fid = fid; d.sub = sub || '';
  const p = P(d.pid);
  if (p && !p.folders[fid]) p.folders[fid] = { assignees: [], sync: '', created: p.startDate, files: [] };
  fmReset(); FM.loaded = '';
  refreshDrawer();
  fmLoad();
  const dlg = $('#overlay .dialog'); if (dlg) dlg.scrollTop = 0;
}
function fmFocusInput() {
  const i = $('#overlay .fm-ren');
  if (!i || i.dataset.focused) return;
  i.dataset.focused = '1';
  i.focus();
  const v = i.value, dot = v.lastIndexOf('.');
  i.setSelectionRange(0, dot > 0 && i.dataset.dir !== '1' ? dot : v.length);
  i.scrollIntoView({ block: 'nearest' });
}

  list.sort((a, b) => a.dir !== b.dir ? (a.dir ? -1 : 1) : (FM.sort === 'new' ? (b.mtimeMs - a.mtimeMs) || nat(a, b) : nat(a, b)));

async function coverFromFile(file) {
  if (!file || !/^image\/(png|jpe?g|webp|gif|bmp|avif)$/i.test(file.type || '')) throw new Error('Choose a picture file (JPG, PNG or WebP).');
  if (file.size > 30 * 1024 * 1024) throw new Error('That picture is over 30 MB. Choose a smaller one.');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('That picture could not be read.')); i.src = url; });
    const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
    if (!w0 || !h0) throw new Error('That picture has no size.');
    let scale = Math.min(1, 1000 / Math.max(w0, h0)), q = 0.82, out = '';
    for (let n = 0; n < 6; n++) {
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w0 * scale)); c.height = Math.max(1, Math.round(h0 * scale));
      const g = c.getContext('2d');
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      out = c.toDataURL('image/jpeg', q);
      if (out.length <= 170000) break;
      q = Math.max(0.5, q - 0.08); scale *= 0.85;
    }
    if (out.length > 400000) throw new Error('That picture is too detailed to keep. Try a simpler one.');
    return out;
  } finally { URL.revokeObjectURL(url); }
}

/* ===== timeline: every project on one Gantt ===== */
const TL_ZOOMS = [['fit', 'Fit'], ['12', '12 mo'], ['6', '6 mo'], ['3', '3 mo']];
const TL_SORTS = [['start', 'Start date'], ['end', 'Hand-over'], ['stage', 'Stage'], ['code', 'Code']];
const TL_LW = 248;
function tlList() {

    end: (a, b) => a.stages[6].end.localeCompare(b.stages[6].end) || byCode(a, b),
    stage: (a, b) => a.currentStage - b.currentStage || a.stages[0].start.localeCompare(b.stages[0].start) || byCode(a, b),
    code: byCode

  return visibleProjects(S.ui.status).sort(f[k] || f.start);
}
function tlMonthTicks(s0, s1, ppd) {

  for (let g = 0, i = 0; g < 240; g++, i++) {
    const first = y + '-' + pad2(mo) + '-01';

    if (i % step === 0) out.push({ at: first, label: MONTHS[mo - 1] + (mo === 1 || !out.length ? ' ' + y : '') });
    mo++; if (mo > 12) { mo = 1; y++; }

}

    '<div class="toolbar"><div class="seg-ctl" role="group" aria-label="Status">' + segs.map((s) => '<button type="button" class="' + (S.ui.status === s[0] ? 'on' : '') + '" data-act="setStatus" data-v="' + s[0] + '">' + s[1] + '</button>').join('') + '</div>' +
    '<div class="seg-ctl" role="group" aria-label="Zoom">' + TL_ZOOMS.map((z) => '<button type="button" class="' + ((S.ui.tlZoom || 'fit') === z[0] ? 'on' : '') + '" data-act="tlZoom" data-v="' + z[0] + '">' + z[1] + '</button>').join('') + '</div>' +
    '<label class="sel"><span>Sort</span><select data-change="tlSort" aria-label="Sort the timeline">' + TL_SORTS.map((o) => '<option value="' + o[0] + '"' + ((S.ui.tlSort || 'start') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></label></div></div>';
}

  let s0 = TODAY, s1 = TODAY;
  list.forEach((p) => { if (p.stages[0].start < s0) s0 = p.stages[0].start; if (p.stages[6].end > s1) s1 = p.stages[6].end; });
  const first = s0, last = s1;

  const body = sec('Overdue', late, 'late') + sec('Tasks due', tasks) + sec('Invoices due', inv);
  return shell(all ? 'Due this week' : (sel === 0 ? 'Today, ' : '') + wkLong(days[sel].d), '<div data-wk-root style="display:contents"><div class="wkds" role="group" aria-label="Choose a day">' + chips + '</div>' +
    (body || '<div class="wk-empty">' + icon('check', 22) + '<b>Nothing due ' + (all ? 'this week' : sel === 0 ? 'today' : 'on this day') + '</b><span class="muted small">Open projects with unfinished tasks or unpaid invoices will show up here on their due date.</span></div>') +
    '<div class="dlg-foot"><button type="button" class="btn" data-act="close">Close</button></div></div>');
}
Object.assign(A, {
  weekOpen(el) { WK = { sel: el.dataset.i === 'all' ? 'all' : +el.dataset.i }; openModal(wkHtml(), { label: 'Due this week', cls: 'wkdlg' }); },
  weekDay(el) { WK.sel = el.dataset.i === 'all' ? 'all' : +el.dataset.i; wkRender(); },
  weekTick(el) { A.cycleTask(el); wkRender(); },
  weekGo(el) { closeModal(); openProjectPage(el.dataset.id, el.dataset.tab); }
});

/* ===== tidy-up for projects that came in before the 'I' naming: close imported ones, rename folders to the default ===== */
let RN = null;
const importedOpen = () => Object.values(S.projects).filter((p) => p.imported && p.status !== 'closed');
const misnamed = () => (HOST ? Object.values(S.projects).filter((p) => p.foldersCreated && !p.dirMissing && baseName(projDir(p)) !== dirNameOf(p)) : []);
function tidyCard() {
  const imp = importedOpen(), mis = misnamed();
  if (!imp.length && !mis.length) return '';
  return '<section class="card stack"><div><h2>Tidy up imported projects</h2><p class="muted small" style="margin-top:4px">Handy after bringing in old folders. Both actions can be undone.</p></div>' +
    (imp.length ? '<div class="tidy-row"><div class="grow"><div class="strong">' + imp.length + ' imported project' + (imp.length === 1 ? ' is' : 's are') + ' still marked ongoing</div><div class="small muted">Mark them completed and closed so only live work shows in your active lists.</div></div><button type="button" class="btn" data-act="closeImported">' + icon('check', 16) + 'Mark as completed</button></div>' : '') +
    (mis.length ? '<div class="tidy-row"><div class="grow"><div class="strong">' + mis.length + ' project folder' + (mis.length === 1 ? ' is' : 's are') + ' not named like the default</div><div class="small muted">Rename them to <span class="mono">' + esc(dirNameOf(sampleProject())) + '</span>. Files inside are not touched.</div></div><button type="button" class="btn" data-act="renameAllDirs">' + icon('edit', 16) + 'Rename folders…</button></div>' : '') +
    '</section>';
}
function rnHtml() {
  const rows = RN.items;
  if (RN.done) {
    return shell('Folders renamed', '<div class="imp-sum good"><div><b>' + RN.ok.length + '</b><span>renamed</span></div><div><b>' + RN.bad.length + '</b><span>need a look</span></div></div>' +
      (RN.bad.length ? '<div class="list">' + RN.bad.map((x) => '<div class="row-item"><div class="grow"><div class="t mono small">' + esc(x.from) + '</div><div class="small" style="color:var(--bad)">' + esc(x.error) + '</div></div></div>').join('') + '</div>' : '') +
      '<div class="dlg-foot">' + (RN.ok.some((x) => x.id) ? '<button type="button" class="btn danger" data-act="renameUndo" style="margin-right:auto">' + icon('undo', 16) + 'Undo</button>' : '') + '<button type="button" class="btn primary" data-act="close">Done</button></div>');
  }
  return shell('Rename ' + rows.length + ' folder' + (rows.length === 1 ? '' : 's') + '?',
    '<p class="muted">Each project folder is renamed in place to the default naming. Files inside stay exactly where they are, and the app keeps following each folder.</p>' +
    '<div class="imp-ptable">' + rows.slice(0, 60).map((x) => '<div class="imp-prow"><div class="imp-detail" style="padding:10px 14px"><div><span class="mono small muted">' + esc(x.from) + '</span><span class="imp-arrow">→</span><span class="mono small">' + esc(x.to) + '</span></div></div></div>').join('') + (rows.length > 60 ? '<p class="small muted">and ' + (rows.length - 60) + ' more</p>' : '') + '</div>' +
    (RN.busy ? '<div class="imp-busy"><i class="spin"></i>Renaming…</div>' : '') +
    '<div class="dlg-foot"><button type="button" class="btn"' + (RN.busy ? ' disabled' : '') + ' data-act="close">Cancel</button><button type="button" class="btn primary" data-act="renameGo"' + (RN.busy ? ' disabled' : '') + '>Rename ' + rows.length + ' folder' + (rows.length === 1 ? '' : 's') + '</button></div>');
}
function rnRender() { const d = $('#overlay .dialog'); if (!d || !RN) return; d.innerHTML = rnHtml(); }
Object.assign(A, {
  closeImported() {
    const list = importedOpen(), prev = {};
    list.forEach((p) => {
      prev[p.id] = { status: p.status, stage: p.currentStage, tasks: p.tasks.map((t) => t.status) };
      p.status = 'closed'; p.currentStage = 7; p.tasks.forEach((t) => { t.status = 'done'; });
      queueWrite('p', p.id, p);
    });
    renderAll();
    toast(list.length + ' project' + (list.length === 1 ? '' : 's') + ' marked completed and closed.', { label: 'Undo', fn: () => {
      Object.keys(prev).forEach((id) => { const p = P(id); if (!p) return; const b = prev[id]; p.status = b.status; p.currentStage = b.stage; p.tasks.forEach((t, i) => { t.status = b.tasks[i] || t.status; }); queueWrite('p', p.id, p); });
      renderAll();
    } });
  },
  renameAllDirs() {
    RN = { items: misnamed().map((p) => ({ pid: p.id, from: baseName(projDir(p)), to: dirNameOf(p) })), busy: false, done: false, ok: [], bad: [] };
    if (!RN.items.length) return;
    openModal(rnHtml(), { label: 'Rename folders', wide: true });
  },
  async renameGo() {
    if (!RN || RN.busy) return;
    RN.busy = true; rnRender();
    for (const it of RN.items) {
      const p = P(it.pid); if (!p) continue;
      const dir = projDir(p);
      try {
        const rn = await HOST.renameItem(parentOf(dir), baseName(dir), it.to);
        p.folderPath = joinNative(parentOf(dir), rn.rel || it.to);
        RN.ok.push({ pid: p.id, from: dir, to: p.folderPath, id: rn.id || '' });
        queueWrite('p', p.id, p);
      } catch (e) { RN.bad.push({ from: it.from, error: (e && e.message) || 'Could not rename it.' }); }
    }
    RN.busy = false; RN.done = true; rnRender(); renderView();
    Object.values(S.projects).forEach((p) => rescanProject(p, { force: true, quiet: true }));
  },
  async renameUndo() {
    if (!RN) return;
    let n = 0;
    for (const x of RN.ok.slice().reverse()) {
      if (!x.id) continue;
      try { await HOST.undo(x.id); const p = P(x.pid); if (p) { p.folderPath = x.from; queueWrite('p', p.id, p); } n++; } catch (e) { /* leave it */ }
    }
    RN = null; closeModal(); renderAll();
    toast(n ? 'Put ' + n + ' folder name' + (n === 1 ? '' : 's') + ' back.' : 'Nothing could be undone.');
    Object.values(S.projects).forEach((p) => rescanProject(p, { force: true, quiet: true }));
  }
});

/* ----- start ----- */
(function boot() {
  loadUi();
  Object.assign(S.settings, lookFromLs());
  applyLook();
  try {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    const onSys = () => { if (S.settings.theme === 'system') { applyLook(); renderHeader(); } };
    if (mq.addEventListener) mq.addEventListener('change', onSys); else if (mq.addListener) mq.addListener(onSys);
  } catch (e) { /* no system theme signal */ }
  renderAll();
  initStore();
  setInterval(remTick, 30000);
  const wait = setInterval(() => { if (S.ready) { clearInterval(wait); setTimeout(summaryToast, 900); } }, 500);
})();

})();
</script>
