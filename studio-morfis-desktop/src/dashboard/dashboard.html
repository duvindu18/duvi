/* settings extras */
.codes-table{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;padding:3px 6px 3px 3px}
.code-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--surface-2);flex:none}
.code-row .nm{grid-column:1 / -1;min-width:0;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-row .in{width:100%;min-width:0;font-family:var(--f-mono);height:38px}
.help-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center}
.help-grid kbd{justify-self:start}
.set-grid{columns:340px 3;column-gap:18px}
.set-grid>*{break-inside:avoid;margin:0 0 18px}
.card.stack{display:flex;flex-direction:column;gap:14px}
textarea.in{height:auto;min-height:74px;padding:10px 12px;resize:vertical;line-height:1.45}

.act .icon-btn{border:1px solid var(--line-2);border-radius:50%;width:34px;height:34px;margin-left:6px;vertical-align:middle}

/* ===== themed dropdowns, anchored menus, motion ===== */
.field,.dd-wrap{position:relative}
.dd-native{position:absolute!important;left:0;bottom:0;width:1px!important;height:1px!important;min-width:0!important;padding:0!important;margin:0!important;border:0!important;opacity:0;pointer-events:none;overflow:hidden}

/* trigger inside a pill (.sel): Stage, Sort, Status, Project */
.sel.dd-wrap{padding:0 12px 0 16px;gap:8px;transition:border-color .16s,box-shadow .16s,background-color .16s}
.sel.dd-wrap::after{display:none}
.sel.dd-wrap:hover{border-color:var(--line-2)}
.sel.dd-wrap.open,.sel.dd-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dd-btn.in-pill{display:flex;align-items:center;gap:8px;height:100%;background:none;border:0;padding:0;color:var(--ink);font:600 13px var(--f-body);cursor:pointer;max-width:190px;outline:0;text-align:left}
.dd-btn .dd-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dd-btn .dd-chev{flex:none;color:var(--ink-3);transition:transform .22s cubic-bezier(.2,.8,.2,1),color .16s}
.dd-btn.open .dd-chev{transform:rotate(180deg);color:var(--accent)}

/* trigger inside a form field (select.in) */
.dd-btn.in{display:flex;align-items:center;justify-content:space-between;gap:10px;height:42px;padding:0 12px 0 14px;text-align:left;cursor:pointer;font:inherit;transition:border-color .16s,box-shadow .16s,background-color .16s}
.dd-btn.in:hover{border-color:color-mix(in srgb,var(--ink) 28%,var(--line-2))}
.dd-btn.in:focus-visible,.dd-btn.in.open{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dd-btn.in[disabled]{opacity:.5;cursor:not-allowed}
.toolbar .sel,.top .sel{flex:none}

/* popup */
.dd-pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow-lg);padding:6px;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:2px;animation:ddIn .18s cubic-bezier(.2,.9,.3,1) both}
.dd-pop.out{animation:ddOut .12s ease-in both;pointer-events:none}
.dd-opt{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;flex:none;border:0;background:none;color:var(--ink);font:500 13.5px/1.3 var(--f-body);padding:9px 11px;border-radius:10px;text-align:left;cursor:pointer;transition:background-color .1s}
.dd-opt .dd-opt-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-opt.act{background:var(--surface-2)}
.dd-opt.on{color:var(--accent);font-weight:650}
.dd-opt.on.act{background:var(--accent-soft)}
.dd-opt .dd-tick{flex:none;opacity:0;transform:scale(.6);transition:opacity .16s,transform .2s cubic-bezier(.2,.9,.3,1.4)}
.dd-opt.on .dd-tick{opacity:1;transform:none}
.dd-opt[disabled]{opacity:.4;cursor:not-allowed}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
.dd-pop.up{animation-name:ddInUp}
@keyframes ddInUp{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
@keyframes ddOut{to{opacity:0;transform:translateY(-4px) scale(.97)}}

/* ⋯ menus: sit directly under their icon */
.menu{border-color:var(--line-2);border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:2px;animation:ddIn .18s cubic-bezier(.2,.9,.3,1) both;transform-origin:top right}
.menu.up{animation-name:ddInUp;transform-origin:bottom right}
.menu button,.menu a{padding:9px 11px;border-radius:10px;transition:background-color .1s,color .1s}
.menu button:hover,.menu a:hover,.menu button:focus-visible,.menu a:focus-visible{background:var(--surface-2);outline:0}
.menu .danger:hover,.menu .danger:focus-visible{background:var(--bad-bg)}
.menu .ic{color:var(--ink-3);flex:none}
.menu .danger .ic{color:var(--bad)}

/* ===== micro-interactions ===== */
.btn,.icon-btn,.chip,.ph,.rail-btn,.pcard,.fcard,.task,.row-item,.seg-ctl button,.swatch,.tab,.tabs button{transition:background-color .16s,border-color .16s,color .16s,box-shadow .2s,transform .2s cubic-bezier(.2,.8,.2,1),filter .16s,opacity .16s}
.btn:active,.icon-btn:active{transform:scale(.96)}
.btn.primary:not([disabled]):hover{transform:translateY(-1px)}
.icon-btn.lg:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line-2))}
.fcard{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,background-color .24s,color .24s}
.fcard .fc-tags span,.fcard .fc-dots i,.fcard .fc-av,.fcard .fc-sub,.fcard .fc-k{transition:background-color .24s,border-color .24s,color .24s,box-shadow .24s}
.fcard:hover{transform:translateY(-4px)}
.ph:hover{transform:translateY(-1px)}
.rail-btn svg,.icon-btn svg{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.rail-btn:hover svg{transform:scale(1.1)}
.rail-btn.on svg{transform:none}
.theme-btn:hover svg{transform:rotate(18deg)}
.bell-btn:hover svg{transform-origin:50% 0;animation:bellRing .6s ease}
@keyframes bellRing{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}

/* theme switch: colours cross-fade, the new icon spins in */
html.theming,html.theming *,html.theming *::before,html.theming *::after{transition:background-color .35s ease,border-color .35s ease,color .35s ease,fill .35s ease,stroke .35s ease,box-shadow .35s ease!important}
:root[data-theme="light"] .theme-btn .moon,:root:not([data-theme="light"]) .theme-btn .sun{animation:iconSpin .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes iconSpin{from{opacity:0;transform:rotate(-80deg) scale(.5)}to{opacity:1;transform:none}}

/* ===== overlays ===== */
.overlay:not([hidden]){animation:fadeIn .2s ease both}
.overlay:not([hidden]) .dialog{animation:dlgIn .28s cubic-bezier(.2,.9,.3,1) both}
.overlay.drawer:not([hidden]) .dialog.drawer{animation:drawerIn .34s cubic-bezier(.2,.85,.25,1) both}
.toast:not([hidden]){animation:toastIn .32s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dlgIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes drawerIn{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}

/* ===== page enter: set by JS only when the view changes, never on a plain re-render ===== */
@property --p{syntax:"<number>";inherits:false;initial-value:0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes soft{from{opacity:0}to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0 round 99px)}to{clip-path:inset(0 0 0 0 round 99px)}}
@keyframes ringIn{from{--p:0}}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#view.enter .page-head,#view.enter .hero,#view.enter .proj-top,#view.enter .hub-head,#view.enter .toolbar,#view.enter .tabs{animation:soft .4s ease both}
#view.enter .kpi,#view.enter .pcard,#view.enter .fcard,#view.enter .card,#view.enter .gcard,#view.enter .col,#view.enter .stat,#view.enter .new-card,#view.enter .tower,#view.enter .inv-row,#view.enter .team-row,#view.enter .code-row,#view.enter .wk{animation:rise .5s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--i,0) * 32ms + 40ms)}
#view.enter .card .card,#view.enter .gcard .gcard{animation:none}
#view.enter .task{animation:rise .4s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--j,0) * 22ms + 200ms)}
#view.enter .flow-bar i,#view.enter .col-bar i,#view.enter .g-prog{transform-origin:left center;animation:growX .8s cubic-bezier(.2,.75,.25,1) both;animation-delay:.28s}
#view.enter .g-bar{animation:wipe .75s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--i,0) * 40ms + 150ms)}
#view.enter .ring{animation:ringIn .9s cubic-bezier(.2,.75,.25,1) both;animation-delay:.2s}
#view.enter .badge,#view.enter .chip.accent{animation:popIn .4s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:.3s}
#view.enter .skel{animation:none}

/* the sliding rail highlight is animated from JS (see renderSide) */
.rail-btn.on{position:relative;z-index:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ===== alignment ladder: header controls 44px, toolbar controls 40px, in-row controls 34px ===== */
.card.flow{display:flex;flex-direction:column}
.flow .flow-bar{height:16px}
.flow .legend{flex:1;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));grid-auto-rows:1fr;gap:10px}
.flow .legend>div{align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.flow .legend .sw{margin-top:5px;flex:none}
.flow .legend small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.toolbar .sel{height:40px}
.seg-ctl{height:40px;box-sizing:border-box;align-items:stretch}
.seg-ctl button{padding:0 14px}
.toolbar .btn.sm{height:40px;padding:0 16px}
.tab{display:inline-flex;align-items:center;height:40px;padding:0 18px;box-sizing:border-box}
.code-row .btn.sm{height:38px}
.custom-color input[type=color]{height:42px}
.custom-color .btn.sm{height:42px}
.map-row .btn{height:42px}
.card.flow{container-type:inline-size}
.flow .legend{grid-template-columns:repeat(6,minmax(0,1fr))}
.flow .legend>div:nth-child(-n+3){grid-column:span 2}
.flow .legend>div:nth-child(n+4){grid-column:span 3}
@container (min-width:760px){.flow .legend{grid-template-columns:repeat(5,minmax(0,1fr))}.flow .legend>div:nth-child(n){grid-column:auto}}
@container (max-width:470px){.flow .legend{grid-template-columns:repeat(2,minmax(0,1fr))}.flow .legend>div:nth-child(n){grid-column:auto}}

/* ===== Windows app: import wizard, sort dialog, in-app map, drop zones ===== */
.toast{z-index:90}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spinr .7s linear infinite;flex:none;vertical-align:-3px;margin-right:8px}
@keyframes spinr{to{transform:rotate(360deg)}}

/* drop zones */
.dropzone{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 16px;border:1.5px dashed var(--line-2);border-radius:18px;color:var(--ink-2);font-size:13.5px;text-align:center;transition:border-color .18s,background .18s,color .18s,transform .18s}
.dropzone b{color:var(--ink);font-weight:600}
.dropzone.drop-on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);transform:scale(1.01)}
.fcard.drop-on{outline:2px dashed var(--accent);outline-offset:-3px;transform:translateY(-2px)}
.row-main{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;color:inherit;font:inherit;cursor:pointer}
.row-main .t{display:block}
.row-main:hover .t{color:var(--accent)}
.row-main:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.fcard:is(:hover,:focus-visible,.drop-on) .faint{color:color-mix(in srgb,var(--on-accent) 78%,transparent)}
.imp-head span:nth-child(7){text-align:right}
.fc-tags .loose{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}

/* dialog width for the import wizard */
.dialog.imp{width:min(1060px,100%)}
.dialog.imp .path{font-size:12.5px}

/* stepper */
.imp-steps{list-style:none;display:flex;align-items:center;gap:6px;margin:0;padding:0;flex-wrap:wrap}
.imp-steps li{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-3);padding-right:6px}
.imp-steps li b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--f-body);background:var(--surface-2);color:var(--ink-2);transition:background .2s,color .2s}
.imp-steps li:not(:last-child)::after{content:"";width:26px;height:2px;border-radius:2px;background:var(--line-2);margin-left:6px}
.imp-steps li.cur{color:var(--ink)}
.imp-steps li.cur b{background:var(--accent-fill);color:var(--on-accent)}
.imp-steps li.done{color:var(--ink-2)}
.imp-steps li.done b{background:var(--accent-soft);color:var(--accent)}
.imp-steps li.done:not(:last-child)::after{background:var(--accent-mark)}

.imp-pick{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.imp-busy{display:flex;align-items:center;color:var(--ink-2);font-size:13.5px;padding:6px 0}
.imp-prog{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.imp-prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-fill),var(--accent));transition:width .25s ease}

/* choice cards */
.opt-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt-card{position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;padding:14px 16px;border-radius:18px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);transition:border-color .18s,background .18s,transform .18s,box-shadow .18s}
.opt-card b{font:600 14px var(--f-display)}
.opt-card span{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.opt-card:hover{transform:translateY(-1px);border-color:var(--ink-3)}
.opt-card.on{border-color:var(--accent);background:var(--accent-soft)}
.opt-card .opt-tick{position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent-fill);color:var(--on-accent);opacity:0;transform:scale(.5);transition:opacity .18s,transform .22s cubic-bezier(.2,.9,.3,1.4)}
.opt-card.on .opt-tick{opacity:1;transform:scale(1)}
.opt-card b{padding-right:28px}
.imp-opts{display:flex;flex-direction:column;gap:12px}
.imp-opt-h{font:600 14px var(--f-display)}
.imp-row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:end}
.imp-icons{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px;background:var(--warn-bg);color:var(--ink)}
.imp-icons>b{font-size:13px}
.imp-icon{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imp-icon .dd-btn{height:34px;min-width:130px}

/* review table */
.imp-head,.imp-row{display:grid;grid-template-columns:34px 44px minmax(150px,1.5fr) 140px 128px 150px 52px minmax(120px,1fr);gap:10px;align-items:center}
.imp-head{padding:0 10px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.imp-table{display:flex;flex-direction:column;gap:6px;max-height:min(46vh,460px);overflow:auto;padding:2px;margin:-2px;overscroll-behavior:contain}
.imp-row{padding:7px 10px;border-radius:16px;background:var(--surface-2);border:1px solid transparent;transition:opacity .18s,border-color .18s}
.imp-row:hover{border-color:var(--line-2)}
.imp-row.unsel{opacity:.55}
.imp-row.off{opacity:.6;background:none;border:1px dashed var(--line-2)}
.imp-row .in,.imp-row .dd-btn{height:36px;border-radius:10px;font-size:13px;padding-left:10px;padding-right:10px}
.imp-row .dd-btn{padding-right:8px}
.imp-row .imp-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.imp-ck{display:grid;place-items:center}
.imp-ck input{width:18px;height:18px;accent-color:var(--accent-fill);margin:0}
.imp-files{text-align:right;font-variant-numeric:tabular-nums}
.imp-nm{font-weight:600;min-width:0}
@media (max-width:1020px){.imp-head,.imp-row{min-width:880px}.imp-table,.imp-wrap{overflow-x:auto}.imp-head{min-width:880px}}

/* preview */
.imp-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.imp-sum>div{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:16px;background:var(--surface-2)}
.imp-sum b{font:600 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.imp-sum span{font-size:12.5px;color:var(--ink-2)}
.imp-sum.good>div:first-child{background:var(--good-bg)}
.imp-sum.good>div:first-child b{color:var(--good)}
.imp-ptable{display:flex;flex-direction:column;gap:8px;max-height:min(44vh,440px);overflow:auto;padding:2px;margin:-2px;overscroll-behavior:contain}
.imp-prow{border-radius:16px;background:var(--surface-2);border:1px solid transparent;transition:border-color .18s}
.imp-prow.open{border-color:var(--line-2)}
.imp-pmain{display:grid;grid-template-columns:auto minmax(120px,1fr) auto auto auto 34px;gap:12px;align-items:center;padding:9px 10px 9px 14px;min-height:54px}
.imp-pmain .icon-btn svg{transition:transform .2s}
.imp-prow.open .icon-btn svg{transform:rotate(180deg)}
.imp-cats{display:flex;gap:5px;flex-wrap:nowrap}
.imp-cat{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:99px;background:var(--surface);border:1px solid var(--line-2);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.imp-cat b{font-size:10.5px;color:var(--ink-3);font-weight:500}
.imp-cat.zero{opacity:.4}
.imp-stay{white-space:nowrap}
.imp-detail{display:flex;flex-direction:column;gap:5px;padding:4px 16px 14px;max-height:260px;overflow:auto}
.imp-detail>div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0;overflow-wrap:anywhere}
.imp-arrow{color:var(--accent);font-weight:700}
.imp-loose{display:flex;flex-direction:column;gap:3px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2)}
.imp-more{border:1px solid var(--line-2);border-radius:14px;padding:10px 14px}
.imp-more summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.imp-more[open] summary{margin-bottom:8px}
@media (max-width:860px){.opt-cards{grid-template-columns:1fr}.imp-row2{grid-template-columns:1fr}.imp-pmain{grid-template-columns:auto minmax(100px,1fr) auto 34px}.imp-cats,.imp-stay{display:none}}

/* sort dialog */
.arr-cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.arr-cat{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface-2);min-width:0}
.arr-cat b{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:500;flex:none}
.arr-cat span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500}
.arr-cat em{font:600 15px var(--f-display);font-style:normal;font-variant-numeric:tabular-nums}
.arr-cat.zero{opacity:.45}
@media (max-width:640px){.arr-cats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ===== in-app map ===== */
.mp-overlay{position:fixed;inset:0;z-index:75;background:rgba(10,10,16,.62);display:grid;place-items:center;padding:20px;animation:fadeIn .2s ease both;backdrop-filter:blur(3px)}
.mp-card{width:min(1040px,100%);height:min(740px,100%);display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--surface);color:var(--ink);border-radius:26px;box-shadow:var(--shadow-lg);overflow:hidden;animation:dlgIn .28s cubic-bezier(.2,.9,.3,1) both}
.mp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 22px 14px}
.mp-head h2{font:600 19px var(--f-display)}
.mp-head p{margin-top:2px}
.mp-body{position:relative;min-height:0;background:var(--surface-2)}
.mp-map{position:absolute;inset:0;z-index:0;background:var(--surface-2);font:inherit}
.mp-search{position:absolute;z-index:2;top:14px;left:14px;width:min(440px,calc(100% - 92px));display:flex;flex-direction:column;gap:6px}
.mp-sbox{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line-2);border-radius:99px;padding:5px 5px 5px 6px;box-shadow:var(--shadow)}
.mp-sbox .in{border:0;background:none;height:34px;padding:0 12px}
.mp-sbox .in:focus{outline:none;box-shadow:none}
.mp-sbox:focus-within{border-color:var(--accent)}
.mp-res{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--shadow-lg);padding:6px;max-height:260px;overflow:auto;animation:ddIn .18s cubic-bezier(.2,.9,.3,1) both}
.mp-res[hidden]{display:none}
.mp-r{display:flex;align-items:flex-start;gap:10px;width:100%;border:0;background:none;color:var(--ink);text-align:left;padding:9px 10px;border-radius:12px;font-size:13px;line-height:1.35}
button.mp-r:hover,button.mp-r:focus-visible{background:var(--surface-2)}
.mp-r svg{flex:none;margin-top:1px;color:var(--accent)}
.mp-r.muted{color:var(--ink-2)}
.mp-layers{position:absolute;z-index:2;left:14px;bottom:14px;box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--line-2)}
.mp-layers button{padding:7px 14px}
.mp-off{position:absolute;z-index:3;left:50%;bottom:18px;transform:translateX(-50%);pointer-events:none;display:flex;gap:10px;align-items:flex-start;max-width:min(420px,calc(100% - 40px));padding:14px 16px;border-radius:16px;background:var(--bad-bg);color:var(--ink);font-size:13px;box-shadow:var(--shadow)}
.mp-off[hidden]{display:none}
.mp-off svg{flex:none;color:var(--bad);margin-top:1px}
.mp-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 22px 18px}
.mp-coords{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 260px}
.mp-coords b{font-size:14px;font-weight:500}
.mp-coords .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mp-pin{background:none!important;border:0!important}
.mp-pin svg{display:block;filter:drop-shadow(0 6px 5px rgba(0,0,0,.4));transform-origin:50% 100%;animation:pinDrop .5s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes pinDrop{0%{transform:translateY(-26px) scale(.8);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
/* leaflet controls follow the theme */
.mp-map .leaflet-control-zoom{border:1px solid var(--line-2)!important;border-radius:14px!important;overflow:hidden;box-shadow:var(--shadow)!important}
.mp-map .leaflet-control-zoom a{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line-2);width:36px;height:36px;line-height:36px;font-size:18px}
.mp-map .leaflet-control-zoom a:last-child{border-bottom:0}
.mp-map .leaflet-control-zoom a:hover{background:var(--surface-2);color:var(--accent)}
.mp-map .leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 82%,transparent);color:var(--ink-2);border-radius:10px 0 0 0;font-size:10.5px}
.mp-map .leaflet-control-attribution a{color:var(--accent)}
.mp-map.leaflet-container{cursor:crosshair}
:root[data-theme="dark"] .mp-map .leaflet-tile-pane{filter:brightness(.86) contrast(1.04)}
@media (max-width:700px){.mp-overlay{padding:0}.mp-card{border-radius:0;height:100%}.mp-foot .mp-acts{width:100%}}
@media (prefers-reduced-motion:reduce){.mp-pin svg,.mp-card,.mp-overlay,.spin{animation-duration:.01ms!important;animation-iteration-count:1!important}}
.field>.seg-ctl{align-self:flex-start;max-width:100%}

/* dialog action row stays reachable when a dialog is taller than the window */
.dialog .dlg-foot{position:sticky;bottom:-22px;margin-bottom:-22px;padding:0 0 22px;background:var(--surface);box-shadow:0 -14px 14px -2px var(--surface);z-index:3}
.imp-sugg{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}
.imp-sugg ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.imp-sugg .path{display:inline-block;max-width:100%;vertical-align:bottom;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-sugg>.btn{flex:none}

/* dashboard lists: room between the two panels, the heading and the rows */
.two{gap:24px}
.two>.card{padding:24px 24px 26px}
.two>.card>.sec-head{margin-bottom:18px}
.two>.card>.sec-head+.list{margin-top:0}
.list.pills{gap:10px}

/* ===== timeline: all projects on one Gantt ===== */
.gcard.tl{padding:0 0 16px}
.gcard.tl::before{left:auto;right:4%;top:-160px;bottom:auto;width:36%;height:300px;opacity:var(--g-glow-b)}
.gcard.tl::after{display:none}
.tl-scroll{position:relative;overflow:auto;max-height:max(340px,calc(100vh - 360px));margin:0 0 4px;overscroll-behavior:contain}
.tl-grid{position:relative;width:calc(var(--lw) + var(--w));min-width:100%}
.tl-head{position:sticky;top:0;z-index:6;display:flex;height:54px;background:var(--g-bg);border-bottom:1px solid var(--g-line)}
.tl-corner{position:sticky;left:0;z-index:8;flex:none;width:var(--lw);display:flex;align-items:flex-end;padding:0 0 11px 26px;background:var(--g-bg);font:600 11px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--g-ink-2)}
.tl-axis{position:relative;flex:none;width:var(--w)}
.tl-tick{position:absolute;bottom:9px;transform:translateX(4px);font:500 12px var(--f-body);color:var(--g-ink-2);white-space:nowrap}
.tl-nowpill{position:absolute;top:6px;transform:translateX(-50%);z-index:3}
.tl-nowpill b{display:block;background:var(--accent-fill);color:var(--on-accent);border-radius:99px;padding:3px 12px;font:600 12px/1.2 var(--f-body);box-shadow:0 6px 18px -4px var(--accent-fill)}
.tl-rows{position:relative}
.tl-row{position:relative;display:flex;height:50px;align-items:stretch;cursor:pointer;border-bottom:1px solid color-mix(in srgb,var(--g-line) 60%,transparent);outline-offset:-2px}
.tl-label{position:sticky;left:0;z-index:5;flex:none;width:var(--lw);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:1fr 1fr;align-items:center;column-gap:10px;padding:0 14px 0 26px;background:var(--g-bg);border-right:1px solid var(--g-line);transition:background-color .16s}
.tl-label b{grid-column:1/-1;align-self:end;font:600 13.5px/1.2 var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g-ink)}
.tl-label .mono{align-self:start;font-size:11.5px;color:var(--g-ink-2);margin-top:2px}
.tl-st{align-self:start;justify-self:end;margin-top:2px;font:500 11.5px var(--f-body);color:var(--g-ink-2);white-space:nowrap}
.tl-track{position:relative;flex:none;width:var(--w);transition:background-color .16s}
.tl-row:hover .tl-track{background:color-mix(in srgb,var(--g-ink) 5%,transparent)}
.tl-row:hover .tl-label,.tl-row:focus-visible .tl-label{background:color-mix(in srgb,var(--g-ink) 6%,var(--g-bg))}
.tl-row:focus-visible{outline:2px solid var(--accent-fill)}
.tl-row:hover .tl-label b{color:var(--accent)}
.tl-seg{position:absolute;top:13px;height:24px;border-radius:99px;display:flex;align-items:center;gap:7px;padding:0 4px;overflow:hidden;font-style:normal;white-space:nowrap;transition:filter .16s,transform .16s}
.tl-seg b{flex:none;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 4px;font:600 10.5px var(--f-mono)}
.tl-seg span{font:600 11.5px var(--f-body);overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.tl-seg em{position:absolute;left:0;top:0;bottom:0;background:var(--g-prog);pointer-events:none}
.tl-seg>*{position:relative}.tl-seg>em{position:absolute}
.tl-seg.done{background:var(--g-done-bg);color:var(--g-done-ink)}
.tl-seg.done b{background:var(--g-done-ink);color:var(--g-done-bg)}
.tl-seg.cur{background:linear-gradient(90deg,color-mix(in srgb,var(--accent-fill) 70%,#000),var(--accent-fill) 55%,color-mix(in srgb,var(--accent-fill) 64%,#fff));color:var(--on-accent);box-shadow:0 8px 22px -8px var(--accent-fill)}
.tl-seg.cur b{background:color-mix(in srgb,var(--on-accent) 24%,transparent);color:var(--on-accent)}
.tl-seg.next{background:var(--g-next-bg);border:1px solid var(--g-next-line);color:var(--g-ink)}
.tl-seg.next b{background:var(--g-next-line);color:var(--g-ink)}
.tl-row:hover .tl-seg{filter:brightness(1.06)}
.tl-over{position:absolute;left:var(--lw);top:0;bottom:0;width:var(--w);pointer-events:none;z-index:2}
.tl-g{position:absolute;top:0;bottom:0;border-left:1px dashed var(--g-line)}
.tl-now{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent-fill);box-shadow:0 0 12px var(--accent-fill)}
@media (max-width:760px){.tl-label{padding-left:16px}.tl-corner{padding-left:16px}}

/* ===== file manager in the folder drawer ===== */
.dialog.drawer{width:min(540px,100%)}
.fm{display:flex;flex-direction:column;gap:10px;min-width:0}
.fm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;min-width:0}
.crumb{height:30px;padding:0 11px;border-radius:99px;border:1px solid transparent;background:none;color:var(--ink-2);font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color .16s,color .16s}
.crumb:hover{background:var(--surface-2);color:var(--ink)}
.crumb.here{color:var(--ink);font-weight:600;cursor:default}
.crumb.here:hover{background:none}
.crumb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fm-crumbs .sep{color:var(--faint,var(--ink-3));font-size:15px;padding:0 1px}
.fm-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fm-chip{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font:inherit;font-size:12.5px;cursor:pointer;min-width:0;text-align:left;transition:background-color .16s,border-color .16s,color .16s,transform .18s}
.fm-chip b{font-size:11px;font-weight:600;color:var(--ink);flex:none}
.fm-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fm-chip:hover{border-color:var(--accent);color:var(--ink)}
.fm-chip.here{background:var(--accent-soft);border-color:transparent;color:var(--ink);cursor:default}
.fm-chip.here b{color:var(--accent)}
.fm-chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fm-dragging .fm-chip:not(.here){border-style:dashed;border-color:var(--accent)}
.fm-chip.fm-drop-on,.crumb.fm-drop-on{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent);transform:translateY(-1px)}
.fm-chip.fm-drop-on b,.crumb.fm-drop-on{color:var(--on-accent)}
.fm-bar{display:flex;align-items:center;gap:8px;min-height:44px;padding:3px 8px;border-radius:14px;flex-wrap:wrap}
.fm-bar:empty{display:none}
.fm-bar:has(.fm-count b){background:var(--accent-soft)}
.fm-bar .grow{flex:1}
.fm-count{font-size:13px;color:var(--ink-2);white-space:nowrap}
.fm-count b{color:var(--ink)}
.fm-chk{position:relative;display:inline-grid;place-items:center;width:22px;height:22px;flex:none;cursor:pointer}
.fm-chk.ph{visibility:hidden}
.fm-chk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.fm-chk .box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;background:var(--surface);transition:background-color .15s,border-color .15s,color .15s}
.fm-chk:hover .box{border-color:var(--accent)}
.fm-chk input:checked + .box{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.fm-chk input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.fm-list{display:flex;flex-direction:column;gap:2px;margin-top:0}
.fm-row{padding:8px 10px;border-radius:12px;border-bottom:0;cursor:grab;transition:background-color .15s,opacity .15s,box-shadow .15s}
.fm-row:hover{background:var(--surface-2)}
.fm-row.picked{background:var(--accent-soft)}
.fm-row.dragging{opacity:.4}
.fm-row.fm-drop-on,.fm-row.drop-on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.fm-row .ext.dir{background:var(--accent-soft);color:var(--accent)}
.fm-row .row-main{cursor:pointer}
.fm-ren{flex:1;min-width:0;height:38px;border-radius:11px;border:1.5px solid var(--accent);background:var(--surface);color:var(--ink);padding:0 11px;font:inherit;font-size:14px;outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fm-confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 9%,var(--surface));font-size:13.5px}
.fm-confirm:empty,[data-fm-confirm]:empty{display:none}
.fm-confirm .grow{flex:1}
.fm-ghost{position:fixed;top:-200px;left:-200px;padding:8px 14px;border-radius:99px;background:var(--accent-fill);color:var(--on-accent);font:600 13px system-ui,sans-serif;white-space:nowrap}
.check-row{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-top:12px;cursor:pointer;font-size:13.5px;line-height:1.45}
.check-row input{margin-top:3px;accent-color:var(--accent-fill);width:16px;height:16px;flex:none}
.check-row:hover{border-color:var(--accent)}

/* ===== cover images ===== */
.fcard .notch,.fcard::before,.fcard::after{z-index:1}
.fcard>.fc-cover{position:absolute;left:0;right:0;top:0;height:50%;z-index:0;border-radius:28px 28px 0 0;background-size:cover;background-position:center;opacity:.6;
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 28%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0,#000 28%,transparent 100%);transition:opacity .24s;pointer-events:none}
.fcard.has-cover:is(:hover,:focus-visible,.drop-on)>.fc-cover{opacity:.55}
.fcard.has-cover .fc-name,.fcard.has-cover .fc-sub,.fcard.has-cover .fc-top .muted{text-shadow:0 0 12px var(--fcard),0 0 4px var(--fcard)}
.fcard.has-cover:is(:hover,:focus-visible,.drop-on) .fc-name,.fcard.has-cover:is(:hover,:focus-visible,.drop-on) .fc-sub,.fcard.has-cover:is(:hover,:focus-visible,.drop-on) .fc-top .muted{text-shadow:0 0 12px var(--accent-fill),0 0 4px var(--accent-fill)}
.pc-cover{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.pcard-top.has-cover::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(to bottom,rgba(8,8,14,.58),rgba(8,8,14,.1) 72%,rgba(8,8,14,.3))}
.pcard-top.has-cover .plan{display:none}
.pcard-top.has-cover>*:not(.pc-cover){position:relative;z-index:1}
.pcard-top.has-cover .code{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.drawer-cover{display:block;width:100%;height:120px;border-radius:18px;background-size:cover;background-position:center;border:1px solid var(--line);flex:none}

/* ===== app name and icon ===== */
.rail-logo img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.rail-logo.has-img{background:var(--surface)}
.brand-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.brand-prev{width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:linear-gradient(150deg,var(--accent-fill),color-mix(in srgb,var(--accent-fill) 55%,#000));color:var(--on-accent);font:700 28px var(--f-display)}
.brand-prev.has-img{background:var(--surface-2);border:1px solid var(--line)}
.brand-prev img{width:100%;height:100%;object-fit:cover;display:block}
.brand-fields{flex:1 1 280px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* low-contrast accents: fine edge on bars and dots */
.scale i.done,.scale i.cur,.step.done i,.step.cur i,.col-bar i,.fc-dots i.on,.wk i.b-task,.seg-held{box-shadow:inset 0 0 0 1px var(--accent-edge,transparent)}

/* ===== batch 3: week ahead, import picker, naming ===== */
.wk-col{border:0;background:none;color:inherit;font:inherit;cursor:default;transition:background .16s,transform .16s;-webkit-tap-highlight-color:transparent}
.wk-col.has{cursor:pointer}
.wk-col.has:hover,.wk-col:focus-visible{background:var(--surface-2)}
.wk-col.has:hover .wk-bars i{transform:scaleX(1.12)}
.wk-bars i{transition:transform .16s}
.wk-col:not(.has){cursor:pointer}
.wk-col:not(.has):hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.count-btn{border:0;cursor:pointer;color:var(--ink);transition:background .16s,color .16s}
.count-btn:hover{background:var(--accent-soft);color:var(--accent)}
.wk-key .wk-tip{margin-left:auto;color:var(--ink-3)}
.wkdlg{max-width:720px}
.wkds{display:flex;gap:6px;flex-wrap:nowrap}
.wkd{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1 1 52px;min-width:0;padding:8px 6px 7px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font:inherit;cursor:pointer;transition:background .16s,border-color .16s,color .16s}
.wkd span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}
.wkd b{font:600 17px/1.1 var(--f-display);color:var(--ink)}
.wkd i{font:500 11px var(--f-mono);font-style:normal;padding:1px 7px;border-radius:99px;background:var(--surface);color:var(--ink-2)}
.wkd i.z{opacity:.45}
.wkd:hover{border-color:var(--line-2)}
.wkd.on{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.wkd.on b{color:var(--on-accent)}.wkd.on i{background:color-mix(in srgb,var(--on-accent) 22%,transparent);color:var(--on-accent)}
.wkd.wk-all{flex:0 0 auto;margin-left:0;justify-content:center;padding:8px 12px 7px}
.wk-sec{display:flex;flex-direction:column;gap:2px}
.wk-sec-h{display:flex;align-items:center;gap:10px;margin-top:6px}
.wk-sec-h h3{font:600 14px var(--f-display);margin:0}
.wk-sec.late .wk-sec-h h3{color:var(--bad)}
.wk-item{padding:10px 0}
.wk-item .small{white-space:normal;line-height:1.4}
.wk-empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:28px 12px;border-radius:18px;background:var(--surface-2)}
.wk-empty svg{color:var(--accent)}

.imp-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imp-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;background:var(--surface-2);border:1px solid transparent;flex:1 1 200px;max-width:320px;color:var(--ink-3);transition:border-color .16s}
.imp-search:focus-within{border-color:var(--accent-mark)}
.imp-search input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--ink);font:inherit;font-size:13.5px}
.imp-search input::-webkit-search-cancel-button{display:none}
.imp-list{display:flex;flex-direction:column;gap:6px;max-height:min(50vh,480px);overflow:auto;padding:2px;margin:-2px;overscroll-behavior:contain}
.imp-pk{display:grid;grid-template-columns:20px 22px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--surface-2);border:1px solid transparent;cursor:pointer;transition:border-color .18s,background .18s}
.imp-pk[hidden],.imp-none[hidden]{display:none}
.imp-pk:hover{border-color:var(--line-2)}
.imp-pk.picked{border-color:var(--accent-mark);background:var(--accent-soft)}
.imp-pk.off{opacity:.55;cursor:default}
.imp-pk input{width:18px;height:18px;accent-color:var(--accent-fill);margin:0}
.imp-pk-ic{color:var(--ink-3);display:grid;place-items:center}
.imp-pk.picked .imp-pk-ic{color:var(--accent)}
.imp-pk-nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.imp-pk-meta{font-size:12px;color:var(--ink-3);white-space:nowrap}
.imp-pk-tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface);color:var(--ink-3);white-space:nowrap}
.imp-pk-tag.proj{background:var(--accent-badge);color:var(--accent)}
.imp-none{padding:14px;text-align:center}
.imp-card{display:flex;flex-direction:column;gap:6px;padding:9px 10px;border-radius:16px;background:var(--surface-2);border:1px solid transparent;transition:border-color .18s}
.imp-card:hover{border-color:var(--line-2)}
.imp-head,.imp-l1{display:grid;grid-template-columns:56px minmax(150px,1.6fr) 140px 128px 150px minmax(130px,1fr);gap:10px;align-items:center}
.imp-l2{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,.62fr);gap:10px;align-items:center}
.imp-l1 .in,.imp-l1 .dd-btn,.imp-l2 .in{height:36px;border-radius:10px;font-size:13px;padding-left:10px;padding-right:10px}
.imp-l1 .dd-btn{padding-right:8px}
.imp-l2 .in:disabled{opacity:.6}
.imp-was{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl-mini{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.imp-sw{display:flex;flex-direction:column;gap:10px;align-self:end;padding-bottom:4px}
@media (max-width:1020px){.imp-l1,.imp-l2{min-width:880px}}
@media (max-width:860px){.imp-pk{grid-template-columns:20px 22px minmax(0,1fr) auto}.imp-pk-meta{display:none}}
.wk-col{width:100%;min-width:0}
/* folder cards: an empty top row keeps the layout, the cover shows clean */
.fc-top:empty{min-height:46px}
/* project folder row: field and buttons share one height and baseline */
.path-row{align-items:flex-end}
.path-row .path{display:flex;align-items:center;min-height:40px;padding-top:0;padding-bottom:0;line-height:1.35}
.path-row .toolbar .btn.sm{height:40px}

/* ===== desktop window bar: mac-style controls on the page itself, no system title bar ===== */
.wbar{display:none}
html.has-wbar .wbar{position:relative;z-index:2000;flex:none;height:36px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px;-webkit-app-region:drag;user-select:none;-webkit-user-select:none}
html.has-wbar .page{display:flex;flex-direction:column;padding-top:0}
html.has-wbar .shell{flex:1 1 auto;height:auto;min-height:0}
.wlights{display:flex;align-items:center;gap:8px;-webkit-app-region:no-drag;padding:6px 8px 6px 0}
.wl{--wl:#8b8b96;width:13px;height:13px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:var(--wl);color:transparent;cursor:default;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.28);transition:background-color .16s,transform .12s,filter .12s}
.wl svg{pointer-events:none;opacity:0;transition:opacity .12s}
.wlights:hover .wl svg,.wl:focus-visible svg{opacity:1}
.wl-close{--wl-on:#FF5F57;color:#4d0000}.wl-min{--wl-on:#FEBC2E;color:#5a3a00}.wl-max{--wl-on:#28C840;color:#0b4d14}
.wl{background:var(--wl-on)}
html.win-blur .wlights:not(:hover) .wl{background:var(--wl-off)}
.wl:hover{filter:brightness(1.06)}
.wl:active{filter:brightness(.82)}
.wl-max .g-small{display:none}
html.win-max .wl-max .g-small{display:block}html.win-max .wl-max .g-big{display:none}
html.win-full .wlights{opacity:.0}
:root{--wl-off:#3b3b46}
:root[data-theme="light"]{--wl-off:#cfcfd8}
.wtitle{font:600 12.5px var(--f-body);color:var(--ink-3);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;text-align:center;transition:opacity .2s}
html.win-blur .wtitle{opacity:.55}
.tidy-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:var(--surface-2)}
.tidy-row .grow{flex:1 1 260px;min-width:0}
@media (max-width:560px){.wkds{flex-wrap:wrap}.wkd{flex:1 1 calc(25% - 6px)}.wkd.wk-all{flex:1 1 calc(25% - 6px)}}

@media (max-width:1560px){
  .phases .lbl{display:none}
}
@media (max-width:1100px){
  .split{grid-template-columns:minmax(0,1fr)}
  .proj-top{grid-template-columns:minmax(0,1fr)}
  .top,.content{padding-left:18px;padding-right:18px}
  #phasebar{padding-left:18px;padding-right:18px}
  .set-grid{columns:1}
}
@media (max-height:760px){
  .rail-pill{padding:6px;gap:4px}.rail-btn{width:42px;height:42px}.rail-logo{width:48px;height:48px;font-size:19px}.side{gap:8px}
  .content{padding-top:18px}
}
@media (max-width:760px){
  .page{padding:0}
  .shell{display:block}
  .window{height:100%;border-radius:0;border:0;box-shadow:none}
  .side{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0;background:color-mix(in srgb,var(--win) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);flex-direction:row;gap:0}
  .rail-logo{display:none}
  .rail-pill{display:contents}

/* ---------- dates (YYYY-MM-DD strings, UTC arithmetic so time zones never shift a day) ---------- */
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function parseYmd(s) { var p = String(s).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function fmtYmd(ms) { var d = new Date(ms); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
function addDays(s, n) { return fmtYmd(parseYmd(s) + n * 86400000); }
function diffDays(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
function todayYmd() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

function uid(prefix) {
  return (prefix || 'x') + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
}

function sum(arr) { var t = 0; for (var i = 0; i < arr.length; i++) t += arr[i]; return t; }

/* ---------- building a project ---------- */
function planStages(startYmd) {
  var cursor = startYmd;
  return STAGES.map(function (s) {
    var start = cursor;
    var end = addDays(start, s.weeks * 7 - 1);
    cursor = addDays(end, 1);
    return { n: s.n, start: start, end: end };
  });
}

function pickMember(team, ids, roleKey) {
  var pool = team.filter(function (m) { return ids.indexOf(m.id) !== -1; });
  if (!pool.length) return null;
  var want = ROLE_KEY[roleKey];
  for (var i = 0; i < pool.length; i++) if (pool[i].role === want) return pool[i].id;
  return pool[0].id;
}

function makeTasks(stages, team, ids) {
  var out = [];
  STAGES.forEach(function (st) {
    var list = TASK_TEMPLATES[st.n];
    var span = diffDays(stages[st.n - 1].start, stages[st.n - 1].end);
    list.forEach(function (t, i) {
      out.push({
        id: uid('t'),
        stage: st.n,
        title: t[0],
        deliverable: t[1] || '',
        assignee: pickMember(team, ids, t[2]),
        due: addDays(stages[st.n - 1].start, Math.floor(span * (i + 1) / list.length)),
        status: 'todo'
      });
    });
  });
  return out;
}

function makeFolders(team, ids, startYmd) {
  var out = {};
  FOLDER_TEMPLATES.forEach(function (f) {
    var assignees = [];
    f.roles.forEach(function (r) {
      var id = pickMember(team, ids, r);
      if (id && assignees.indexOf(id) === -1) assignees.push(id);
    });
    out[f.id] = { assignees: assignees, sync: '', created: startYmd, files: [] };
  });
  return out;
}

/* ---------- project codes: prefix, year style, separator, digit count ---------- */
var CODE_SEPS = { ' I ': 'Bar  I  (default)', '-': 'Hyphen  -', '_': 'Underscore  _', '.': 'Dot  .', '': 'None' };
function codeFmt(fmt) {
  var d = DEFAULT_SETTINGS.codeFormat, f = fmt || {};
  var prefix = String(f.prefix == null ? d.prefix : f.prefix).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  var year = f.year === 'YYYY' || f.year === 'none' || f.year === 'YY' ? f.year : d.year;
  var sep = f.sep === '' || Object.prototype.hasOwnProperty.call(CODE_SEPS, f.sep) ? f.sep : d.sep;
  var digits = Math.max(2, Math.min(5, Math.round(+f.digits) || d.digits));
  return { prefix: prefix, year: year, sep: sep, digits: digits };
}
function codeHead(fmt, year) {
  var f = codeFmt(fmt), parts = [];
  if (f.prefix) parts.push(f.prefix);
  if (f.year === 'YY') parts.push(String(year).slice(-2));
  else if (f.year === 'YYYY') parts.push(String(year));
  return parts.length ? parts.join(f.sep) + f.sep : '';
}
function formatCode(fmt, year, n) {
  var f = codeFmt(fmt), num = String(n);
  while (num.length < f.digits) num = '0' + num;
  return codeHead(f, year) + num;
}
function nextProjectCode(codes, year, fmt) {
  var head = codeHead(fmt, year), max = 0;
  codes.forEach(function (c) {
    if (String(c).indexOf(head) !== 0) return;
    var rest = String(c).slice(head.length);
    if (/^\d+$/.test(rest)) max = Math.max(max, +rest);
  });
  return formatCode(fmt, year, max + 1);
}
/* '' when fine, otherwise a sentence explaining what is wrong */
function codeProblem(code) {
  if (!code) return 'Enter a project code.';
  if (code.length > 24) return 'Keep the code to 24 characters or fewer.';
  if (!/^[A-Za-z0-9][A-Za-z0-9._ -]*$/.test(code) || /\s{2,}/.test(code) || /\s$/.test(code)) return 'Use letters, numbers, spaces, hyphen, underscore or dot only. Codes become folder names and invoice numbers.';
  return '';
}
/* a code such as MRF-26-014 or MRF_26_014 rewritten with the chosen separator; anything else is left alone */
function convertCode(code, sep) {
  var m = /^([A-Za-z][A-Za-z0-9]*)(?: I |[-_.])(\d{2}|\d{4})(?: I |[-_.])(\d{1,5})$/.exec(String(code || ''));
  return m ? m[1] + sep + m[2] + sep + m[3] : code;
}

function makeProject(f, team) {
  var start = f.startDate || todayYmd();
  var stages = planStages(start);
  var ids = f.team || [];
  var pcts = f.pcts && f.pcts.length === MILESTONE_TEMPLATE.length ? f.pcts : MILESTONE_TEMPLATE.map(function (m) { return m.pct; });
  return {
    id: uid('p'),
    code: f.code,
    name: f.name,
    client: { name: f.clientName || '', contact: f.clientContact || '' },
    location: f.location || '',
    type: f.type || PROJECT_TYPES[0],
    gfa: +f.gfa || 0,
    budget: +f.budget || 0,
    retainPct: f.retainPct == null ? 5 : +f.retainPct,
    startDate: start,
    currentStage: 1,
    status: 'active',
    example: !!f.example,
    map: f.map || null,
    foldersCreated: '',
    team: ids.slice(),
    createdAt: todayYmd(),
    stages: stages,
    tasks: makeTasks(stages, team, ids),
    milestones: MILESTONE_TEMPLATE.map(function (m, i) {
      return { id: 'm' + (i + 1), stage: m.stage, label: m.label, pct: +pcts[i], invoice: null, receipts: [] };
    }),
    folders: makeFolders(team, ids, start),
    releases: []
  };
}

/* an imported project is already under way: stages before fromStage keep their dates (clipped to end before today) and the rest are laid out from today, so no task starts life overdue */
function rebasePlan(p, fromStage, today) {
  var cursor = today;
  p.stages = p.stages.map(function (s) {
    if (s.n < fromStage) {
      var e = s.end >= today ? addDays(today, -1) : s.end;
      return { n: s.n, start: s.start > e ? e : s.start, end: e };
    }
    var st = STAGES[s.n - 1], start = cursor, end = addDays(start, st.weeks * 7 - 1);
    cursor = addDays(end, 1);
    return { n: s.n, start: start, end: end };
  });
  STAGES.forEach(function (st) {
    if (st.n < fromStage) return;
    var list = p.tasks.filter(function (t) { return t.stage === st.n; });
    var sg = p.stages[st.n - 1], span = diffDays(sg.start, sg.end);
    list.forEach(function (t, i) { if (t.status !== 'done') t.due = addDays(sg.start, Math.floor(span * (i + 1) / list.length)); });
  });
  return p;
}

/* ---------- progress ---------- */
function projectProgress(p) {
  var total = p.tasks.length;
  var done = p.tasks.filter(function (t) { return t.status === 'done'; }).length;
  return { done: done, total: total, pct: total ? Math.round(done * 100 / total) : 0 };
}

function stageProgress(p, n) {
  var list = p.tasks.filter(function (t) { return t.stage === n; });
  var done = list.filter(function (t) { return t.status === 'done'; }).length;
  return { done: done, total: list.length, pct: list.length ? Math.round(done * 100 / list.length) : 0 };
}

/* ---------- money ---------- */
function milestoneAmount(p, idx) {
  var last = p.milestones.length - 1;
  if (idx !== last) return Math.round(p.budget * p.milestones[idx].pct / 100);
  var others = 0;
  for (var i = 0; i < last; i++) others += Math.round(p.budget * p.milestones[i].pct / 100);
  return Math.max(0, p.budget - others);
}

/* status: paid | overdue | pending | ready | scheduled */
function invoiceInfo(p, idx, today) {
  var m = p.milestones[idx];
  var amount = milestoneAmount(p, idx);
  var applied = sum(m.receipts.map(function (r) { return r.amount; }));
  var retained = sum(m.receipts.map(function (r) { return r.retained || 0; }));
  var balance = Math.max(0, amount - applied);
  var status;
  if (amount > 0 && applied >= amount) status = 'paid';
  else if (m.invoice) status = m.invoice.due < today ? 'overdue' : 'pending';
  else status = m.stage <= p.currentStage ? 'ready' : 'scheduled';
  return { amount: amount, applied: applied, retained: retained, balance: balance, status: status };
}

/* contract = received + retainage held + pending, always */
function projectFinance(p, today) {
  var gross = 0, retained = 0, overdue = 0, billedPending = 0;
  p.milestones.forEach(function (m, i) {
    var info = invoiceInfo(p, i, today);
    gross += info.applied;
    retained += info.retained;
    if (info.status === 'overdue') overdue += info.balance;
    else if (info.status === 'pending') billedPending += info.balance;
  });
  var releases = sum((p.releases || []).map(function (r) { return r.amount; }));
  var pending = Math.max(0, p.budget - gross);
  var unbilled = Math.max(0, pending - overdue - billedPending);
  return {
    contract: p.budget,
    received: gross - retained + releases,
    held: retained - releases,
    pending: pending,
    overdue: overdue,
    billedPending: billedPending,
    unbilled: unbilled
  };
}

function totalsFinance(projects, today) {
  var t = { contract: 0, received: 0, held: 0, pending: 0, overdue: 0, billedPending: 0, unbilled: 0 };
  projects.forEach(function (p) {
    var f = projectFinance(p, today);
    for (var k in t) t[k] += f[k];
  });
  return t;
}

function retainOn(p, amount) { return Math.round(amount * (p.retainPct || 0) / 100); }

/* ---------- folders and paths ---------- */
function folderStats(f) {
  var files = f.files || [];
  var latest = f.created || '';
  files.forEach(function (x) { if (x.added > latest) latest = x.added; });
  return { count: f.count != null ? f.count : files.length, modified: latest };
}

/* win: C:\\x or \\\\server\\share   posix: /x or ~/x   rel: anything else */

/* ---------- reminders ---------- */
/* Returns items sorted by urgency: {key, kind, group, date, time, pid, mid, tid, rid}.
   kinds: inv-over, inv-due, inv-ready, task-late, task-due, custom. groups: overdue, today, soon, later. */
function collectReminders(projects, settings, today) {
  var cfg = settings.remind || {}, invDays = cfg.invoiceDays == null ? 3 : +cfg.invoiceDays, taskDays = cfg.taskDays == null ? 2 : +cfg.taskDays;
  var items = [];
  var groupOf = function (date) { var d = diffDays(today, date); return d < 0 ? 'overdue' : d === 0 ? 'today' : d <= 7 ? 'soon' : 'later'; };
  Object.keys(projects).forEach(function (id) {
    var p = projects[id];
    if (p.status === 'closed') return;
    if (cfg.invoices !== false) p.milestones.forEach(function (m, i) {
      var info = invoiceInfo(p, i, today);
      if (info.status === 'overdue') items.push({ key: 'iv:' + p.id + ':' + m.id + ':od', kind: 'inv-over', group: 'overdue', date: m.invoice.due, pid: p.id, mid: m.id });
      else if (info.status === 'pending' && diffDays(today, m.invoice.due) <= invDays) items.push({ key: 'iv:' + p.id + ':' + m.id + ':due', kind: 'inv-due', group: groupOf(m.invoice.due), date: m.invoice.due, pid: p.id, mid: m.id });
      else if (info.status === 'ready' && info.amount > 0) items.push({ key: 'iv:' + p.id + ':' + m.id + ':rd', kind: 'inv-ready', group: 'today', date: today, pid: p.id, mid: m.id });
    });
    if (cfg.tasks !== false) p.tasks.forEach(function (t) {
      if (t.status === 'done') return;
      var d = diffDays(today, t.due);
      if (d < 0) items.push({ key: 'tk:' + p.id + ':' + t.id + ':late', kind: 'task-late', group: 'overdue', date: t.due, pid: p.id, tid: t.id });
      else if (d <= taskDays) items.push({ key: 'tk:' + p.id + ':' + t.id + ':due', kind: 'task-due', group: groupOf(t.due), date: t.due, pid: p.id, tid: t.id });
    });
  });
  (settings.reminders || []).forEach(function (r) {
    if (r.done) return;
    var d = diffDays(today, r.date);
    if (d > 60) return;
    items.push({ key: 'rm:' + r.id + ':' + r.date, kind: 'custom', group: groupOf(r.date), date: r.date, time: r.time || '', pid: r.pid || '', rid: r.id });
  });
  var gOrder = { overdue: 0, today: 1, soon: 2, later: 3 }, kOrder = { 'inv-over': 0, custom: 1, 'inv-due': 2, 'inv-ready': 3, 'task-late': 4, 'task-due': 5 };
  items.sort(function (a, b) {
    return gOrder[a.group] - gOrder[b.group] || String(a.date).localeCompare(String(b.date)) || String(a.time || '').localeCompare(String(b.time || '')) || kOrder[a.kind] - kOrder[b.kind];
  });
  return items;
}

/* "40 I CRZ Housing Interior I 04.06.2026" -> { no:'40', name:'CRZ Housing Interior', date:'2026-06-04' }.
   Windows does not allow "|" in a folder name, so people type a capital I (or l) between the parts; "|" is accepted too. */
function parseDateDMY(s) {
  var m = /^(\d{1,2})[.\-\/ ](\d{1,2})[.\-\/ ](\d{2}|\d{4})$/.exec(String(s || '').trim());
  if (!m) return '';
  var d = +m[1], mo = +m[2], y = +m[3];
  if (y < 100) y += 2000;
  if (mo < 1 || mo > 12 || d < 1 || d > 31 || y < 1990 || y > 2100) return '';
  var dim = new Date(y, mo, 0).getDate();
  if (d > dim) return '';
  return y + '-' + (mo < 10 ? '0' : '') + mo + '-' + (d < 10 ? '0' : '') + d;
}
function parseFolderName(raw) {
  var s = String(raw == null ? '' : raw).replace(/[ \s]+/g, ' ').trim();
  var out = { raw: String(raw == null ? '' : raw), no: '', name: '', date: '' };
  if (!s) return out;
  s = s.replace(/(\s+[Il|│｜ǀ∣])+\s*$/, '');
  var parts = s.split(/\s+[Il|│｜ǀ∣]\s+/).map(function (x) { return x.trim(); }).filter(Boolean);
  if (parts.length < 2) {
    var m = /^(\d{1,5})[\s._-]+(.+)$/.exec(s);
    parts = m ? [m[1], m[2]] : [s];
  }
  if (/^\d{1,5}$/.test(parts[0]) && parts.length > 1) out.no = parts.shift();
  var last = parts[parts.length - 1], d = parts.length ? parseDateDMY(last) : '';
  if (d) { out.date = d; parts.pop(); }
  else {
    var tm = /^(.*?)[\s_-]+(\d{1,2}[.\-\/]\d{1,2}[.\-\/]\d{2,4})$/.exec(last || '');
    if (tm && parseDateDMY(tm[2])) { out.date = parseDateDMY(tm[2]); parts[parts.length - 1] = tm[1]; }
  }
  out.name = parts.join(' - ').replace(/^[\s\-_.]+|[\s\-_.]+$/g, '');
  if (!out.name) out.name = out.raw.trim();
  return out;
}

/* desktop.ini (often UTF-16) -> the status carried by a custom folder icon such as ".COMPLETED" or ".ON GOING" */
function decodeIni(bytes) {
  var b = bytes || [];
  if (b.length >= 2 && b[0] === 0xFF && b[1] === 0xFE) { var s = ''; for (var i = 2; i + 1 < b.length; i += 2) s += String.fromCharCode(b[i] | (b[i + 1] << 8)); return s; }
  if (b.length >= 2 && b[0] === 0xFE && b[1] === 0xFF) { var t = ''; for (var j = 2; j + 1 < b.length; j += 2) t += String.fromCharCode((b[j] << 8) | b[j + 1]); return t; }
  var u = ''; for (var k = 0; k < b.length; k++) u += String.fromCharCode(b[k]);
  if (b.length > 2 && b[1] === 0 && b[3] === 0) { var w = ''; for (var q = 0; q + 1 < b.length; q += 2) w += String.fromCharCode(b[q] | (b[q + 1] << 8)); return w; }
  try { return decodeURIComponent(escape(u)); } catch (e) { return u; }
}
function parseIniStatus(text) {

  var lines = String(text || '').split(/\r?\n/), hay = [];
  lines.forEach(function (ln) {
    var m = /^\s*(IconResource|IconFile|InfoTip|LocalizedResourceName|ConfirmFileOp|Icon)\s*=\s*(.*)$/i.exec(ln);
    if (!m) return;
    hay.push(m[2]);
    if (/^(IconResource|IconFile|Icon)$/i.test(m[1]) && !out.key) {
      var v = m[2].replace(/,\s*-?\d+\s*$/, '').replace(/^"|"$/g, '');

  else if (/on[\s._-]*going|in[\s._-]*progress|\bactive\b|\bcurrent\b|\brunning\b/i.test(h)) out.status = 'ongoing';

}

var CAT_ORDER = ['05', '06', '04', '01', '02', '03'];
var EXT_CAT = {

  var t = catNorm(text);
  for (var i = 0; i < CAT_ORDER.length; i++) {

/* which standard folder, if any, a name such as "03_Working_Drawings" or "Working Drawings" already is */
function templateOfName(name) {

  });
  if (!hit) { var m = /^0([1-6])[\s_.\-]/.exec(n); if (m && catByWords(n.slice(3))) hit = '0' + m[1]; }

/* entries: [{ rel:'a/b/c.pdf', size, isDir }]  ->  what goes where. Nothing is touched here. */
function planArrangement(entries, o) {
  o = o || {};

  FOLDER_TEMPLATES.forEach(function (f) { plan.summary[f.id] = 0; });
  (entries || []).forEach(function (e) {
    if (e.isDir) return;
    var segs = String(e.rel).split('/'), file = segs.pop();
    plan.total++;
    if (JUNK_FILE.test(file)) { plan.ignored++; return; }
    if (segs.length) {
      var t0 = templateOfName(segs[0]);
      if (t0) {
        /* already in a folder that is one of the six, under the standard name: leave it. Under an older name ("01 Brief", "Working drawings"): bring it into the standard folder */
        var ft0 = FOLDER_TEMPLATES.filter(function (f) { return f.id === t0; })[0];
        if (segs[0].toLowerCase() === ft0.name.toLowerCase()) { plan.placed++; return; }
        plan.ops.push({ from: e.rel, to: ft0.name + '/' + segs.slice(1).concat(file).join('/'), cat: t0, size: e.size || 0, by: 'folder' });
        plan.summary[t0]++;
        return;
      }
    }
    var c = classifyFile(segs, file), cat = c.cat || o.unsorted || '';
    if (!cat) { plan.loose.push(e.rel); return; }
    var ft = FOLDER_TEMPLATES.filter(function (f) { return f.id === cat; })[0];
    var keep = c.cat ? segs.slice(c.strip) : segs;
    plan.ops.push({ from: e.rel, to: ft.name + '/' + keep.concat(file).join('/'), cat: cat, size: e.size || 0, by: c.by || 'default' });
    plan.summary[cat]++;

  return plan;

function attention(list) {
  const inv = [], tasks = [];
  list.forEach((p) => {
    p.milestones.forEach((m, i) => {
      const info = invoiceInfo(p, i, TODAY);
      if (info.status === 'overdue') inv.push({ p: p, m: m, info: info, kind: 'overdue', sort: 0, date: m.invoice.due });
      else if (info.status === 'ready' && info.amount > 0) inv.push({ p: p, m: m, info: info, kind: 'ready', sort: 1, date: '9999' });
      else if (info.status === 'pending' && diffDays(TODAY, m.invoice.due) <= 7) inv.push({ p: p, m: m, info: info, kind: 'due', sort: 2, date: m.invoice.due });
    });
    p.tasks.forEach((t) => { if (t.status !== 'done' && t.due <= addDays(TODAY, 7)) tasks.push({ p: p, t: t }); });
  });
  inv.sort((a, b) => a.sort - b.sort || String(a.date).localeCompare(String(b.date)));
  tasks.sort((a, b) => a.t.due.localeCompare(b.t.due));
  return { inv: inv, tasks: tasks };
}

const STAR = '<svg class="star" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M32 0C34 18 46 30 64 32C46 34 34 46 32 64C30 46 18 34 0 32C18 30 30 18 32 0Z"/></svg>';
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
/* seven days from today: tasks due, invoices due, and anything already late (counted on today) */
function weekData(list) {
  const days = [];
  for (let i = 0; i < 7; i++) days.push({ d: addDays(TODAY, i), tasks: [], inv: [], late: [] });
  list.forEach((p) => {
    p.tasks.forEach((t) => { if (t.status === 'done') return; const i = diffDays(TODAY, t.due), it = { kind: 'task', p: p, t: t }; if (i < 0) days[0].late.push(it); else if (i < 7) days[i].tasks.push(it); });
    p.milestones.forEach((m, k) => {
      if (!m.invoice) return;
      const info = invoiceInfo(p, k, TODAY);
      if (info.status === 'paid') return;
      const i = diffDays(TODAY, m.invoice.due), it = { kind: 'inv', p: p, m: m, k: k, info: info };
      if (i < 0) days[0].late.push(it); else if (i < 7) days[i].inv.push(it);
    });
  });
  return days;
}
const weekCount = (x) => x.tasks.length + x.inv.length + x.late.length;
function weekAhead(list) {
  const days = weekData(list), tot = days.reduce((a, x) => a + weekCount(x), 0);
  const bar = (cls, n, label) => n ? '<i class="' + cls + '" style="height:' + Math.min(14 + (n - 1) * 12, 44) + 'px" title="' + n + ' ' + label + '"></i>' : '';
  return '<section class="card"><div class="sec-head"><h2>Week ahead</h2>' +
    (tot ? '<button type="button" class="count count-btn" data-act="weekOpen" data-i="all" aria-label="View all ' + tot + ' items due this week" title="View everything due this week">' + tot + '</button>' : '<span class="count">0</span>') + '</div><div class="wk">' +
    days.map((x, i) => {
      const n = weekCount(x), wd = WD[new Date(x.d + 'T00:00:00Z').getUTCDay()];
      return '<button type="button" class="wk-col' + (i === 0 ? ' today' : '') + (n ? ' has' : '') + '" data-act="weekOpen" data-i="' + i + '" aria-label="' + wd + ' ' + (+x.d.slice(8)) + ': ' + (n ? n + ' item' + (n === 1 ? '' : 's') + ' due, view them' : 'nothing due') + '"><span class="wk-d">' + wd + '</span><span class="wk-n">' + (+x.d.slice(8)) + '</span>' +
        '<div class="wk-bars">' + bar('b-late', x.late.length, 'overdue items') + bar('b-inv', x.inv.length, 'invoices due') + bar('b-task', x.tasks.length, 'tasks due') + '</div></button>';
    }).join('') + '</div>' +
    '<div class="wk-key"><span><i class="b-task"></i>Tasks due</span><span><i class="b-inv"></i>Invoices due</span><span><i class="b-late"></i>Overdue</span><span class="wk-tip">Click a day to see what is due</span></div></section>';
}

/* ----- project page ----- */
/* isometric wireframe: one slab per stage, finished slabs and the current one drawn in the accent */
function isoPt(x, y, z) { return (82 + (x - y) * 0.866).toFixed(1) + ',' + (185 + (x + y) * 0.5 - z).toFixed(1); }
function tower(p) {
  const A = 110, B = 70, H = 22, G = 3, cur = p.status === 'closed' ? 8 : p.currentStage;
  let g = '', tag = '';
  for (let n = 1; n <= 7; n++) {
    const z0 = (n - 1) * (H + G), z1 = z0 + H, state = n < cur ? 'done' : n === cur ? 'cur' : 'next';
    let hz = '';
    if (state !== 'next') for (let k = 1; k <= 3; k++) { const z = z0 + H * k / 4; hz += '<path class="hz" d="M' + isoPt(A, 0, z) + 'L' + isoPt(A, B, z) + 'L' + isoPt(0, B, z) + '"/>'; }
    g += '<g class="fl ' + state + '"><polygon points="' + [isoPt(0, B, z1), isoPt(A, B, z1), isoPt(A, B, z0), isoPt(0, B, z0)].join(' ') + '"/>' +
      '<polygon points="' + [isoPt(A, 0, z1), isoPt(A, B, z1), isoPt(A, B, z0), isoPt(A, 0, z0)].join(' ') + '"/>' +
      (n === 7 ? '<polygon points="' + [isoPt(0, 0, z1), isoPt(A, 0, z1), isoPt(A, B, z1), isoPt(0, B, z1)].join(' ') + '"/>' : '') + hz + '</g>';
    if (state === 'cur') { const q = isoPt(A, 0, z0 + H / 2).split(','); tag = '<path class="lead" d="M' + q[0] + ',' + q[1] + 'h28"/><rect class="tagbox" x="' + (+q[0] + 28) + '" y="' + (+q[1] - 9) + '" width="18" height="18" rx="4"/><text class="tagtxt" x="' + (+q[0] + 37) + '" y="' + (+q[1] + 4) + '" text-anchor="middle">' + n + '</text>'; }
  }
  const done = p.status === 'closed' ? 7 : p.currentStage - 1;
  return '<aside class="tower"><div class="tw-info"><span class="lbl-up">Stage</span><b class="tw-num">' + Math.min(cur, 7) + '</b><span class="tw-of">of 7</span>' +
    '<span class="small muted">' + esc(STAGES[Math.min(cur, 7) - 1].name) + '</span><span class="small faint">Handover target ' + fd(p.stages[6].end) + '</span></div>' +
    '<svg class="tw-fig" viewBox="0 0 232 290" role="img" aria-label="Tower of seven stages, ' + done + ' complete">' + g + tag + '</svg></aside>';
}

function stepper(p) {
  return '<div class="stepper" role="group" aria-label="Project stage">' + STAGES.map((s) => {
    const cls = p.status === 'closed' || s.n < p.currentStage ? 'done' : s.n === p.currentStage ? 'cur' : '';
    const sp = stageProgress(p, s.n);
    return '<button type="button" class="step ' + cls + '" data-act="setStage" data-id="' + p.id + '" data-n="' + s.n + '" title="Stage ' + s.n + ', ' + esc(s.name) + ': ' + sp.done + ' of ' + sp.total + ' tasks done" aria-label="Set stage ' + s.n + ', ' + esc(s.name) + '"' + (cls === 'cur' ? ' aria-current="step"' : '') + '>' +
      '<i style="--p:' + sp.pct + '%"></i><span class="n mono">' + s.n + '</span><span class="s">' + esc(s.short) + '</span></button>';
  }).join('') + '</div>';

function taskCard(p, t) {

/* project plan chart: one bar per stage, staggered down the page, with a Now marker */
function gantt(p) {
  const s0 = p.stages[0].start, s1 = p.stages[6].end, days = diffDays(s0, s1) + 1;
  const pct = (d) => diffDays(s0, d) / days * 100, half = 0.5 / days * 100;
  const vw = ($('#view') && $('#view').clientWidth) || 1100;
  const plotPx = Math.max(960, vw - 44) - 56;
  const maxTicks = Math.max(4, Math.floor(plotPx / 92)), closed = p.status === 'closed';
  const dm = (d) => (+d.slice(8)) + ' ' + MONTHS[+d.slice(5, 7) - 1];
  const ticks = [];
  if (days / 7 <= maxTicks) { for (let d = 0; d < days; d += 7) ticks.push({ at: addDays(s0, d), label: dm(addDays(s0, d)) }); }
  else if (days / 14 <= maxTicks) { for (let d = 0; d < days; d += 14) ticks.push({ at: addDays(s0, d), label: dm(addDays(s0, d)) }); }
  else {
    const months = [];
    let y = +s0.slice(0, 4), mo = +s0.slice(5, 7);
    for (let g = 0; g < 80; g++) {
      const first = y + '-' + pad2(mo) + '-01';
      if (first > s1) break;
      if (first >= s0) months.push({ at: first, y: y, mo: mo });
      mo++; if (mo > 12) { mo = 1; y++; }
    }
    let k = 1;
    while (Math.ceil(months.length / k) > maxTicks && k < 12) k = k < 3 ? k + 1 : k * 2;
    months.forEach((m, i) => { if (i % k === 0) ticks.push({ at: m.at, label: MONTHS[m.mo - 1] + (m.mo === 1 || !ticks.length ? ' ' + m.y : '') }); });
  }
  const inRange = TODAY >= s0 && TODAY <= s1;
  const now = inRange ? '<div class="g-now" style="left:' + (pct(TODAY) + half).toFixed(2) + '%"><b>Now</b><i></i></div>' : '';
  let rows = '', caps = '';
  STAGES.forEach((st) => {
    const sg = p.stages[st.n - 1], sp = stageProgress(p, st.n);
    const state = closed || st.n < p.currentStage ? 'done' : st.n === p.currentStage ? 'cur' : 'next';
    const open = S.ui.ganttOpen[st.n] !== undefined ? S.ui.ganttOpen[st.n] : st.n === p.currentStage;
    const left = pct(sg.start), width = Math.max(0.5, pct(addDays(sg.end, 1)) - left), nd = diffDays(sg.start, sg.end) + 1;
    const px = width / 100 * plotPx, mode = px >= 215 ? 'full' : px >= 128 ? 'badge' : 'min';
    const bar = '<button type="button" class="g-bar ' + state + '" style="left:' + left.toFixed(2) + '%;width:' + width.toFixed(2) + '%" data-act="toggleGantt" data-n="' + st.n + '" aria-expanded="' + open + '" title="Stage ' + st.n + ', ' + esc(st.name) + ': ' + fd(sg.start) + ' to ' + fd(sg.end) + ', ' + sp.done + ' of ' + sp.total + ' tasks done. Click to ' + (open ? 'hide' : 'show') + ' tasks">' +
      (state === 'cur' ? '<i class="g-prog" style="width:' + sp.pct + '%"></i>' : '') + '<span class="g-num">' + st.n + '</span>' +
      (mode === 'full' ? '<span class="g-name">' + esc(px >= 340 ? st.name : st.short) + '</span>' : '') + (mode !== 'min' ? '<span class="g-days">' + nd + ' days</span>' : '') + '</button>';
    let out = '';
    if (mode !== 'full') {
      const txt = esc(st.short) + (mode === 'min' ? ' <small>' + nd + ' days</small>' : '');
      out = left + width <= 68 ? '<div class="g-out" style="left:calc(' + (left + width).toFixed(2) + '% + 12px)">' + txt + '</div>'
        : '<div class="g-out" style="right:calc(' + (100 - left).toFixed(2) + '% + 12px)">' + txt + '</div>';
    }
    rows += '<div class="g-row">' + bar + out + '</div>';
    caps += '<i class="' + (state === 'next' ? '' : state) + '" style="left:' + left.toFixed(2) + '%;width:calc(' + width.toFixed(2) + '% - 4px)"></i>';
    if (open) {
      p.tasks.filter((t) => t.stage === st.n).sort((a, b) => a.due.localeCompare(b.due)).forEach((t) => {
        const x = pct(t.due) + half, late = t.status !== 'done' && t.due < TODAY, cls = t.status === 'done' ? 'done' : late ? 'late' : '', rev = x > 66;
        rows += '<div class="g-trow"><button type="button" class="g-task ' + cls + (rev ? ' rev' : '') + '" style="' + (rev ? 'right:calc(' + (100 - x).toFixed(2) + '% - 7px)' : 'left:calc(' + x.toFixed(2) + '% - 7px)') +
          '" data-act="editTask" data-pid="' + p.id + '" data-id="' + t.id + '" title="' + esc(t.title) + ', due ' + fd(t.due) + '"><i class="g-dia"></i><span>' + esc(t.title) + '</span></button></div>';
      });
    }
  });
  const ms = p.milestones.map((m, i) => {
    const info = invoiceInfo(p, i, TODAY), x = pct(p.stages[m.stage - 1].end) + half, rev = x > 70;
    const st = info.status === 'paid' ? 'paid' : info.status === 'overdue' ? 'overdue' : info.status === 'pending' ? 'pending' : '';
    return '<div class="g-ms ' + st + (rev ? ' rev' : '') + '" style="top:' + (i % 2 ? 36 : 0) + 'px;' + (rev ? 'right:calc(' + (100 - x).toFixed(2) + '% - 8px)' : 'left:calc(' + x.toFixed(2) + '% - 8px)') + '" title="' + esc(m.label) + ', ' + m.pct + '%, ' + (STATUS[info.status] || ['', ''])[1] + '">' +
      '<i class="g-dia"></i><span>' + esc(m.label) + ' ' + m.pct + '%<small>' + moneyC(info.amount) + ' · ' + (STATUS[info.status] || ['', ''])[1] + '</small></span></div>';
  }).join('');
  const dur = (days / 30.44).toFixed(1);
  return '<section class="gcard" aria-label="Project plan"><div class="g-top"><div><h2>Project plan</h2><div class="g-sub">' + esc(p.code) + ' · ' + fd(s0) + ' to ' + fd(s1) + '</div></div>' +
    '<div class="g-dur">' + dur + '<span>months</span></div></div>' +
    '<div class="gscroll" data-keep="gantt"><div class="gin"><div class="g-plot">' + now +
    ticks.map((t) => '<i class="g-guide" style="left:' + pct(t.at).toFixed(2) + '%"></i>').join('') +
    '<div class="g-axis">' + ticks.map((t) => '<span class="g-tick" style="left:' + pct(t.at).toFixed(2) + '%">' + esc(t.label) + '</span>').join('') + '</div>' +
    '<div class="g-rows">' + rows + '</div>' +

  if (info.status === 'ready') act = '<button type="button" class="btn sm primary" data-act="genInvoice" ' + id + '>Generate invoice</button>';

function msHead(withProject) {

function logTable(projects, withProject, removable) {
  const rows = [];
  projects.forEach((p) => {
    p.milestones.forEach((m) => m.receipts.forEach((r) => rows.push({ p: p, m: m, r: r, kind: 'payment' })));

  });

  return '<div class="tbl-wrap"><table style="min-width:720px"><thead><tr><th>Date</th>' + (withProject ? '<th>Project</th>' : '') + '<th>Invoice</th><th>Method</th><th>Reference</th><th class="num">Paid</th><th class="num">Retained</th><th class="num">Net received</th>' + (removable ? '<th></th>' : '') + '</tr></thead><tbody>' +

function viewPayments() {
  if (!Object.keys(S.projects).length) return emptyAll();
  if (S.ui.payProject !== 'all' && !P(S.ui.payProject)) S.ui.payProject = 'all';
  const q = S.ui.q.trim().toLowerCase();
  let list = Object.values(S.projects).filter((p) => !S.ui.phase || p.currentStage === S.ui.phase);
  if (S.ui.payProject !== 'all') list = list.filter((p) => p.id === S.ui.payProject);
  list.sort((a, b) => a.code.localeCompare(b.code));
  const fin = totalsFinance(list, TODAY);
  const order = { overdue: 0, ready: 1, pending: 2, scheduled: 3, paid: 4 };
  const rows = [];
  list.forEach((p) => p.milestones.forEach((m, i) => {
    const info = invoiceInfo(p, i, TODAY);
    if (S.ui.payStatus !== 'all' && info.status !== S.ui.payStatus) return;
    if (q && [p.code, p.name, p.client.name, m.label, m.invoice ? m.invoice.no : ''].join(' ').toLowerCase().indexOf(q) === -1) return;
    rows.push({ p: p, i: i, info: info });
  }));
  rows.sort((a, b) => order[a.info.status] - order[b.info.status] || a.p.code.localeCompare(b.p.code) || a.i - b.i);
  const all = Object.values(S.projects).sort((a, b) => a.code.localeCompare(b.code));
  const statusOpts = [['all', 'All statuses'], ['overdue', 'Overdue'], ['pending', 'Pending'], ['ready', 'Ready to invoice'], ['paid', 'Paid'], ['scheduled', 'Scheduled']];
  return '<div class="page-head"><div><h1>Payments</h1><p class="muted">Stage-wise billing across ' + list.length + ' project' + (list.length === 1 ? '' : 's') + '</p></div>' +
    '<div class="toolbar"><label class="sel"><span>Status</span><select data-change="payStatus" aria-label="Filter by invoice status">' + statusOpts.map((o) => '<option value="' + o[0] + '"' + (S.ui.payStatus === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></label>' +
    '<label class="sel"><span>Project</span><select data-change="payProject" aria-label="Filter by project"><option value="all">All projects</option>' + all.map((p) => '<option value="' + p.id + '"' + (S.ui.payProject === p.id ? ' selected' : '') + '>' + esc(p.code) + '</option>').join('') + '</select></label>' +
    (DL ? '<button type="button" class="btn" data-act="exportPayments">' + icon('down', 16) + 'Export CSV</button>' : '') + '</div></div>' +
    kpis(fin, list.length) + flowCard(fin, 'Cash flow') +
    '<section><div class="sec-head"><h2>Invoices and milestones</h2><span class="count">' + rows.length + '</span></div><div style="margin-top:12px">' +
    (rows.length ? '<div class="tbl-wrap"><table>' + msHead(true) + '<tbody>' + rows.map((r) => msRow(r.p, r.i, true)).join('') + '</tbody></table></div>' : noMatch()) + '</div></section>' +

}
