<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Loading</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; font-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
/* A short, quiet loading card: the icon and name fade in, a thin line runs underneath until the dashboard is ready. */
:root{--bg:#0F0F12;--ink:#EDEDF0;--ink-2:#72727D;--line:#222228;--track:#1D1D22;--accent:#7C6CF0;--shadow:rgba(0,0,0,.6)}
:root.light{--bg:#FFFFFF;--ink:#17171C;--ink-2:#7E7E89;--line:#E4E4EA;--track:#EEEEF2;--shadow:rgba(23,23,28,.2)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;-webkit-user-select:none;user-select:none;cursor:default}
body{display:grid;place-items:center}
.card{width:300px;height:220px;border-radius:14px;background:var(--bg);border:1px solid var(--line);box-shadow:0 20px 44px -16px var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:in .22s cubic-bezier(.2,0,0,1) both}
.icon{width:56px;height:56px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:var(--accent);color:#fff;font:600 24px/1 'Segoe UI',sans-serif;animation:icon .32s .04s cubic-bezier(.2,0,0,1) both}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.name{font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--ink);max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fade .3s .1s ease-out both}
.track{width:120px;height:2px;border-radius:2px;background:var(--track);overflow:hidden;animation:fade .3s .16s ease-out both}
.track i{display:block;width:40%;height:100%;border-radius:2px;background:var(--accent);animation:run 1.1s cubic-bezier(.4,0,.2,1) infinite}
/* Seedform: the primary logo ("seed" over a big "form", then the seed), in ink on limewash or night garden.
   It plays the motion logo once: the seed drops and bounces, "form" grows up from the baseline, "seed" rises in. */
.logo{display:none;flex-direction:column;align-items:flex-start;gap:2px;color:var(--canopy)}
.logo .a{font-family:'Inter','Segoe UI',system-ui,sans-serif;font-weight:600;font-size:29px;line-height:1;letter-spacing:-.02em;margin-left:2px;animation:rise .5s .62s cubic-bezier(.2,.8,.2,1) both}
.logo .r{display:flex;align-items:baseline;gap:5px}
.logo .b{font-family:'Archivo Black','Arial Black',sans-serif;font-size:64px;line-height:.86;letter-spacing:-.02em;transform-origin:50% 100%;animation:grow .5s .4s cubic-bezier(.2,.8,.2,1) both}
.logo .d{display:inline-block;width:19px;height:19px;border-radius:50%;background:var(--sprout);flex:none;animation:drop .62s cubic-bezier(.55,0,1,.45) both}
@keyframes drop{0%{transform:translateY(-120px)}64%{transform:none;animation-timing-function:cubic-bezier(0,.55,.45,1)}82%{transform:translateY(-12px);animation-timing-function:cubic-bezier(.55,0,1,.45)}100%{transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.has-logo .icon,.has-logo .name{display:none}.has-logo .logo{display:flex}
.has-logo .card{gap:22px;overflow:hidden;border-radius:2px;box-shadow:none;background:var(--sf-bg);border-color:var(--sf-line)}
.has-logo .track{border-radius:0;background:var(--sf-line)}
.has-logo .track i{border-radius:0;background:var(--sprout)}
.has-logo .cap{font-family:'Inter','Segoe UI',sans-serif;color:var(--sf-muted);font-size:12px}
:root{--canopy:#EDEAE2;--sprout:#8DBB78;--sf-bg:#131814;--sf-line:#323A34;--sf-muted:#A9AD9F}
:root.light{--canopy:#1F3B2D;--sprout:#5E8A4C;--sf-bg:#F4F1EA;--sf-line:#D3CBBA;--sf-muted:#5A5D52}
.cap{font-size:11px;color:var(--ink-2);letter-spacing:.02em;animation:fade .3s .2s ease-out both}
.out .card{animation:out .18s ease-in forwards}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes icon{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes out{to{opacity:0}}
.still *{animation:none!important}.still .track i{width:100%}
</style>
</head>
<body>
<div class="card" role="status" aria-label="Loading">
  <div class="logo" role="img" aria-label="Seedform"><span class="a">seed</span><span class="r"><span class="b">form</span><i class="d"></i></span></div>
  <div class="icon" id="icon"></div>
  <div class="name" id="name">Seedform</div>
  <div class="track" aria-hidden="true"><i></i></div>
  <div class="cap">Architecture, grown from an idea.</div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search), root = document.documentElement;
  var name = q.get('name') || 'Seedform', accent = q.get('accent') || '#7C6CF0';
  if (q.get('theme') === 'light') root.classList.add('light');
  if (q.get('motion') === '0') root.classList.add('still');
  if (/^#[0-9a-f]{6}$/i.test(accent)) root.style.setProperty('--accent', accent);
  document.getElementById('name').textContent = name;
  /* the Seedform logo, set in its own type (passed as file links), unless the app was given another name or icon */
  if (q.get('logo')) {
    var css = '', f = function (fam, url, w) { return url ? '@font-face{font-family:\'' + fam + '\';font-weight:' + w + ';src:url(' + JSON.stringify(url) + ')}' : ''; };
    css += f('Archivo Black', q.get('display'), '400') + f('Inter', q.get('text'), '100 900');
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    root.classList.add('has-logo');
  }
  var box = document.getElementById('icon'), src = q.get('icon');
  var letter = function () { box.textContent = name.charAt(0).toUpperCase(); };
  if (src) { var img = new Image(); img.alt = ''; img.onload = function () { box.style.background = 'none'; box.appendChild(img); }; img.onerror = letter; img.src = src; } else letter();
  if (window.splash) window.splash.onDone(function () { root.classList.add('out'); });
})();
</script>
</body>
</html>
