<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src file:">
<title>Ceylon Buildex</title>
<style>
/* The start-up screen: the same frame, title bar, type and colours as the portal (web/css/app.css), shown while the back end starts. */
@font-face{font-family:"Inter";src:url("fonts/inter-Regular.woff") format("woff");font-weight:400}
@font-face{font-family:"Inter";src:url("fonts/inter-Medium.woff") format("woff");font-weight:500}
@font-face{font-family:"Inter";src:url("fonts/inter-SemiBold.woff") format("woff");font-weight:600}
:root{--bg:#0b0b0d;--panel:#121215;--raise:#18181c;--raise-2:#202025;--hover:rgba(255,255,255,.045);--line:rgba(255,255,255,.065);--line-2:rgba(255,255,255,.105);
  --ink:#ececef;--ink-2:#a3a3ab;--ink-3:#6c6c75;--orange:#ff5a2d;--on-orange:#0b0b0d;--bad:#ff7d73;--f:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color-scheme:dark}
:root.light{--bg:#f3f3f1;--panel:#fff;--raise:#f6f6f5;--raise-2:#ececea;--hover:rgba(0,0,0,.04);--line:rgba(0,0,0,.07);--line-2:rgba(0,0,0,.11);
  --ink:#141416;--ink-2:#5f5f67;--ink-3:#9a9aa1;--orange:#f4481f;--on-orange:#141416;--bad:#c0362c;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.55 var(--f);-webkit-font-smoothing:antialiased;user-select:none;padding:8px 8px 32px}
.frame{height:100%;display:grid;grid-template-rows:auto 1fr;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;height:52px;padding:0 12px 0 14px;border-bottom:1px solid var(--line);-webkit-app-region:drag}
.logo{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(180deg,var(--raise-2),var(--raise));border:1px solid var(--line-2)}
.logo svg{width:18px;height:18px;stroke-width:2.2}
.brand{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.winctl{margin-left:auto;display:flex;align-items:center;gap:4px;padding-left:12px;border-left:1px solid var(--line);height:24px;-webkit-app-region:no-drag}
.wc{width:32px;height:32px;display:grid;place-items:center;padding:0;border:0;border-radius:9px;background:none;color:var(--ink-2);cursor:pointer;transition:background 140ms,color 140ms,transform 140ms}
.wc:hover{background:var(--hover);color:var(--ink)}
.wc.close:hover{background:var(--orange);color:var(--on-orange)}
.wc:active{transform:scale(.92)}
.wc:focus-visible,.btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.blur .wc:not(:hover){color:var(--ink-3)}
svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{display:grid;place-items:center;padding:24px 24px 12vh}
.box{display:grid;justify-items:center;gap:14px;text-align:center;max-width:560px}
.orb{position:relative;width:56px;height:56px;margin-bottom:8px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff 0,#e9e9ee 12%,color-mix(in srgb,var(--orange) 22%,#9b9ba8) 38%,#3a3a44 68%,#16161b 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 30px -8px color-mix(in srgb,var(--orange) 60%,transparent),inset 0 -3px 6px rgba(0,0,0,.35);animation:breathe 2.4s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:18% 22% 48% 26%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.85),transparent 70%);filter:blur(1px)}
@keyframes breathe{50%{transform:scale(1.05)}}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.shim{background:linear-gradient(90deg,var(--ink-3) 0%,var(--ink) 45%,var(--ink-3) 90%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.8s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-150% 0}}
p{margin:0;color:var(--ink-2);font-size:13.5px}
.track{width:200px;height:3px;border-radius:2px;background:var(--raise-2);overflow:hidden}
.track b{display:block;width:40%;height:100%;border-radius:2px;background:var(--orange);animation:slide 1.1s cubic-bezier(.4,0,.2,1) infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.err{display:none}
.failed .err{display:grid}.failed .ok{display:none}
.err .orb{animation:none;filter:grayscale(1)}
.err p{color:var(--ink);font-size:14.5px;max-width:52ch}
.err small{color:var(--ink-3);font-size:12.5px;word-break:break-all}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px}
.btn{display:inline-flex;align-items:center;min-height:36px;padding:0 16px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:500 13.5px/1 var(--f);cursor:pointer;transition:background 140ms}
.btn:hover{background:color-mix(in srgb,var(--ink) 86%,var(--bg))}
.btn.quiet{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.quiet:hover{background:var(--hover)}
@media (prefers-reduced-motion:reduce){.orb,.shim,.track b{animation:none}.shim{background:none;color:var(--ink)}}
</style>
<script>
(function () {
  var q = new URLSearchParams(location.search), r = document.documentElement;
  if (q.get("dark") === "0") r.classList.add("light");
  var a = q.get("accent");
  if (/^#[0-9a-f]{6}$/i.test(a || "")) r.style.setProperty("--orange", a);
})();
</script>
</head>
<body>
<div class="frame">
  <header class="top">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16.6 7.6A6 6 0 1 0 16.6 16.4"/><circle cx="17.2" cy="12" r="1.4" fill="var(--orange)" stroke="none"/></svg></span>
    <span class="brand">Ceylon Buildex</span>
    <div class="winctl" role="group" aria-label="Window">
      <button type="button" class="wc" data-win="minimize" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
      <button type="button" class="wc" data-win="maximize" aria-label="Maximize" title="Maximize"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
      <button type="button" class="wc close" data-win="close" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>
  <main>
    <div class="box ok" role="status" aria-live="polite">
      <span class="orb" aria-hidden="true"></span>
      <h1 class="shim">Opening the library</h1>
      <div class="track" aria-hidden="true"><b></b></div>
      <p>Building regulations, gazettes and bidding documents</p>
    </div>
    <div class="box err" role="alert">
      <span class="orb" aria-hidden="true"></span>
      <h1>Could not start</h1>
      <p id="msg"></p>
      <small id="log"></small>
      <div class="row">
        <button type="button" class="btn" id="retry">Try again</button>
        <button type="button" class="btn quiet" id="logs">Open the log folder</button>
      </div>
    </div>
  </main>
</div>
<script>
(function () {
  var w = window.cbDesktop;
  if (!w) return;
  document.querySelector(".winctl").addEventListener("click", function (e) {
    var b = e.target.closest("[data-win]"); if (b) w[b.dataset.win]();
  });
  function paint(s) {
    if (!s) return;
    document.body.classList.toggle("blur", !s.focused);
    var m = document.querySelector('[data-win="maximize"]'), label = s.maximized ? "Restore" : "Maximize";
    m.title = label; m.setAttribute("aria-label", label);
  }
  w.onState(paint); w.state().then(paint);
  w.onBoot(function (s) {
    if (!s.error) return;
    document.getElementById("msg").textContent = s.error;
    document.getElementById("log").textContent = "Details: " + s.log;
    document.body.classList.add("failed");
    document.getElementById("retry").focus();
  });
  document.getElementById("retry").addEventListener("click", function () { document.body.classList.remove("failed"); w.retry(); });
  document.getElementById("logs").addEventListener("click", function () { w.openLogs(); });
})();
</script>
</body>
</html>
